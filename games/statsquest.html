  w.append(el('div',{class:'row'},el('button',{class:'btn sm alt',onclick:()=>{if(confirm('Erase progress for this level?')){state.p[state.lv]=null;if(state.t)state.t[state.lv]={};P();save();go('me');}}},'Reset this level')));
  return w;
}

/* ---------- world ---------- */
function world(id,tab){
  const wd=Q.worlds.find(x=>x.id===id),p=P(),lv=state.lv,w=el('div');
  const rec=p.w[id]||(p.w[id]={});
  w.append(el('div',{class:'row'},el('button',{class:'btn sm alt',onclick:()=>go('map')},'\u2190 Map'),el('span',{class:'chip'},wd.ch)),el('h1',null,wd.emoji+' '+wd.name[lv]));
  const tabs=el('div',{class:'tabs'}),body=el('div');
  [['learn','1 Learn'],['play','2 Play'],['quest','3 Quest']].forEach(t=>{const b=el('button',{class:'tab'+(tab===t[0]?' on':''),onclick:()=>go('world',id,t[0])},t[1]);tabs.append(b);});
  w.append(tabs,body);
  if(tab==='learn')learn(wd,body,rec,id);
  if(tab==='play')play(wd,body,rec,id);
  if(tab==='quest')quest(wd,body,rec,id);
  return w;
}
function learn(wd,body,rec,id){
  const cards=wd.cards[state.lv];let i=0;const card=el('div',{class:'card'});body.append(card);
  function show(){card.innerHTML='';const c=cards[i];
    card.append(el('div',{class:'learn'},el('div',{class:'ic','aria-hidden':'true'},c[2]||wd.emoji),el('div',null,i===0?el('span',{class:'tag'},'From the book: '+wd.ch):null,el('h3',null,c[0]),el('p',{html:c[1]}))),
      el('div',{class:'dots'},cards.map((_,k)=>el('i',{class:k===i?'on':''}))),
      el('div',{class:'row',style:'justify-content:space-between'},el('button',{class:'btn alt sm',disabled:i===0,onclick:()=>{i--;show();}},'\u2190 Back'),
        el('button',{class:'btn'+(i===cards.length-1?' g2':''),onclick:()=>{if(i<cards.length-1){i++;show();}else{if(!rec.learned){rec.learned=true;addXP(10);}save();go('world',id,'play');}}},i===cards.length-1?'To the lab \u2192':'Next \u2192')));}
  show();
}
function play(wd,body,rec,id){
  const p=P();let touches=0;
  const api={touch:()=>{touches++;if(touches===4&&!(p.labs[id])){p.labs[id]=true;addXP(15);Q.toast('Lab bonus: +15 XP');if(Object.keys(p.labs).length>=3)award('lab');save();}}};
  const c=el('div',{class:'card'});body.append(c);
  try{Q.labs[wd.lab](c,state.lv,api);}catch(e){c.append(el('p',null,'Lab error: '+e.message));console.error(e);}
  body.append(el('div',{class:'row'},el('button',{class:'btn',onclick:()=>go('world',id,'quest')},'Start the quest \u2192')));
}
function build(wd,lv,n){
  const out=[];const stat=(wd.qs[lv]||[]).map(q=>({q:q.q,type:'mcq',o:q.o,a:q.a,why:q.why}));
  const pool=S.shuffle(stat);const useGen=wd.gen?Math.ceil(n/2):0;
  for(let i=0;i<useGen;i++){try{const g=wd.gen(lv);if(g)out.push(g);}catch(e){console.error(e);}}
  while(out.length<n&&pool.length)out.push(pool.pop());
  while(out.length<n&&wd.gen){try{out.push(wd.gen(lv));}catch(e){break;}}
  return S.shuffle(out).slice(0,n);
}
function runner(qs,opts,done){
  const L=lvl();let hearts=opts.hearts,idx=0,score=0,streak=0,bestStreak=0,lost=0,xp=0;
  const box=el('div',{class:'card'});
  function hud(){return el('div',{class:'hud'},el('span',{class:'chip'},'Question '+(idx+1)+' / '+qs.length),el('span',{class:'hearts','aria-label':hearts+' hearts'},'❤️'.repeat(hearts)+'🖤'.repeat(Math.max(0,opts.hearts-hearts))),streak>1?el('span',{class:'chip'},'🔥 '+streak+' in a row'):null,el('span',{class:'chip'},'+'+xp+' XP'));}
  function finish(win){const pct=Math.round(100*score/qs.length);done({score,pct,win,bestStreak,lost,xp,total:qs.length});}
  function ask(){
    if(idx>=qs.length||hearts<=0){finish(hearts>0);return;}
    const q=qs[idx];box.innerHTML='';box.append(hud(),el('div',{class:'qtext',html:q.q}));
    if(q.data)box.append(el('div',{class:'data'},q.data));
    const fb=el('div',{class:'fb',role:'status','aria-live':'polite'});let answered=false,hintUsed=false;
    const nextBtn=el('button',{class:'btn',style:'display:none',onclick:()=>{idx++;ask();}},idx===qs.length-1?'Finish \u2192':'Next \u2192');
    const why=el('div',{class:'why',style:'display:none'});
    function result(ok,detail){if(answered)return;answered=true;
      if(ok){score++;streak++;bestStreak=Math.max(bestStreak,streak);const g=10+Math.min(streak-1,5)*2-(hintUsed?2:0);xp+=g;fb.className='fb good';fb.textContent='Correct! +'+g+' XP';if(streak===6)award('fire');}
      else{streak=0;hearts--;lost++;fb.className='fb bad';fb.textContent='Not quite. You lost a heart.';box.classList.remove('shake');void box.offsetWidth;box.classList.add('shake');}
      why.style.display='';why.innerHTML=(detail||'')+(q.why?'<br>'+q.why:'');nextBtn.style.display='';nextBtn.focus();const h=box.querySelector('.hearts');if(h){h.textContent='❤️'.repeat(hearts)+'🖤'.repeat(Math.max(0,opts.hearts-hearts));}
      if(hearts<=0){nextBtn.textContent='See result \u2192';}}
    if(q.type==='mcq'){const order=S.shuffle(q.o.map((t,i)=>({t,i})));box.append(el('div',{class:'opts'},order.map(o=>el('button',{class:'opt',onclick:ev=>{if(answered)return;const ok=o.i===q.a;ev.currentTarget.classList.add(ok?'right':'wrong');if(!ok)box.querySelectorAll('.opt').forEach((b,k)=>{if(order[k].i===q.a)b.classList.add('right');});result(ok);}},o.t))));}
    else{const inp=el('input',{class:'ans',type:'number',step:'any',placeholder:q.unit?('answer in '+q.unit):'your answer','aria-label':'Your answer'});
      const go2=()=>{if(inp.value===''||answered)return;const v=+inp.value;const ok=Math.abs(v-q.ans)<=q.tol;result(ok,ok?'':'The answer was <b>'+S.f(q.ans,Math.abs(q.ans)<10?3:2)+(q.unit?' '+q.unit:'')+'</b>.');};
      inp.addEventListener('keydown',e=>{if(e.key==='Enter')go2();});
      const hb=q.hint?el('button',{class:'btn sm alt',onclick:()=>{if(hintUsed||answered)return;hintUsed=true;hintBox.style.display='';hintBox.textContent='Hint: '+q.hint;hb.disabled=true;}},'Hint (\u22122 XP)'):null;
      const hintBox=el('div',{class:'why',style:'display:none'});
      box.append(el('div',{class:'row'},inp,el('button',{class:'btn',onclick:go2},'Check'),hb),hintBox);}
    box.append(fb,why,nextBtn);
  }
  ask();return box;
}
function quest(wd,body,rec,id){
  const p=P(),L=lvl();
  const intro=el('div',{class:'card'},el('h3',null,'Quest: '+wd.name[state.lv]),el('p',null,'6 questions. You start with '+L.hearts+' hearts. Each correct answer earns XP and streaks earn a bonus. Score 70% or more to master this world.'),el('button',{class:'btn',onclick:start},'Begin quest'));
  body.append(intro);
  function start(){
    body.innerHTML='';const qs=build(wd,state.lv,6);
    body.append(runner(qs,{hearts:L.hearts},r=>{
      body.innerHTML='';
      if(!p.firstQuest){p.firstQuest=true;award('first');}
      const stars=r.pct>=90?3:r.pct>=70?2:r.pct>=50?1:0;
      addXP(r.xp+(r.pct>=70?30:0));
      const was=!!rec.done;
      if(r.pct>=70){rec.done=true;rec.stars=Math.max(rec.stars||0,stars);Q.confetti();}
      if(r.pct===100)award('perfect');if(r.lost===0&&r.pct===100)award('nohurt');
      if(mastered(p)>=4)award('half');if(mastered(p)>=8)award('all');
      save();finishCheck(state.lv);
      const win=r.pct>=70;
      body.append(el('div',{class:'card win'},win?el('div',{class:'badge'},wd.emoji):el('div',{style:'font-size:3rem'},'💪'),el('h2',null,win?'World mastered!':'Good try. Let\u2019s go again.'),
        win?el('div',{class:'stars'},'⭐'.repeat(stars)+'☆'.repeat(3-stars)):null,
        el('p',null,r.score+' of '+r.total+' correct ('+r.pct+'%). You earned '+(r.xp+(win?30:0))+' XP'+(win?' (includes a 30 XP mastery bonus)':'')+'.'),
        el('div',{class:'row',style:'justify-content:center'},el('button',{class:'btn alt',onclick:()=>go('world',id,'learn')},'Review lessons'),el('button',{class:'btn g2',onclick:()=>go('world',id,'quest')},'Play again'),el('button',{class:'btn',onclick:()=>go('map')},'Back to map'))));
    }));
  }
}
function boss(){
  const p=P(),L=lvl(),w=el('div');
  const ids=Q.worlds.filter(x=>p.w[x.id]&&p.w[x.id].done);
  w.append(el('div',{class:'row'},el('button',{class:'btn sm alt',onclick:()=>go('map')},'\u2190 Map')),el('h1',null,'🐉 Boss Arena'));
  const card=el('div',{class:'card'},el('p',null,'The Data Dragon asks 8 mixed questions from the worlds you have mastered. You have '+(L.hearts-1)+' hearts. Defeat it with 75% or more.'),el('button',{class:'btn g3',onclick:start},'Fight!'));
  w.append(card);
  function start(){
    const qs=[];for(let i=0;i<8;i++){const wd=S.pick(ids);const q=build(wd,state.lv,1)[0];if(q)qs.push(q);}
    const holder=el('div');w.append(holder);card.remove();
    holder.append(runner(qs,{hearts:Math.max(2,L.hearts-1)},r=>{holder.innerHTML='';const win=r.pct>=75&&r.win;addXP(r.xp+(win?60:0));
      if(r.pct>p.boss){p.boss=r.pct;}if(win){award('boss');Q.confetti();}save();
      holder.append(el('div',{class:'card win'},el('div',{style:'font-size:4rem'},win?'🏆':'🐉'),el('h2',null,win?'You defeated the Data Dragon!':'The dragon survives\u2026 this time.'),el('p',null,r.score+' of 8 correct ('+r.pct+'%). +'+(r.xp+(win?60:0))+' XP.'),el('div',{class:'row',style:'justify-content:center'},el('button',{class:'btn',onclick:()=>go('boss')},'Fight again'),el('button',{class:'btn alt',onclick:()=>go('map')},'Back to map'))));}));
  }
  return w;
}
Q._build=build;
Q.start=()=>{go("home");const pd=(state.remind&&state.email)?pending():null;if(pd)setTimeout(()=>Q.toast('🔔 '+(state.name||'Hey')+', finish '+LV[pd.lv].name+': '+pd.done+'/'+Q.worlds.length+' worlds done'),700);};
})();
window.Q.start();
</script>

 After that: each time a player saves their email the game POSTs their progress
 (doPost keeps ONE row per email). The League table reads every player back with
 doGet via a JSONP callback, so players on OTHER devices appear too. Columns:
 Timestamp, Email, Username, Avatar, then per level E/A/S: worlds, time-ms, fin,
 and Last event.

 NOTE: if you already created a 'Players' tab with the earlier columns, delete

 function sheet_(){
   var ss = SpreadsheetApp.getActiveSpreadsheet();
   var sh = ss.getSheetByName('Players') || ss.insertSheet('Players');
   if (sh.getLastRow() === 0) sh.appendRow(['Timestamp','Email','Username','Avatar','E_worlds','E_ms','E_fin','A_worlds','A_ms','A_fin','S_worlds','S_ms','S_fin','Last event']);
   return sh;
 }
 function findEmail_(sh, email){
   if (!email || sh.getLastRow() < 2) return -1;
   var col = sh.getRange(2,2,sh.getLastRow()-1,1).getValues();
   for (var i=0;i<col.length;i++){ if ((col[i][0]||'').toString().trim().toLowerCase()===email) return i+2; }
   return -1;
 }
 function num_(x){ var n = parseInt(x,10); return isNaN(n)?0:n; }
 function doPost(e){
   var lock = LockService.getScriptLock(); lock.waitLock(30000);
   try {
     var d = JSON.parse(e.postData.contents);
     var sh = sheet_();
     var email = (d.email || '').toString().trim().toLowerCase();
     var row = [new Date(), email, d.name||'', d.avatar||'',
       num_(d.e_worlds), d.e_ms||'', num_(d.e_fin),
       num_(d.a_worlds), d.a_ms||'', num_(d.a_fin),
       num_(d.s_worlds), d.s_ms||'', num_(d.s_fin), d.event||''];
     var r = findEmail_(sh, email);
     if (r > 0) sh.getRange(r,1,1,row.length).setValues([row]);
     else sh.appendRow(row);
     return ContentService.createTextOutput(JSON.stringify({ok:true})).setMimeType(ContentService.MimeType.JSON);
   } catch (err) {
     return ContentService.createTextOutput(JSON.stringify({ok:false, error:String(err)})).setMimeType(ContentService.MimeType.JSON);
   } finally { lock.releaseLock(); }
 }
 function doGet(e){
   try {
     var sh = sheet_(); var players = [];
     if (sh.getLastRow() > 1) {
       var v = sh.getRange(2,1,sh.getLastRow()-1,14).getValues();
       players = v.map(function(r){ return {
         ts:r[0], email:r[1], name:r[2], avatar:r[3],
         e_worlds:r[4], e_ms:r[5], e_fin:r[6],
         a_worlds:r[7], a_ms:r[8], a_fin:r[9],
         s_worlds:r[10], s_ms:r[11], s_fin:r[12] }; });
     }
     var out = JSON.stringify({ok:true, players:players});
     var cb = e && e.parameter && e.parameter.callback;
     if (cb) return ContentService.createTextOutput(cb + '(' + out + ')').setMimeType(ContentService.MimeType.JAVASCRIPT);
     return ContentService.createTextOutput(out).setMimeType(ContentService.MimeType.JSON);
   } catch (err) {
     return ContentService.createTextOutput(JSON.stringify({ok:false, error:String(err)})).setMimeType(ContentService.MimeType.JSON);
   }
 }
