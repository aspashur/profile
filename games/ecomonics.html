W({id:19,pack:'macro',emoji:'✖️',ch:'Macroeconomics Appendix B: The Expenditure-Output Model',lab:'cross',
name:{e:'Spending Ladder',a:'The Expenditure Model',s:'The Keynesian Cross'},
tag:{e:'Where does total spending equal total production?',a:'The consumption function, aggregate expenditure and the multiplier.',s:'Equilibrium with taxes and imports, gaps and the policy needed to close them.'},
cards:{
e:[['Spending and making',`An economy makes things and people spend money on them. If people spend <b>less</b> than what is made, goods pile up and factories slow down. If they spend <b>more</b>, shops sell out and factories speed up. The economy settles where <b>spending equals production</b>.`,'🏭'],
['Spending from income',`Even with no income people spend something (they must eat). Then for each extra dollar they get, they spend <b>part</b> of it and save the rest. The part they spend is called the <b>marginal propensity to consume</b> (MPC).`,'💵'],
['Ripples again',`When someone spends, someone else earns. So an extra bit of spending makes the economy grow by <b>more</b> than that bit. The size of this ripple is the <b>multiplier</b>.`,'🌊']],
a:[['The consumption function',`<b>C = C\u2080 + MPC \u00d7 Y.</b> With C\u2080 = 600 and MPC = 0.8, an income of $4,000 gives consumption 600 + 0.8 \u00d7 4,000 = $3,800. MPC + MPS = 1, where MPS is the marginal propensity to save.`,'🧾'],
['Aggregate expenditure',`<b>AE = C + I + G + (X \u2212 M).</b> Equilibrium is where <b>AE = Y</b>, the 45\u00b0 line: Y* = (C\u2080 + I + G + NX) \u00f7 (1 \u2212 MPC). Above Y*, firms pile up unsold goods and cut output; below it, output rises.`,'📈'],
['Multiplier and gaps',`<b>Multiplier = 1 \u00f7 (1 \u2212 MPC) = 1 \u00f7 MPS.</b> If equilibrium GDP is below <b>potential GDP</b> there is a <b>recessionary gap</b>; above it, an <b>inflationary gap</b>. To close a gap use spending change = gap \u00f7 multiplier.`,'🎯']],
s:[['The model in full',`AE = C\u2080 + MPC(1 \u2212 t)Y + I + G + NX \u2212 mY, where t is the income tax rate and m the marginal propensity to import. Slope of AE = MPC(1 \u2212 t) \u2212 m. Equilibrium: Y* = A/(1 \u2212 MPC(1 \u2212 t) + m), with A autonomous spending.`,'📐'],
['Multiplier with leakages',`Taxes and imports are <b>leakages</b> that reduce the part of each extra dollar of income that is re-spent, so the multiplier is smaller: 1/(1 \u2212 MPC(1 \u2212 t) + m). Higher savings, taxes or imports lower it.`,'🕳️'],
['Policy and limits',`To close a recessionary gap increase G or cut taxes by about gap \u00f7 multiplier. In the Keynesian model prices are sticky and output adjusts. In the long run potential GDP is determined by supply, so persistent gaps are a short-run issue.`,'🧭']]},
qs:{
e:[mc(`If people spend less than what is produced, then\u2026`,[`unsold goods pile up and production falls`,`production rises`,`prices vanish`,`nothing`],0,`Firms cut output.`),
mc(`The marginal propensity to consume is the part of an extra dollar that is\u2026`,[`spent`,`saved`,`taxed`,`lost`],0,`MPS is the saved part.`),
mc(`The multiplier means extra spending makes GDP grow by\u2026`,[`more than the extra spending`,`less than the extra spending`,`nothing`,`the same`],0,`Spending becomes income.`),
mc(`The economy settles where\u2026`,[`spending equals production`,`spending is zero`,`production is zero`,`taxes are zero`],0,`That is equilibrium.`)],
a:[mc(`If MPC = 0.8, then MPS =\u2026`,[`0.2`,`0.8`,`1.8`,`0.08`],0,`MPC + MPS = 1.`),
mc(`The multiplier when MPC = 0.8 is\u2026`,[`5`,`0.8`,`1.25`,`8`],0,`1 \u00f7 0.2.`),
mc(`A recessionary gap means equilibrium GDP is\u2026`,[`below potential GDP`,`above potential GDP`,`equal to zero`,`equal to potential`],0,`Output is below capacity.`),
mc(`At equilibrium in the expenditure model\u2026`,[`AE = Y`,`AE = 0`,`C = I`,`G = T`],0,`The 45\u00b0 line.`)],
s:[mc(`Taxes and imports make the multiplier\u2026`,[`smaller`,`larger`,`infinite`,`negative`],0,`They are leakages.`),
mc(`The slope of the AE line with taxes and imports is\u2026`,[`MPC(1 \u2212 t) \u2212 m`,`MPC + t + m`,`1 \u2212 MPC`,`MPC \u00f7 m`],0,`Only the part re-spent domestically.`),
mc(`To close a recessionary gap, spending should rise by about\u2026`,[`gap \u00f7 multiplier`,`gap \u00d7 multiplier`,`gap`,`MPC`],0,`The multiplier magnifies the change.`),
mc(`If AE is above the 45\u00b0 line, output will\u2026`,[`rise`,`fall`,`stay`,`double`],0,`Spending exceeds production.`)]},
gen:function(lv){
  if(lv==='e'){if(Math.random()<0.5){const c0=S.pick([400,600,800]),mp=S.pick([0.5,0.8,0.9]),y=S.pick([2000,4000,5000]);return {q:`People spend <b>${c0}</b> even with no income, plus <b>${mp*100}%</b> of any income. If income is <b>${y}</b>, how much do they spend?`,type:'num',ans:c0+mp*y,tol:0.5,hint:`${c0} + ${mp} \u00d7 ${y}`,why:`${c0} + ${mp*y} = ${c0+mp*y}.`};}
    const mp=S.pick([0.5,0.75,0.8,0.9]);return {q:`People spend <b>${mp*100}%</b> of each extra dollar of income. What is the multiplier 1 \u00f7 (1 \u2212 MPC)?`,type:'num',ans:1/(1-mp),tol:0.01,hint:`1 \u00f7 ${f(1-mp,2)}`,why:`1 \u00f7 ${f(1-mp,2)} = ${f(1/(1-mp),2)}.`};}
  if(lv==='a'){const t=S.pick(['ae','eq','gap']);const c0=S.pick([400,600,800]),mp=S.pick([0.75,0.8,0.9]),I=S.pick([300,500,700]),G=S.pick([400,600,800]),nx=S.pick([-100,0,100]);
    if(t==='ae'){const y=S.pick([2000,4000,6000]);return {q:`C = ${c0} + ${mp}Y, I = ${I}, G = ${G}, NX = ${nx}. Find aggregate expenditure when Y = ${y}.`,type:'num',ans:c0+mp*y+I+G+nx,tol:0.5,hint:`C + I + G + NX`,why:`${c0+mp*y} + ${I} + ${G} + ${nx} = ${c0+mp*y+I+G+nx}.`};}
    if(t==='eq'){const Y=(c0+I+G+nx)/(1-mp);return {q:`C = ${c0} + ${mp}Y, I = ${I}, G = ${G}, NX = ${nx}. Find equilibrium GDP: Y = (C\u2080 + I + G + NX) \u00f7 (1 \u2212 MPC).`,type:'num',ans:Y,tol:0.5,hint:`(${c0+I+G+nx}) \u00f7 ${f(1-mp,2)}`,why:`${c0+I+G+nx} \u00f7 ${f(1-mp,2)} = ${f(Y,1)}.`};}
    const gap=S.pick([200,300,400,500]);return {q:`MPC = ${mp}. Equilibrium GDP is ${gap} below potential GDP. By how much must government spending rise to close the gap (gap \u00f7 multiplier)?`,type:'num',ans:gap*(1-mp),tol:0.05,hint:`multiplier = ${f(1/(1-mp),2)}`,why:`${gap} \u00f7 ${f(1/(1-mp),2)} = ${f(gap*(1-mp),2)}.`};}
  const t=S.pick(['mult','eq','dg']);const mp=S.pick([0.8,0.9]),tx=S.pick([0.1,0.2,0.25]),m=S.pick([0.05,0.1,0.15]);const sl=mp*(1-tx)-m;
  if(t==='mult')return {q:`MPC = ${mp}, tax rate t = ${tx*100}%, marginal propensity to import m = ${m*100}%. Compute the multiplier 1 \u00f7 (1 \u2212 MPC(1 \u2212 t) + m) (2 decimals).`,type:'num',ans:1/(1-sl),tol:0.01,hint:`MPC(1 \u2212 t) \u2212 m = ${f(sl,3)}`,why:`1 \u00f7 (1 \u2212 ${f(sl,3)}) = ${f(1/(1-sl),2)}.`};
  const A=S.pick([1800,2000,2400]);if(t==='eq')return {q:`Autonomous spending is ${A}. MPC = ${mp}, t = ${tx*100}%, m = ${m*100}%. Compute equilibrium GDP = A \u00f7 (1 \u2212 MPC(1 \u2212 t) + m).`,type:'num',ans:A/(1-sl),tol:0.5,hint:`slope = ${f(sl,3)}`,why:`${A} \u00f7 ${f(1-sl,3)} = ${f(A/(1-sl),1)}.`};
  const gap=S.pick([300,500,800]);return {q:`The multiplier is ${f(1/(1-sl),2)} (MPC ${mp}, t ${tx*100}%, m ${m*100}%). A recessionary gap of ${gap} must be closed with extra spending. How much extra spending is needed (gap \u00f7 multiplier, 1 decimal)?`,type:'num',ans:gap*(1-sl),tol:0.1,hint:`${gap} \u00f7 ${f(1/(1-sl),2)}`,why:`${gap} \u00f7 ${f(1/(1-sl),2)} = ${f(gap*(1-sl),1)}.`};
}});

W({id:20,pack:'macro',emoji:'🎢',ch:'Macroeconomics Chapters 8, 9 and 12',lab:'phillips',
name:{e:'See-Saw Prices',a:'The Phillips Curve',s:'Expectations and Stagflation'},
tag:{e:'More jobs, faster-rising prices?',a:'The short-run trade-off between unemployment and inflation.',s:'Expectations, the natural rate, supply shocks and the long-run curve.'},
cards:{
e:[['The see-saw',`When almost everybody has a job, businesses must pay more to find workers and raise their prices. When lots of people can\u2019t find jobs, prices rise slowly. So <b>low unemployment</b> often comes with <b>faster-rising prices</b>. This see-saw is the <b>Phillips curve</b>.`,'🎢'],
['It does not last',`If prices keep rising fast, people start to <b>expect</b> it and ask for higher pay and prices. Then the see-saw shifts and you get faster price rises at the <b>same</b> unemployment.`,'🔁'],
['Bad surprise',`Sometimes a shock, like a big oil price rise, makes <b>both</b> unemployment and prices go up at the same time. That is called <b>stagflation</b>.`,'⛽']],
a:[['The trade-off',`In the short run, lower unemployment goes with higher inflation. A simple form is <b>\u03c0 = \u03c0\u1d49 \u2212 a(u \u2212 u\u2099)</b> where \u03c0\u1d49 is expected inflation, u\u2099 the natural rate and a the slope. With a = 0.8 an extra point of unemployment cuts inflation by 0.8 points.`,'📉'],
['Expectations',`If expected inflation rises, the whole Phillips curve <b>shifts up</b>: the same unemployment now comes with more inflation. This is why attempts to keep unemployment very low can lead to accelerating inflation.`,'⬆️'],
['Supply shocks',`A negative supply shock (higher oil prices) shifts the curve up, raising inflation <b>and</b> unemployment: <b>stagflation</b>. Keynes explained recessions by weak demand; the Phillips curve describes how policy trades unemployment against inflation.`,'⛽']],
s:[['Expectations-augmented curve',`\u03c0 = \u03c0\u1d49 \u2212 a(u \u2212 u\u2099) + \u03b5. At u = u\u2099 and no shock, actual inflation equals expected inflation. The unemployment cost of disinflating by x points is about x/a points of extra unemployment.`,'📐'],
['Long run',`In the long run expectations catch up with actual inflation, so the Phillips curve is <b>vertical at the natural rate</b> of unemployment: there is no permanent trade-off. The natural rate depends on frictional and structural unemployment, labor market institutions and demographics.`,'🔬'],
['Policy dilemmas',`With a supply shock, policymakers face a dilemma: fighting inflation raises unemployment; fighting unemployment raises inflation. Credibility of the central bank anchors expectations and reduces the cost of lowering inflation.`,'🎯']]},
qs:{
e:[mc(`The Phillips curve see-saw says low unemployment often goes with\u2026`,[`faster-rising prices`,`falling prices`,`no prices`,`no jobs`],0,`Tight labor markets raise costs.`),
mc(`If people expect high price rises, the see-saw\u2026`,[`shifts up`,`shifts down`,`disappears`,`stays the same`],0,`Expectations raise inflation at every unemployment rate.`),
mc(`Stagflation is when\u2026`,[`both unemployment and prices go up`,`both go down`,`prices fall`,`jobs rise`],0,`A bad supply shock does it.`),
mc(`A big oil price rise is an example of a\u2026`,[`supply shock`,`demand boom`,`tax cut`,`new job`],0,`It raises firms\u2019 costs.`)],
a:[mc(`In the short run lower unemployment tends to come with\u2026`,[`higher inflation`,`lower inflation`,`no change`,`no output`],0,`The short-run Phillips curve slopes down.`),
mc(`Higher expected inflation shifts the Phillips curve\u2026`,[`up`,`down`,`left only`,`nowhere`],0,`More inflation at each unemployment rate.`),
mc(`Stagflation is\u2026`,[`high inflation with high unemployment`,`low inflation with low unemployment`,`falling prices`,`falling taxes`],0,`A supply shock causes it.`),
mc(`At the natural rate of unemployment, inflation equals\u2026`,[`expected inflation (absent shocks)`,`zero`,`unemployment`,`100%`],0,`No surprise inflation.`)],
s:[mc(`The long-run Phillips curve is\u2026`,[`vertical at the natural rate`,`downward sloping`,`horizontal`,`upward sloping`],0,`No permanent trade-off.`),
mc(`With slope a = 0.8, cutting inflation by 2 points requires about\u2026`,[`2.5 points more unemployment`,`1.6 points`,`0.4 points`,`8 points`],0,`2 \u00f7 0.8.`),
mc(`A credible central bank makes disinflation\u2026`,[`less costly`,`more costly`,`impossible`,`irrelevant`],0,`Expectations adjust faster.`),
mc(`A negative supply shock creates a dilemma because\u2026`,[`fighting inflation raises unemployment`,`it lowers both`,`there is no trade-off`,`prices fall`],0,`Policy can only trade one problem against the other.`)]},
gen:function(lv){
  if(lv==='e'){const d=S.int(1,4);return {q:`On the see-saw, every extra <b>1</b> point of unemployment lowers inflation by <b>0.8</b> points. Unemployment rises by <b>${d}</b> ${d===1?'point':'points'}. By how many points does inflation fall?`,type:'num',ans:0.8*d,tol:0.02,hint:`0.8 \u00d7 ${d}`,why:`0.8 \u00d7 ${d} = ${f(0.8*d,1)}.`};}
  if(lv==='a'){const pe=S.int(1,5),u=S.pick([3,4,6,7,8]);const pi=pe-0.8*(u-5);return {q:`Phillips curve: \u03c0 = \u03c0\u1d49 \u2212 0.8(u \u2212 5). Expected inflation is ${pe}% and unemployment is ${u}%. What is inflation (%, 1 decimal)?`,type:'num',ans:pi,tol:0.05,hint:`${pe} \u2212 0.8 \u00d7 (${u} \u2212 5)`,why:`${pe} \u2212 0.8\u00d7${u-5} = ${f(pi,1)}.`};}
  const t=S.pick(['u','dis','shock']);
  if(t==='u'){const pe=S.int(3,6),pi=pe+S.pick([-3,-2,-1,1,2]);const un=5,u=un-(pi-pe)/0.8;return {q:`\u03c0 = \u03c0\u1d49 \u2212 0.8(u \u2212 5). Expected inflation is ${pe}%. What unemployment rate gives inflation of ${pi}%? (u = 5 \u2212 (\u03c0 \u2212 \u03c0\u1d49)/0.8, 2 decimals)`,type:'num',ans:u,tol:0.03,hint:`(${pi} \u2212 ${pe}) \u00f7 0.8`,why:`u = 5 \u2212 ${f(pi-pe,2)}/0.8 = ${f(u,2)}.`};}
  if(t==='dis'){const x=S.pick([1,2,3,4]);return {q:`With slope a = 0.8, how many extra points of unemployment are needed to cut inflation by ${x} points (x \u00f7 a, 2 decimals)?`,type:'num',ans:x/0.8,tol:0.02,hint:`${x} \u00f7 0.8`,why:`${x} \u00f7 0.8 = ${f(x/0.8,2)}.`};}
  const sh=S.pick([1,2,3]),pe=S.int(2,4);return {q:`\u03c0 = \u03c0\u1d49 \u2212 0.8(u \u2212 5) + shock. Expected inflation ${pe}%, unemployment at the natural rate 5%, and a supply shock that adds ${sh} ${sh===1?'point':'points'} to inflation. What is inflation (%)?`,type:'num',ans:pe+sh,tol:0.02,hint:`At u = 5 the gap term is 0.`,why:`${pe} + ${sh} = ${pe+sh}.`};
}});

W({id:21,pack:'macro',emoji:'🏦',ch:'Macroeconomics Chapters 14, 15 and Appendix C',lab:'cbank',
name:{e:'Bond Buyers',a:'Central Bank Tools',s:'Open Market Operations and Policy Rules'},
tag:{e:'How the central bank adds money to the system.',a:'Reserves, bank balance sheets and money creation.',s:'Open market operations, the reserves market and a Taylor-type rule.'},
cards:{
e:[['The bank of banks',`A country has a <b>central bank</b> that works with ordinary banks. When it wants to put more money in the economy, it <b>buys bonds</b> from banks and pays with fresh money.`,'🏛️'],
['More to lend',`Banks must keep some money safe (the <b>reserve</b>). Money above that can be <b>lent out</b>. When the central bank buys bonds, banks have more to lend, and borrowing gets cheaper.`,'💰'],
['Ripples again',`Each loan ends up in a bank account, which lets that bank lend again. So a bit of extra money from the central bank can grow into <b>much more</b> money in the economy.`,'🌊']],
a:[['Bank balance sheets',`A bank\u2019s <b>assets</b> are reserves, securities and loans; its <b>liabilities</b> are deposits. Required reserves = reserve ratio \u00d7 deposits. <b>Excess reserves</b> = reserves \u2212 required reserves, and these can be lent out.`,'🧾'],
['Open market operations',`When the central bank <b>buys bonds</b> from banks, bank reserves rise (securities fall). With reserve ratio r, the banking system can expand deposits by up to <b>\u0394Reserves \u00f7 r</b>. Selling bonds does the opposite. The <b>discount rate</b> and <b>reserve requirement</b> are other tools.`,'📊'],
['Policy effects',`Expansionary policy lowers interest rates, raising investment and consumption, shifting AD right. Contractionary policy does the reverse. Pitfalls include time lags, uncertain effects and the zero lower bound on interest rates.`,'🎯']],
s:[['Balance-sheet mechanics',`An open market purchase from a bank swaps securities for reserves: assets change composition, total assets unchanged. Excess reserves of \u0394B allow new lending \u0394B (single bank) and total deposit expansion \u0394B/r in a limited-reserves system as loans are redeposited.`,'📐'],
['Reserves market',`The interest rate on interbank loans is set where the demand for reserves (downward sloping) meets supply. An open market purchase shifts supply right and lowers the rate; a sale raises it. Interest rates affect AD through investment, durable consumption and exchange rates.`,'🔬'],
['Rules versus discretion',`A <b>Taylor-type rule</b> sets the policy rate in response to inflation and the output gap, for example i = \u03c0 + 2 + 0.5(\u03c0 \u2212 2) + 0.5\u00b7gap. Rules promote credibility and predictability but cannot capture every shock; central banks combine rules with judgement.`,'🧭']]},
qs:{
e:[mc(`When the central bank buys bonds from banks, banks end up with\u2026`,[`more money to lend`,`less money to lend`,`no money`,`more bonds`],0,`Reserves rise.`),
mc(`More lending usually makes borrowing\u2026`,[`cheaper`,`more expensive`,`impossible`,`unchanged`],0,`Interest rates fall.`),
mc(`A reserve is\u2026`,[`money a bank keeps safe`,`a type of bond`,`a loan`,`a tax`],0,`It is the part not lent out.`),
mc(`A small bit of new money can become more money because\u2026`,[`loans become new deposits that can be lent again`,`banks print it`,`people hide it`,`prices fall`],0,`The ripple.`)],
a:[mc(`Excess reserves are\u2026`,[`reserves above the required amount`,`deposits`,`loans`,`bonds`],0,`They can be lent.`),
mc(`With reserve ratio 10%, a $100 open market purchase can expand deposits by up to\u2026`,[`$1,000`,`$100`,`$10`,`$90`],0,`100 \u00f7 0.10.`),
mc(`An open market sale of bonds by the central bank\u2026`,[`reduces reserves and tightens policy`,`increases reserves`,`does nothing`,`lowers rates`],0,`It drains reserves.`),
mc(`Expansionary monetary policy shifts AD\u2026`,[`right`,`left`,`down`,`nowhere`],0,`Lower rates raise spending.`)],
s:[mc(`An open market purchase from a bank changes its balance sheet by\u2026`,[`swapping securities for reserves`,`increasing deposits only`,`cutting loans`,`raising liabilities`],0,`Total assets stay the same at first.`),
mc(`In the reserves market, an open market purchase shifts supply\u2026`,[`right, lowering the rate`,`left, raising the rate`,`right, raising the rate`,`not at all`],0,`More reserves, lower price.`),
mc(`A Taylor-type rule raises the rate when\u2026`,[`inflation or the output gap rises`,`both fall`,`unemployment rises`,`nothing`],0,`It leans against overheating.`),
mc(`The money multiplier in a limited-reserves system is\u2026`,[`1 \u00f7 reserve ratio`,`reserve ratio`,`1 + reserve ratio`,`1 \u2212 reserve ratio`],0,`Deposits expand to \u0394R/r.`)]},
gen:function(lv){
  if(lv==='e'){const B=S.pick([50,100,200]),r=S.pick([0.1,0.2,0.25]);return {q:`The central bank buys <b>$${B}</b> of bonds from banks. Banks must keep <b>${r*100}%</b> of deposits in reserve. At most, how much new money can end up in bank accounts? ($B \u00f7 ${r})`,type:'num',ans:B/r,tol:0.5,hint:`${B} \u00f7 ${r}`,why:`${B} \u00f7 ${r} = ${f(B/r,0)}.`};}
  if(lv==='a'){const t=S.pick(['req','ex','tot']);const D=S.pick([1000,2000,5000]),r=S.pick([0.05,0.1,0.2]);
    if(t==='req')return {q:`Deposits are $${D} and the reserve requirement is ${r*100}%. What are required reserves?`,type:'num',ans:D*r,tol:0.5,hint:`r \u00d7 deposits`,why:`${r} \u00d7 ${D} = ${D*r}.`};
    if(t==='ex'){const R=D*r+S.pick([20,50,100]);return {q:`Deposits $${D}, reserve requirement ${r*100}%, actual reserves $${R}. What are excess reserves?`,type:'num',ans:R-D*r,tol:0.5,hint:`actual \u2212 required`,why:`${R} \u2212 ${D*r} = ${R-D*r}.`};}
    const B=S.pick([50,100,200]);return {q:`Reserve requirement ${r*100}%. The central bank buys $${B} of bonds from banks. What is the maximum expansion of deposits (\u0394R \u00f7 r)?`,type:'num',ans:B/r,tol:0.5,hint:`${B} \u00f7 ${r}`,why:`${B} \u00f7 ${r} = ${f(B/r,0)}.`};}
  const t=S.pick(['taylor','bond','rate']);
  if(t==='taylor'){const pi=S.pick([1,2,3,4,5]),gp=S.pick([-3,-2,-1,0,1,2]);return {q:`Taylor-type rule: i = \u03c0 + 2 + 0.5(\u03c0 \u2212 2) + 0.5\u00b7gap. Inflation is ${pi}% and the output gap is ${gp}%. What policy rate does it suggest (%, 2 decimals)?`,type:'num',ans:pi+2+0.5*(pi-2)+0.5*gp,tol:0.02,hint:`${pi} + 2 + 0.5\u00d7${pi-2} + 0.5\u00d7${gp}`,why:`${pi} + 2 + ${0.5*(pi-2)} + ${0.5*gp} = ${f(pi+2+0.5*(pi-2)+0.5*gp,2)}.`};}
  if(t==='bond'){const F=1000,P=S.pick([950,960,970,980]);return {q:`A one-year bond with face value $${F} sells for $${P}. What is its interest rate (face \u00f7 price \u2212 1, in %, 2 decimals)?`,type:'num',ans:100*(F/P-1),tol:0.03,unit:'%',hint:`${F} \u00f7 ${P} \u2212 1`,why:`${F}/${P} \u2212 1 = ${f(F/P-1,4)} = ${f(100*(F/P-1),2)}%.`};}
  const R=S.pick([150,200,250,300]);return {q:`Demand for reserves: i = 8 \u2212 0.02R. The central bank supplies R = ${R}. What is the interest rate (%, 2 decimals)?`,type:'num',ans:8-0.02*R,tol:0.02,hint:`8 \u2212 0.02 \u00d7 ${R}`,why:`8 \u2212 ${0.02*R} = ${f(8-0.02*R,2)}.`};
}});
})();

W({id:22,pack:'macro',emoji:'💸',ch:'Macroeconomics Chapters 17 and 18',lab:'debt',
name:{e:'Borrowing Family',a:'Deficits and Debt',s:'Debt Dynamics'},
tag:{e:'What happens when you keep borrowing?',a:'Budget deficits, the national debt and the debt ratio.',s:'Interest rate versus growth, primary balance and stabilising debt.'},
cards:{
e:[['Deficit and debt',`If a government spends more than it collects in taxes in a year, that gap is the <b>deficit</b>. It has to borrow to cover it. All the borrowing added up over the years is the <b>debt</b>.`,'💸'],
['Compare with income',`A debt is easier to carry if the country\u2019s income is big. Economists compare the debt with the size of the economy: <b>debt as a percent of GDP</b>.`,'⚖️'],
['Interest',`Borrowed money has to be paid back with <b>interest</b>. If interest piles up faster than the economy grows, the debt can grow bigger compared with income.`,'📈']],
a:[['Deficits and debt',`<b>Budget deficit</b> = spending \u2212 tax revenue in a year. <b>National debt</b> = accumulated past deficits (net of surpluses). Debt next year = debt this year + deficit. <b>Debt-to-GDP</b> = debt \u00f7 GDP \u00d7 100.`,'🧮'],
['Fiscal policy',`Governments use spending and taxes to fight recession (expansionary: bigger deficit) or inflation (contractionary). <b>Automatic stabilizers</b> such as unemployment benefits and progressive taxes change the deficit with the cycle without new laws.`,'🎛️'],
['Borrowing and the economy',`Government borrowing competes with private borrowers for savings, raising interest rates and <b>crowding out</b> private investment. Borrowing from abroad adds to a trade deficit. Whether debt is a problem depends on its size relative to GDP and the interest rate.`,'🔁']],
s:[['The debt ratio equation',`With debt ratio d, interest rate r, growth g and primary deficit pd (spending excluding interest, as % of GDP): <b>d\u2032 = d(1 + r)/(1 + g) + pd</b>. If r > g, old debt grows relative to GDP even with a balanced primary budget.`,'📐'],
['Stabilising the ratio',`The primary balance that keeps d constant is <b>d(r \u2212 g)/(1 + g)</b> (a surplus if r > g). If g > r and the primary deficit is fixed at pd, the ratio converges to d* = pd(1 + g)/(g \u2212 r).`,'🎯'],
['Policy discussion',`Limits on debt depend on credibility, the currency in which debt is issued, and growth. Balanced-budget rules can worsen recessions; cyclical deficits are consistent with long-run sustainability if the structural position is sound.`,'🧭']]},
qs:{
e:[mc(`A deficit is when a government\u2026`,[`spends more than it collects in a year`,`collects more than it spends`,`has no money`,`has no people`],0,`The yearly gap.`),
mc(`The debt is\u2026`,[`all past borrowing added up`,`this year\u2019s gap only`,`the tax`,`the income`],0,`Accumulated borrowing.`),
mc(`Compared with income, a debt is easier to carry when\u2026`,[`the economy is big and growing`,`the economy is tiny`,`prices fall`,`nothing`],0,`The ratio is what matters.`),
mc(`Interest means\u2026`,[`extra you pay for borrowing`,`a prize`,`a tax`,`a loan`],0,`The price of borrowed money.`)],
a:[mc(`Debt next year equals\u2026`,[`debt this year + deficit`,`debt \u2212 deficit`,`deficit only`,`GDP`],0,`The deficit adds to debt.`),
mc(`Debt-to-GDP is\u2026`,[`debt \u00f7 GDP`,`GDP \u00f7 debt`,`deficit \u00f7 debt`,`debt \u00d7 GDP`],0,`Shows burden relative to the economy.`),
mc(`An automatic stabilizer is\u2026`,[`a rule that changes the deficit with the cycle`,`a new tax law`,`a loan`,`a bank`],0,`Unemployment benefits are an example.`),
mc(`Crowding out means government borrowing\u2026`,[`raises interest rates and reduces private investment`,`lowers rates`,`raises investment`,`does nothing`],0,`Competition for savings.`)],
s:[mc(`If r > g, debt-to-GDP grows even with a balanced primary budget because\u2026`,[`interest on old debt outpaces GDP growth`,`taxes fall`,`GDP shrinks`,`prices fall`],0,`The snowball effect.`),
mc(`The primary balance that stabilises debt is\u2026`,[`d(r \u2212 g)/(1 + g)`,`d \u00d7 r`,`g \u2212 r`,`d/(r \u2212 g)`],0,`A surplus when r > g.`),
mc(`If g > r, a country with a constant primary deficit\u2026`,[`converges to a finite debt ratio`,`has an exploding ratio`,`has zero debt`,`cannot borrow`],0,`d* = pd(1 + g)/(g \u2212 r).`),
mc(`A balanced-budget rule can make recessions\u2026`,[`worse`,`milder`,`shorter`,`irrelevant`],0,`It forces tax rises or cuts when revenues fall.`)]},
gen:function(lv){
  if(lv==='e'){if(Math.random()<0.5){const d=S.int(1,9)*100,df=S.int(1,5)*10;return {q:`A government owes <b>${d}</b>. This year it spends <b>${df}</b> more than it collects. How much does it owe at the end of the year?`,type:'num',ans:d+df,tol:0.5,hint:`debt + deficit`,why:`${d} + ${df} = ${d+df}.`};}
    const D=S.pick([50,100,150]),Y=S.pick([100,200,250]);return {q:`A country owes <b>${D}</b> and its yearly income is <b>${Y}</b>. What is the debt as a percent of income?`,type:'num',ans:100*D/Y,tol:0.2,unit:'%',hint:`debt \u00f7 income \u00d7 100`,why:`${D} \u00f7 ${Y} = ${f(100*D/Y,1)}%.`};}
  if(lv==='a'){const t=S.pick(['ratio','next','def']);
    if(t==='ratio'){const Dt=S.int(10,40)*1000,Y=S.int(15,30)*1000;return {q:`National debt is ${L(Dt)} and GDP is ${L(Y)}. Compute debt-to-GDP (%).`,type:'num',ans:100*Dt/Y,tol:0.2,unit:'%',hint:`debt \u00f7 GDP \u00d7 100`,why:`${Dt} \u00f7 ${Y} = ${f(100*Dt/Y,1)}%.`};}
    if(t==='next'){const Dt=S.int(10,40)*1000,df=S.int(2,8)*100;return {q:`The national debt is ${L(Dt)} and this year\u2019s deficit is ${L(df)}. What is the debt at the end of the year?`,type:'num',ans:Dt+df,tol:0.5,hint:`debt + deficit`,why:`${Dt} + ${df} = ${Dt+df}.`};}
    const sp=S.int(20,35)*100,tx=S.int(15,30)*100;return {q:`Government spending is ${L(sp)} and tax revenue is ${L(tx)}. Compute the budget deficit (negative for a surplus).`,type:'num',ans:sp-tx,tol:0.5,hint:`spending \u2212 revenue`,why:`${sp} \u2212 ${tx} = ${sp-tx}.`};}
  const t=S.pick(['next','stab','star']);const d=S.pick([60,80,100,120]),r=S.pick([3,4,5]),g=S.pick([1,2,3,6]);
  if(t==='next'){const pd=S.pick([-1,0,1,2]);const val=d*(1+r/100)/(1+g/100)+pd;return {q:`Debt-to-GDP is ${d}%, r = ${r}%, g = ${g}%, primary deficit ${pd}% of GDP. Compute next year\u2019s ratio d\u2032 = d(1 + r)/(1 + g) + pd (%, 1 decimal).`,type:'num',ans:val,tol:0.1,unit:'%',hint:`${d} \u00d7 ${f((1+r/100)/(1+g/100),4)} + ${pd}`,why:`${f(d*(1+r/100)/(1+g/100),2)} ${pd<0?'\u2212':'+'} ${Math.abs(pd)} = ${f(val,2)}.`};}
  if(t==='stab'){const val=d*(r-g)/100/(1+g/100);return {q:`Debt-to-GDP is ${d}%, r = ${r}%, g = ${g}%. What primary balance (% of GDP, positive = surplus) keeps the ratio constant? d(r \u2212 g)/(1 + g)`,type:'num',ans:val,tol:0.03,unit:'%',hint:`${d} \u00d7 ${(r-g)/100} \u00f7 ${1+g/100}`,why:`${d}\u00d7${(r-g)/100} \u00f7 ${1+g/100} = ${f(val,2)}.`};}
  const gg=S.pick([4,5,6]),rr=S.pick([2,3]),pd=S.pick([1,2,3]);const val=pd*(1+gg/100)/((gg-rr)/100);return {q:`Primary deficit ${pd}% of GDP each year, g = ${gg}%, r = ${rr}% (g > r). The debt ratio converges to d* = pd(1 + g)/(g \u2212 r). Compute d* (%, 1 decimal).`,type:'num',ans:val,tol:0.3,unit:'%',hint:`${pd} \u00d7 ${1+gg/100} \u00f7 ${(gg-rr)/100}`,why:`${f(pd*(1+gg/100),3)} \u00f7 ${(gg-rr)/100} = ${f(val,1)}.`};
}});

W({id:23,pack:'macro',emoji:'💱',ch:'Macroeconomics Chapter 16',lab:'fxppp',
name:{e:'Burger Prices',a:'Exchange Rates and PPP',s:'Real Exchange Rates'},
tag:{e:'Does the same burger cost the same everywhere?',a:'Purchasing power parity and what exchange rates do to trade.',s:'PPP, real exchange rates and competitiveness.'},
cards:{
e:[['One burger, two prices',`A burger costs <b>$5</b> in one country and, after changing money, <b>$4</b> in another. If everything cost the same everywhere, money would buy the same amount in every country. That idea is <b>purchasing power parity</b>.`,'🍔'],
['Strong and weak money',`When a country\u2019s money becomes <b>stronger</b>, its goods get <b>more expensive</b> for visitors, and foreign goods get cheaper for its people. When it gets <b>weaker</b>, its goods get cheaper for the world.`,'💪'],
['Why it matters',`Exchange rates change which things sell abroad and which things people buy from abroad.`,'🚢']],
a:[['Purchasing power parity',`<b>PPP</b>: the exchange rate that makes a basket cost the same in two countries is <b>e* = foreign price \u00f7 home price</b>. If the actual rate is far from e*, the currency looks <b>overvalued</b> or <b>undervalued</b>. PPP works better in the long run and for traded goods.`,'🍔'],
['Appreciation and depreciation',`An <b>appreciation</b> makes the home currency worth more foreign currency, so exports become more expensive abroad and imports cheaper. A <b>depreciation</b> does the opposite, tending to raise exports and lower imports.`,'↕️'],
['Exchange rate policies',`Floating rates are set by markets; fixed rates by the central bank (which must hold reserves); managed floats mix the two. A trade-off: stable exchange rates versus independent monetary policy.`,'🧭']],
s:[['Nominal and real exchange rates',`The <b>nominal rate</b> e is the price of one currency in another. The <b>real exchange rate</b> RER = e \u00d7 P\u2095 \u00f7 P\u1da0 corrects for price levels: it measures how many foreign baskets one home basket buys. A rising RER means home goods are becoming relatively expensive.`,'📐'],
['PPP and its limits',`Absolute PPP implies e = P\u1da0/P\u2095, so RER = 1. Deviations arise from non-traded goods, transport costs, trade barriers and productivity differences. Relative PPP says changes in e offset inflation differences.`,'🔬'],
['Macroeconomic effects',`A depreciation raises net exports (given the Marshall\u2013Lerner conditions), shifting AD right; it also raises the price of imports. An appreciation does the opposite and can reduce inflation but hurt exporters.`,'⚖️']]},
qs:{
e:[mc(`If a country\u2019s money gets stronger, its goods become\u2026`,[`more expensive for visitors`,`cheaper for visitors`,`free`,`unchanged`],0,`Foreigners need more of their own money.`),
mc(`Purchasing power parity says money should buy\u2026`,[`about the same amount everywhere`,`nothing`,`more in rich countries`,`more in small countries`],0,`Burgers should cost about the same.`),

}
function learn(wd,body,rec,id){
  const cards=wd.cards[state.lv];let i=0;const card=el('div',{class:'card'});body.append(card);
  function show(){card.innerHTML='';const c=cards[i];
    card.append(el('div',{class:'learn'},el('div',{class:'ic','aria-hidden':'true'},c[2]||wd.emoji),el('div',null,i===0?el('span',{class:'tag'},'From the book: '+wd.ch):null,el('h3',null,c[0]),el('p',{html:c[1]}))),
      el('div',{class:'dots'},cards.map((_,k)=>el('i',{class:k===i?'on':''}))),
      el('div',{class:'row',style:'justify-content:space-between'},el('button',{class:'btn alt sm',disabled:i===0,onclick:()=>{i--;show();}},'\u2190 Back'),
        el('button',{class:'btn'+(i===cards.length-1?' g2':''),onclick:()=>{if(i<cards.length-1){i++;show();}else{if(!rec.learned){rec.learned=true;addXP(10);}save();go('world',id,'play');}}},i===cards.length-1?'To the lab \u2192':'Next \u2192')));}
  show();
}
function play(wd,body,rec,id){
  const p=P();let touches=0;
  const api={touch:()=>{touches++;if(touches===4&&!(p.labs[id])){p.labs[id]=true;addXP(15);Q.toast('Lab bonus: +15 XP');if(Object.keys(p.labs).length>=3)award('lab');save();}}};
  const c=el('div',{class:'card'});body.append(c);
  try{Q.labs[wd.lab](c,state.lv,api);}catch(e){c.append(el('p',null,'Lab error: '+e.message));console.error(e);}
  body.append(el('div',{class:'row'},el('button',{class:'btn',onclick:()=>go('world',id,'quest')},'Start the quest \u2192')));

function build(wd,lv,n){
  const out=[];const stat=(wd.qs[lv]||[]).map(q=>({q:q.q,type:'mcq',o:q.o,a:q.a,why:q.why}));
  const pool=S.shuffle(stat);const useGen=wd.gen?Math.ceil(n/2):0;
  for(let i=0;i<useGen;i++){try{const g=wd.gen(lv);if(g)out.push(g);}catch(e){console.error(e);}}
  while(out.length<n&&pool.length)out.push(pool.pop());
  while(out.length<n&&wd.gen){try{out.push(wd.gen(lv));}catch(e){break;}}
  return S.shuffle(out).slice(0,n);
}
function runner(qs,opts,done){
  const L=lvl();let hearts=opts.hearts,idx=0,score=0,streak=0,bestStreak=0,lost=0,xp=0;
  const box=el('div',{class:'card'});
  function hud(){return el('div',{class:'hud'},el('span',{class:'chip'},'Question '+(idx+1)+' / '+qs.length),el('span',{class:'hearts','aria-label':hearts+' hearts'},'❤️'.repeat(hearts)+'🖤'.repeat(Math.max(0,opts.hearts-hearts))),streak>1?el('span',{class:'chip'},'🔥 '+streak+' in a row'):null,el('span',{class:'chip'},'+'+xp+' XP'));}
  function finish(win){const pct=Math.round(100*score/qs.length);done({score,pct,win,bestStreak,lost,xp,total:qs.length});}
  function ask(){
    if(idx>=qs.length||hearts<=0){finish(hearts>0);return;}
    const q=qs[idx];box.innerHTML='';box.append(hud(),el('div',{class:'qtext',html:q.q}));
    if(q.data)box.append(el('div',{class:'data'},q.data));
    const fb=el('div',{class:'fb',role:'status','aria-live':'polite'});let answered=false,hintUsed=false;
    const nextBtn=el('button',{class:'btn',style:'display:none',onclick:()=>{idx++;ask();}},idx===qs.length-1?'Finish \u2192':'Next \u2192');
    const why=el('div',{class:'why',style:'display:none'});
    function result(ok,detail){if(answered)return;answered=true;
      if(ok){score++;streak++;bestStreak=Math.max(bestStreak,streak);const g=10+Math.min(streak-1,5)*2-(hintUsed?2:0);xp+=g;fb.className='fb good';fb.textContent='Correct! +'+g+' XP';if(streak===6)award('fire');}
      else{streak=0;hearts--;lost++;fb.className='fb bad';fb.textContent='Not quite. You lost a heart.';box.classList.remove('shake');void box.offsetWidth;box.classList.add('shake');}
      why.style.display='';why.innerHTML=(detail||'')+(q.why?'<br>'+q.why:'');nextBtn.style.display='';nextBtn.focus();const h=box.querySelector('.hearts');if(h){h.textContent='❤️'.repeat(hearts)+'🖤'.repeat(Math.max(0,opts.hearts-hearts));}
      if(hearts<=0){nextBtn.textContent='See result \u2192';}}
    if(q.type==='mcq'){const order=S.shuffle(q.o.map((t,i)=>({t,i})));box.append(el('div',{class:'opts'},order.map(o=>el('button',{class:'opt',onclick:ev=>{if(answered)return;const ok=o.i===q.a;ev.currentTarget.classList.add(ok?'right':'wrong');if(!ok)box.querySelectorAll('.opt').forEach((b,k)=>{if(order[k].i===q.a)b.classList.add('right');});result(ok);}},o.t))));}
    else{const inp=el('input',{class:'ans',type:'number',step:'any',placeholder:q.unit?('answer in '+q.unit):'your answer','aria-label':'Your answer'});
      const go2=()=>{if(inp.value===''||answered)return;const v=+inp.value;const ok=Math.abs(v-q.ans)<=q.tol;result(ok,ok?'':'The answer was <b>'+S.f(q.ans,Math.abs(q.ans)<10?3:2)+(q.unit?' '+q.unit:'')+'</b>.');};
      inp.addEventListener('keydown',e=>{if(e.key==='Enter')go2();});
      const hb=q.hint?el('button',{class:'btn sm alt',onclick:()=>{if(hintUsed||answered)return;hintUsed=true;hintBox.style.display='';hintBox.textContent='Hint: '+q.hint;hb.disabled=true;}},'Hint (\u22122 XP)'):null;
      const hintBox=el('div',{class:'why',style:'display:none'});
      box.append(el('div',{class:'row'},inp,el('button',{class:'btn',onclick:go2},'Check'),hb),hintBox);}
    box.append(fb,why,nextBtn);
  }
  ask();return box;
}
function quest(wd,body,rec,id){
  const p=P(),L=lvl();
  const intro=el('div',{class:'card'},el('h3',null,'Quest: '+wd.name[state.lv]),el('p',null,'6 questions. You start with '+L.hearts+' hearts. Each correct answer earns XP and streaks earn a bonus. Score 70% or more to master this world.'),el('button',{class:'btn',onclick:start},'Begin quest'));
  body.append(intro);

    body.innerHTML='';const qs=build(wd,state.lv,6);
    body.append(runner(qs,{hearts:L.hearts},r=>{
      body.innerHTML='';
      if(!p.firstQuest){p.firstQuest=true;award('first');}
      const stars=r.pct>=90?3:r.pct>=70?2:r.pct>=50?1:0;
      addXP(r.xp+(r.pct>=70?30:0));
      const was=!!rec.done;
      if(r.pct>=70){rec.done=true;rec.stars=Math.max(rec.stars||0,stars);Q.confetti();}
      if(r.pct===100)award('perfect');if(r.lost===0&&r.pct===100)award('nohurt');
      if(mastered(p)>=Math.ceil(Q.worlds.length/2))award('half');['micro','macro'].forEach(k=>{const ws=Q.worlds.filter(x=>x.pack===k);if(ws.length&&ws.every(x=>p.w[x.id]&&p.w[x.id].done))award(k);});if(mastered(p)>=Q.worlds.length)award('all');
      save();
      const win=r.pct>=70;
      body.append(el('div',{class:'card win'},win?el('div',{class:'badge'},wd.emoji):el('div',{style:'font-size:3rem'},'💪'),el('h2',null,win?'World mastered!':'Good try. Let\u2019s go again.'),
        win?el('div',{class:'stars'},'⭐'.repeat(stars)+'☆'.repeat(3-stars)):null,
        el('p',null,r.score+' of '+r.total+' correct ('+r.pct+'%). You earned '+(r.xp+(win?30:0))+' XP'+(win?' (includes a 30 XP mastery bonus)':'')+'.'),
        el('div',{class:'row',style:'justify-content:center'},el('button',{class:'btn alt',onclick:()=>go('world',id,'learn')},'Review lessons'),el('button',{class:'btn g2',onclick:()=>go('world',id,'quest')},'Play again'),el('button',{class:'btn',onclick:()=>go('map')},'Back to map'))));
    }));
  }
}
function boss(){

  const ids=Q.worlds.filter(x=>p.w[x.id]&&p.w[x.id].done);
