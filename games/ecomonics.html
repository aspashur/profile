W({id:9,emoji:'🍕',ch:'Book chapters 14\u201315',lab:'inequality',
name:{e:'Fair Slices',a:'Poverty and Inequality',s:'Labor Market Power and Distribution'},
tag:{e:'How is the pizza shared?',a:'The poverty line, Lorenz curve and Gini coefficient.',s:'Monopsony, unions, discrimination, safety nets and measuring inequality.'},
cards:{
e:[['A pizza for five',`Imagine all the money in a country is one pizza shared by five groups of people from poorest to richest. If every group gets the same slice, the sharing is <b>equal</b>. If the richest group gets most of it, the sharing is <b>unequal</b>.`,'🍕'],
['Poverty',`Some people don\u2019t have enough money for basic needs like food and a home. A country draws a <b>poverty line</b>: people below it count as poor. Governments can help with a <b>safety net</b> like food support.`,'🏠'],
['Why gaps appear',`People earn different amounts because of <b>skills, education, jobs and luck</b>. Unfair treatment (discrimination) can also make gaps bigger. Rules and taxes can make the gaps smaller.`,'⚖️']],
a:[['Poverty and the safety net',`A <b>poverty line</b> is an income level for basic needs, or a share of median income. The <b>poverty rate</b> is the share of people below it. The <b>poverty trap</b> arises when losing benefits as income rises discourages work. A <b>safety net</b> includes cash and in-kind help.`,'🏘️'],
['Measuring inequality',`Rank households and split them into <b>quintiles</b> (fifths). The <b>Lorenz curve</b> plots the cumulative share of income against the cumulative share of households. The further it bows below the 45\u00b0 line, the more unequal. The <b>Gini coefficient</b> runs from 0 (equality) to 1.`,'📈'],
['Causes and policy',`Differences in education, experience, <b>market power</b> (unions, firms) and discrimination affect earnings. Policies: progressive taxes, transfers, education and the earned income credit. Each involves trade-offs with incentives.`,'🛠️']],
s:[['Labor market power',`A <b>monopsony</b> (single buyer of labor) pays below the competitive wage and hires fewer workers; <b>unions</b> create market power on the supply side; <b>bilateral monopoly</b> has both. Discrimination can be taste-based or statistical. <b>Immigration</b> shifts labor supply and has differing effects across groups.`,'⚙️'],
['The Gini coefficient',`Gini = 1 \u2212 2 \u00d7 (area under the Lorenz curve). With quintile shares s\u1d62 and cumulative shares C\u1d62, area \u2248 \u03a3 0.2(C\u1d62\u208b\u2081 + C\u1d62)/2. Inequality in market income differs from after-tax income. A Gini of 0.4 is moderate; above 0.5 high.`,'🔬'],
['Redistribution trade-offs',`Progressive taxes and transfers reduce measured inequality but can lower incentives to work and save (the equity\u2013efficiency trade-off). Poverty traps arise from high effective marginal tax rates on low incomes. Evaluate policies by who gains, who pays and behavioural responses.`,'🧭']]},
qs:{
e:[mc(`If every group gets the same slice of the pizza, the sharing is\u2026`,[`equal`,`unequal`,`unfair`,`impossible`],0,`All shares are the same.`),
mc(`The poverty line is\u2026`,[`an income level below which people count as poor`,`a line on a map`,`a type of tax`,`a bank`],0,`It is how we count people who can\u2019t meet basic needs.`),
mc(`A safety net is\u2026`,[`help from the government for people in need`,`a net for fish`,`a tax`,`a toy`],0,`It supports people who fall on hard times.`),
mc(`Which can make income gaps bigger?`,[`Discrimination`,`Fair treatment`,`Equal education`,`Sharing`],0,`Unequal treatment affects earnings.`)],
a:[mc(`The Lorenz curve of perfectly equal income is\u2026`,[`the 45\u00b0 straight line`,`a very bowed curve`,`a horizontal line`,`a point`],0,`Cumulative income share equals cumulative household share.`),
mc(`A Gini coefficient of 0 means\u2026`,[`perfect equality`,`one person has everything`,`no income`,`high poverty`],0,`1 would be perfect inequality.`),
mc(`The poverty rate is\u2026`,[`the share of people below the poverty line`,`the average income`,`the Gini`,`the wage`],0,`Count of poor divided by the population.`),
mc(`A poverty trap occurs when\u2026`,[`rising income causes benefits to be lost`,`prices fall`,`taxes vanish`,`people stop eating`],0,`Working more may leave you no better off.`)],
s:[mc(`A monopsony in labor markets tends to\u2026`,[`pay lower wages and hire fewer workers`,`pay higher wages`,`hire more workers`,`not affect wages`],0,`The single buyer restricts hiring to lower the wage.`),
mc(`Gini = 1 \u2212 2 \u00d7 (area under the Lorenz curve). A larger area under the curve means\u2026`,[`lower inequality`,`higher inequality`,`no inequality data`,`a higher poverty line`],0,`The curve is closer to the equality line.`),
mc(`The equity\u2013efficiency trade-off says\u2026`,[`redistribution may reduce incentives to work and save`,`equity always raises efficiency`,`efficiency has no cost`,`taxes are free`],0,`Policies must weigh both.`),
mc(`Statistical discrimination occurs when employers\u2026`,[`use group averages to judge individuals`,`dislike a group`,`pay everyone equally`,`hire randomly`],0,`It is based on beliefs about groups.`)]},
gen:function(lv){
  if(lv==='e'){const top=S.int(40,60),bot=S.pick([5,10,4,8]);if(Math.random()<0.5)return {q:`The richest group gets <b>${top}</b> slices out of 100 and the poorest group gets <b>${bot}</b>. How many times bigger is the richest group\u2019s share?`,type:'num',ans:top/bot,tol:0.1,hint:`${top} \u00f7 ${bot}`,why:`${top} \u00f7 ${bot} = ${f(top/bot,1)}.`};
    const N=S.pick([100,200,500,1000]),p=Math.round(N*S.pick([.05,.1,.2,.25]));return {q:`A town has <b>${N}</b> people and <b>${p}</b> of them are below the poverty line. What percent are poor?`,type:'num',ans:100*p/N,tol:0.05,unit:'%',hint:`${p} \u00f7 ${N} \u00d7 100`,why:`${p} \u00f7 ${N} \u00d7 100 = ${f(100*p/N,1)}%.`};}
  if(lv==='a'){const t=S.pick(['rate','ratio','gap']);
    if(t==='rate'){const N=S.pick([200,400,500,1000]),p=Math.round(N*S.pick([.08,.12,.15,.2]));return {q:`${N} households; ${p} are below the poverty line. Compute the poverty rate (%).`,type:'num',ans:100*p/N,tol:0.05,unit:'%',hint:`poor \u00f7 total \u00d7 100`,why:`${p} \u00f7 ${N} \u00d7 100 = ${f(100*p/N,1)}%.`};}
    if(t==='ratio'){const top=S.pick([45,50,55,60]),bot=S.pick([3,4,5,6]);return {q:`The top fifth gets ${top}% of income and the bottom fifth gets ${bot}%. What is the ratio top \u00f7 bottom?`,type:'num',ans:top/bot,tol:0.05,hint:`${top} \u00f7 ${bot}`,why:`${top} \u00f7 ${bot} = ${f(top/bot,2)}.`};}
    const L0=S.pick([15,20,25]),inc=[8,12,15,18,22];const poor=inc.filter(x=>x<L0);return {q:`Five households earn (in thousands) 8, 12, 15, 18 and 22. The poverty line is ${L0}. What is the average shortfall below the line among the poor households (in thousands, 1 decimal)?`,type:'num',ans:S.sum(poor.map(x=>L0-x))/poor.length,tol:0.05,hint:`Average of (line \u2212 income) over the poor households.`,why:`Poor: ${poor.join(', ')}; shortfalls ${poor.map(x=>L0-x).join(', ')}; average ${f(S.sum(poor.map(x=>L0-x))/poor.length,2)}.`};}
  const sets=[[5,10,15,22,48],[4,9,14,23,50],[6,12,17,24,41],[8,13,18,24,37],[3,7,12,20,58]];const s=S.pick(sets);let c=0,area=0,prev=0;s.forEach(v=>{c+=v/100;area+=0.2*(prev+c)/2;prev=c;});const g=1-2*area;
  return {q:`Income shares of the five quintiles (poorest to richest) are ${s.join('%, ')}%. Compute the Gini coefficient = 1 \u2212 2 \u00d7 area under the Lorenz curve (use trapezoids of width 0.2; 3 decimals).`,type:'num',ans:g,tol:0.004,hint:`Cumulative shares: ${(()=>{let q=0;return s.map(v=>{q+=v;return q;}).join(', ');})()}%. Area = \u03a3 0.2 (C\u1d62\u208b\u2081 + C\u1d62)/2.`,why:`Area = ${f(area,4)}; Gini = 1 \u2212 2\u00d7${f(area,4)} = ${f(g,3)}.`};
}});
})();

W({id:10,emoji:'📊',ch:'Book chapters 19\u201322',lab:'macro',
name:{e:'Counting the Country',a:'Measuring the Macroeconomy',s:'GDP, Growth, Unemployment and Inflation'},
tag:{e:'How big is a country\u2019s economy? Are prices rising?',a:'GDP, real versus nominal, unemployment and the CPI.',s:'Expenditure approach, growth and convergence, labor force measures, price indices.'},
cards:{
e:[['The size of a country',`<b>GDP</b> (gross domestic product) is the total value of all the new things a country makes and the services it provides in a year, like toys, haircuts and houses. It tells us how big the economy is.`,'🏙️'],
['Prices up',`<b>Inflation</b> means prices go up on average, so the same money buys less. Economists track a typical <b>basket</b> of things people buy to see how much its price changed.`,'🛒'],
['Jobs',`People who want a job and are looking for one but can\u2019t find it are <b>unemployed</b>. The <b>unemployment rate</b> is the share of people who want to work (those with jobs plus those looking) who don\u2019t have a job.`,'👷']],
a:[['GDP',`<b>GDP = C + I + G + X \u2212 M</b>: consumption, investment, government purchases, exports minus imports. It counts final goods and services produced within a country in a year. <b>Real GDP</b> = nominal GDP \u00f7 (price index \u00f7 100) removes price changes.`,'📐'],
['Unemployment',`The <b>labor force</b> = employed + unemployed. <b>Unemployment rate</b> = unemployed \u00f7 labor force. People not looking (students, retirees) are outside it. Types: frictional, structural and cyclical.`,'👷'],
['Inflation',`<b>Inflation rate</b> = (CPI\u2082 \u2212 CPI\u2081) \u00f7 CPI\u2081 \u00d7 100, where the <b>CPI</b> prices a fixed basket of goods. Nominal values include inflation; real values remove it. GDP doesn\u2019t measure everything: unpaid work, leisure and the environment are missing.`,'🛒']],
s:[['Measuring output',`GDP by the expenditure approach: Y = C + I + G + X \u2212 M (equals national income by the income approach). Real GDP growth = nominal growth \u2212 inflation (approximately). GDP per capita adjusts for population. GDP omits non-market activity and says nothing about distribution.`,'🧮'],
['Growth and convergence',`Growth in real GDP per capita compounds; the rule of 72 gives doubling time \u2248 72/g. Sources: labor productivity, capital deepening, technology and human capital. <b>Convergence</b>: poorer countries can grow faster by adopting existing technology, but only with good institutions and investment.`,'📈'],
['Labor force and prices',`Unemployment rate = U/(E + U); participation = (E + U)/adult population. Discouraged workers are not counted as unemployed. The CPI has known biases (substitution, new products, quality change); the GDP deflator covers all domestic output and is not a fixed basket.`,'🔬']]},
qs:{
e:[mc(`GDP measures\u2026`,[`the total value of what a country makes in a year`,`how many people live there`,`how tall the buildings are`,`the weather`],0,`It is the size of the economy.`),
mc(`Inflation means\u2026`,[`prices go up on average`,`prices go down`,`wages vanish`,`people move`],0,`Your money buys less.`),
mc(`An unemployed person is someone who\u2026`,[`wants a job and is looking but has none`,`is on holiday`,`is retired`,`is a student`],0,`They are in the labor force without work.`),
mc(`A \u201cbasket\u201d is used to\u2026`,[`track price changes of typical purchases`,`carry apples`,`count people`,`measure height`],0,`It is the idea behind the CPI.`)],
a:[mc(`GDP =\u2026`,[`C + I + G + X \u2212 M`,`C + I + G + X + M`,`C \u2212 I`,`X \u2212 M only`],0,`Imports are subtracted.`),
mc(`The unemployment rate is\u2026`,[`unemployed \u00f7 labor force`,`unemployed \u00f7 population`,`employed \u00f7 labor force`,`jobs \u00f7 people`],0,`The denominator is the labor force.`),
mc(`If nominal GDP rises 5% and prices rise 5%, real GDP\u2026`,[`stays about the same`,`rises 10%`,`falls 5%`,`rises 5%`],0,`Real growth \u2248 nominal growth \u2212 inflation.`),
mc(`A student who is not looking for a job is\u2026`,[`outside the labor force`,`unemployed`,`employed`,`counted in GDP`],0,`Not working and not searching.`)],
s:[mc(`A person who stops searching for work because they are discouraged is\u2026`,[`not counted as unemployed`,`counted as unemployed`,`employed`,`in GDP`],0,`They leave the labor force.`),
mc(`Compared with the CPI, the GDP deflator\u2026`,[`covers all domestically produced goods and services`,`uses a fixed basket`,`measures wages`,`is the same`],0,`It is a broader price index.`),
mc(`Real GDP growth is approximately\u2026`,[`nominal GDP growth minus inflation`,`nominal growth plus inflation`,`inflation minus nominal growth`,`population growth`],0,`Remove price effects.`),
mc(`Convergence means poorer countries\u2026`,[`can grow faster and catch up`,`always fall behind`,`stop growing`,`must be smaller`],0,`They can adopt known technology.`)]},
gen:function(lv){
  if(lv==='e'){if(Math.random()<0.5){const b1=S.pick([50,100,200]),g=S.pick([5,10,20]);return {q:`A basket of groceries cost <b>${$(b1)}</b> last year and <b>${$(b1*(1+g/100))}</b> this year. By what percent did prices rise?`,type:'num',ans:g,tol:0.1,unit:'%',hint:`change \u00f7 old \u00d7 100`,why:`${b1*g/100} \u00f7 ${b1} \u00d7 100 = ${g}%.`};}
    const e=S.int(40,90),u=S.int(5,15);return {q:`In a town <b>${e}</b> grown-ups have jobs and <b>${u}</b> are looking but have none. What percent of those who want to work are unemployed? (1 decimal)`,type:'num',ans:100*u/(e+u),tol:0.1,unit:'%',hint:`unemployed \u00f7 (jobs + unemployed)`,why:`${u} \u00f7 ${e+u} \u00d7 100 = ${f(100*u/(e+u),1)}%.`};}
  if(lv==='a'){const t=S.pick(['gdp','real','un','cpi']);
    if(t==='gdp'){const C=S.int(500,800),I=S.int(100,250),G=S.int(150,250),X=S.int(80,200),M=S.int(80,200);return {q:`C = ${C}, I = ${I}, G = ${G}, X = ${X}, M = ${M}. Compute GDP.`,type:'num',ans:C+I+G+X-M,tol:0.01,hint:`C + I + G + X \u2212 M`,why:`${C} + ${I} + ${G} + ${X} \u2212 ${M} = ${C+I+G+X-M}.`};}
    if(t==='real'){const N=S.int(10,30)*100,d=S.pick([105,110,120,125,150]);return {q:`Nominal GDP is ${L(N)} and the price index is ${d} (base year = 100). Compute real GDP.`,type:'num',ans:N/(d/100),tol:0.5,hint:`nominal \u00f7 (index \u00f7 100)`,why:`${N} \u00f7 ${d/100} = ${f(N/(d/100),1)}.`};}
    if(t==='un'){const e=S.int(500,800),u=S.int(30,100);return {q:`Employed ${e} thousand, unemployed ${u} thousand. Compute the unemployment rate (%, 1 decimal).`,type:'num',ans:100*u/(e+u),tol:0.1,unit:'%',hint:`unemployed \u00f7 (employed + unemployed)`,why:`${u} \u00f7 ${e+u} = ${f(100*u/(e+u),1)}%.`};}
    const c1=S.pick([200,220,240]),c2=c1+S.pick([6,10,14]);return {q:`The CPI was ${c1} last year and ${c2} this year. Compute the inflation rate (%, 1 decimal).`,type:'num',ans:100*(c2-c1)/c1,tol:0.1,unit:'%',hint:`(CPI\u2082 \u2212 CPI\u2081) \u00f7 CPI\u2081`,why:`(${c2} \u2212 ${c1}) \u00f7 ${c1} = ${f(100*(c2-c1)/c1,2)}%.`};}
  const t=S.pick(['r72','real','lfp','pc']);
  if(t==='r72'){const g=S.pick([2,3,4,6,8]);return {q:`Real GDP per person grows ${g}% a year. Use the rule of 72: about how many years until it doubles?`,type:'num',ans:72/g,tol:0.01,hint:`72 \u00f7 ${g}`,why:`72 \u00f7 ${g} = ${f(72/g,1)}.`};}
  if(t==='real'){const n=S.int(5,9),inf=S.int(1,4);return {q:`Nominal GDP grows ${n}% and the price level rises ${inf}%. Approximately how fast does real GDP grow (%)?`,type:'num',ans:n-inf,tol:0.01,hint:`nominal growth \u2212 inflation`,why:`${n} \u2212 ${inf} = ${n-inf}%.`};}
  if(t==='lfp'){const e=S.int(500,700),u=S.int(30,80),o=S.int(250,400);return {q:`Employed ${e}, unemployed ${u}, not in the labor force ${o} (thousands, adults). Compute the labor force participation rate (%, 1 decimal).`,type:'num',ans:100*(e+u)/(e+u+o),tol:0.1,unit:'%',hint:`(E + U) \u00f7 (E + U + not in LF)`,why:`${e+u} \u00f7 ${e+u+o} = ${f(100*(e+u)/(e+u+o),1)}%.`};}
  const g=S.pick([3,4,5,6]),p=S.pick([1,2]);return {q:`Real GDP grows ${g}% a year and population grows ${p}% a year. Approximately how fast does real GDP <b>per person</b> grow (%)?`,type:'num',ans:g-p,tol:0.01,hint:`GDP growth \u2212 population growth`,why:`${g} \u2212 ${p} = ${g-p}%.`};
}});

W({id:11,emoji:'🏦',ch:'Book chapters 24\u201328 and 30\u201331',lab:'adas',
name:{e:'Money Ripples',a:'Macro Models and Policy',s:'AD/AS, Multipliers, Money and Policy'},
tag:{e:'When money is spent, it keeps travelling.',a:'AD/AS, the multiplier, banks and money creation.',s:'Gaps, fiscal and monetary policy, money multiplier, deficits and crowding out.'},
cards:{
e:[['Spending ripples',`When the government spends $100 on a road, the workers who earn that money spend part of it in shops, and the shop owners spend part of that\u2026 The ripple means the total effect is <b>more than $100</b>. This is the <b>multiplier</b>.`,'🌊'],
['Banks make money grow',`Banks keep a little of your savings and <b>lend out the rest</b>. The loans get deposited in other banks that lend again. So banks help <b>create money</b>.`,'🏦'],
['Big economy ups and downs',`Sometimes the economy slows (a <b>recession</b>) and sometimes it heats up too much and prices rise. Governments and central banks use <b>spending, taxes and interest rates</b> to calm things down.`,'🎢']],
a:[['AD and AS',`<b>Aggregate demand (AD)</b> is total spending: C + I + G + X \u2212 M. <b>Aggregate supply (AS)</b> is total output firms offer. Where they meet gives real GDP and the price level. Below potential GDP: a <b>recessionary gap</b>. Above: an <b>inflationary gap</b>.`,'📈'],
['The multiplier',`<b>Spending multiplier = 1 \u00f7 (1 \u2212 MPC)</b> = 1 \u00f7 MPS. With MPC = 0.8 the multiplier is 5, so $10 of new spending raises GDP by $50. Fiscal policy uses government spending and taxes to shift AD.`,'🔁'],
['Money and banks',`Money is a medium of exchange, store of value and unit of account. With a <b>reserve ratio</b> rr, the <b>money multiplier = 1 \u00f7 rr</b>: $1,000 of new deposits can support up to $1,000/rr of total deposits. A <b>central bank</b> can change interest rates, reserve requirements and buy or sell bonds.`,'🏛️']],
s:[['AD/AS and policy',`AD slopes down (wealth, interest-rate and exchange-rate effects); SRAS slopes up; long-run AS is vertical at potential GDP. A recessionary gap can be closed by expansionary policy or self-corrects by falling wages. Keynesian economics stresses sticky prices and demand; neoclassical economics stresses supply and the long run.`,'🧭'],
['Multipliers',`With MPC = c: spending multiplier 1/(1 \u2212 c); tax multiplier \u2212c/(1 \u2212 c) (smaller in size because part of a tax change is absorbed in saving); balanced-budget multiplier = 1. Equilibrium: Y = (C\u2080 + I + G \u2212 cT)/(1 \u2212 c). Automatic stabilisers dampen cycles; discretionary policy faces time lags.`,'🧮'],
['Money, banks and the central bank',`Banks create money by lending: maximum deposits = initial deposit \u00f7 rr, so new money = D(1/rr \u2212 1). Monetary policy tools: open market operations, discount rate, reserve requirements. Expansionary monetary policy lowers interest rates and raises AD. Deficits financed by borrowing can crowd out private investment.`,'🏛️']]},

    if(t==='dy'){const g=S.pick([10,20,50]);return {q:`MPC = ${mp}. Government spending rises by ${g}. By how much does GDP rise in total (spending multiplier)?`,type:'num',ans:g/(1-mp),tol:0.05,hint:`\u0394G \u00d7 1/(1 \u2212 MPC)`,why:`${g} \u00f7 ${f(1-mp,2)} = ${f(g/(1-mp),1)}.`};}

W({id:12,emoji:'🌐',ch:'Book chapters 23, 29 and 32\u201334',lab:'trade',
name:{e:'Trading Planet',a:'Trade and Exchange Rates',s:'Comparative Advantage and Exchange Rates'},
tag:{e:'Why do countries swap things?',a:'Comparative advantage, exchange rates and tariffs.',s:'Gains from trade, exchange-rate determination, trade balances and policy.'},
cards:{
e:[['Swapping is smart',`Even if one country is better at making <b>everything</b>, both countries are better off if each makes what it gives up <b>least</b> to make and then they trade. This idea is called <b>comparative advantage</b>.`,'🌍'],
['Money across borders',`Different countries use different money. The <b>exchange rate</b> says how much of one money buys one unit of another, like how many euros one dollar buys.`,'💱'],
['Trade rules',`A <b>tariff</b> is a tax on things brought in from other countries. It protects some local businesses but makes things cost more for shoppers.`,'🚧']],
a:[['Comparative advantage',`<b>Opportunity cost</b> of a good is what you give up to make it. A country has a <b>comparative advantage</b> in the good with the <b>lower opportunity cost</b>, even if it has an absolute advantage in both. Trading at a price between the two opportunity costs benefits both.`,'⚖️'],
['Exchange rates',`The exchange rate is set in the foreign exchange market by demand and supply of currencies. If demand for dollars rises, the dollar <b>appreciates</b>: our exports get pricier abroad, imports cheaper at home. A fall is <b>depreciation</b>.`,'💱'],
['Trade balance and policy',`<b>Trade balance</b> = exports \u2212 imports. A deficit means importing more than exporting. <b>Tariffs</b> and <b>quotas</b> restrict imports; they help protected industries but raise prices for consumers and can cost jobs elsewhere.`,'🧾']],
s:[['Gains from trade',`The terms of trade lie between the two countries\u2019 opportunity costs; specialisation according to comparative advantage raises total output and allows consumption beyond each country\u2019s own PPF. Intra-industry trade among similar economies reflects variety and economies of scale.`,'🔬'],
['Exchange-rate determination',`Demand and supply of a currency come from trade in goods, investment and speculation. Shifts in foreign demand for exports or assets, interest-rate differences and inflation differences move the rate. Policy regimes: floating, fixed and managed exchange rates.`,'📐'],
['Balance and policy',`Identity: net exports X \u2212 M = national saving \u2212 domestic investment. A trade deficit is financed by capital inflows. Protectionism acts as an indirect subsidy from consumers to producers; trade policy involves global (WTO), regional and national levels and distributional trade-offs.`,'🧭']]},
qs:{
e:[mc(`Comparative advantage means making the thing you\u2026`,[`give up the least to make`,`like the most`,`can make fastest in the world`,`sell for the highest price`],0,`It is about opportunity cost.`),
mc(`An exchange rate tells you\u2026`,[`how much of one money buys one unit of another`,`the price of bread`,`a country\u2019s size`,`a tax`],0,`It links money across countries.`),
mc(`A tariff is\u2026`,[`a tax on goods brought in from abroad`,`a kind of ship`,`a type of cloth`,`a prize`],0,`It makes imports cost more.`),
mc(`Trade can help both countries because\u2026`,[`each can focus on what it does best`,`one always wins`,`there are no costs`,`nobody pays`],0,`Specialisation raises total output.`)],
a:[mc(`The country with the lower opportunity cost of a good has\u2026`,[`comparative advantage`,`absolute advantage only`,`a tariff`,`a trade deficit`],0,`That defines comparative advantage.`),
mc(`If the dollar appreciates, imports become\u2026`,[`cheaper for Americans`,`more expensive`,`unchanged`,`illegal`],0,`A stronger dollar buys more foreign goods.`),
mc(`Net exports are\u2026`,[`exports minus imports`,`exports plus imports`,`imports minus exports`,`GDP`],0,`X \u2212 M.`),
mc(`A tariff usually\u2026`,[`raises prices for consumers`,`lowers prices`,`ends trade`,`raises exports`],0,`Imported goods cost more.`)],
s:[mc(`If a country invests more than it saves, it runs a\u2026`,[`trade deficit`,`trade surplus`,`balanced budget`,`tariff`],0,`X \u2212 M = S \u2212 I < 0.`),
mc(`The terms of trade lie\u2026`,[`between the two countries\u2019 opportunity costs`,`below both`,`above both`,`at zero`],0,`Both gain at a price in between.`),
mc(`An increase in foreign demand for a country\u2019s currency causes\u2026`,[`appreciation`,`depreciation`,`no change`,`a tariff`],0,`Demand shifts right, raising its price.`),
mc(`Protectionism acts as an indirect subsidy from\u2026`,[`consumers to producers`,`producers to consumers`,`government to consumers`,`foreigners to workers`],0,`Higher prices pay protected firms.`)]},
gen:function(lv){

    const p=S.pick([10,20,50,100]),r=S.pick([2,3]);return {q:`One dollar buys <b>${r}</b> toy coins of another country. A toy costs <b>${p}</b> coins. How many dollars is that?`,type:'num',ans:p/r,tol:0.05,hint:`coins \u00f7 coins per dollar`,why:`${p} \u00f7 ${r} = ${f(p/r,2)}.`};}
  if(lv==='a'){const t=S.pick(['oc','fx','tb']);
    if(t==='oc'){const w=S.int(2,8),c=S.int(2,10);return {q:`In an hour a worker can make ${w} bushels of wheat or ${c} yards of cloth. What is the opportunity cost of 1 bushel of wheat in yards of cloth?`,type:'num',ans:c/w,tol:0.01,hint:`cloth \u00f7 wheat`,why:`${c} \u00f7 ${w} = ${f(c/w,2)}.`};}
    if(t==='fx'){const e=S.pick([0.8,0.9,1.1,1.25,1.5]),p=S.pick([50,100,200]);return {q:`One dollar buys ${e} euros. A US good costs $${p}. What does it cost a European buyer, in euros?`,type:'num',ans:p*e,tol:0.05,hint:`dollar price \u00d7 euros per dollar`,why:`${p} \u00d7 ${e} = ${f(p*e,2)}.`};}
    const X=S.int(200,500),M=S.int(200,500);return {q:`A country exports ${X} and imports ${M}. What is its trade balance (negative for a deficit)?`,type:'num',ans:X-M,tol:0.01,hint:`X \u2212 M`,why:`${X} \u2212 ${M} = ${X-M}.`};}
  const t=S.pick(['nx','ap','gain']);

  if(t==='ap'){const e0=S.pick([1.0,1.2,1.25]),pc=S.pick([4,6,8,10]),e1=e0*(1+pc/100);return {q:`The price of a dollar rises from ${e0} to ${f(e1,3)} euros. By what percent has the dollar appreciated? (1 decimal)`,type:'num',ans:100*(e1/e0-1),tol:0.1,unit:'%',hint:`(new \u2212 old) \u00f7 old`,why:`(${f(e1,3)} \u2212 ${e0}) \u00f7 ${e0} = ${f(100*(e1/e0-1),1)}%.`};}
  let a1,c1,w2,c2,ocA,ocB,g=0;do{a1=S.int(4,8);c1=S.int(2,4);w2=S.int(1,3);c2=S.int(1,3);ocA=c1/a1;ocB=c2/w2;g++;}while(Math.abs(ocA-ocB)<1e-9&&g<50);
  const aWheat=ocA<ocB;const cloth=aWheat?c2:c1;return {q:`Country A makes ${a1} wheat or ${c1} cloth per hour; Country B makes ${w2} wheat or ${c2} cloth per hour. Each country works 10 hours. The country with the comparative advantage in wheat makes only wheat, and the other makes only cloth. How much cloth is made in the world in total?`,type:'num',ans:10*cloth,tol:0.01,hint:`Opportunity cost of 1 wheat: A = ${f(ocA,2)} cloth, B = ${f(ocB,2)} cloth. The lower one makes wheat.`,why:`${aWheat?'A':'B'} has the lower opportunity cost of wheat, so ${aWheat?'B':'A'} makes cloth: 10 \u00d7 ${cloth} = ${10*cloth}.`};
}});

W({id:13,pack:'micro',emoji:'📐',ch:'Microeconomics Appendix A: The Use of Mathematics',lab:'math',
name:{e:'Graph Explorers',a:'The Math Toolkit',s:'Slopes, Lines and Solving'},
tag:{e:'Read graphs like a map: how steep is the line?',a:'Slope, straight-line equations, percent change and growth.',s:'Solving for equilibrium, areas for surplus, and point elasticity.'},
cards:{
e:[['Graphs tell stories',`A graph shows how <b>two things are connected</b>, like how many bus tickets you buy and how many burgers you can still afford. The <b>horizontal</b> line (x) and the <b>vertical</b> line (y) each show one thing.`,'📈'],
['Steepness',`<b>Slope</b> says how steep a line is. Count how far it <b>rises</b> and divide by how far it <b>runs</b> across. A line that goes <b>up</b> has a positive slope. One that goes <b>down</b> has a negative slope.`,'⛰️'],
['Percent change',`To find a <b>percent change</b>, take the change, divide it by where you started, and multiply by 100. Going from 50 to 60 is a 20% rise: 10 \u00f7 50 \u00d7 100.`,'💯']],
a:[['Slope',`<b>Slope = rise \u00f7 run = (y\u2082 \u2212 y\u2081) \u00f7 (x\u2082 \u2212 x\u2081).</b> A downward-sloping line has negative slope, like a demand curve or a budget constraint. The steeper the line, the larger the absolute value of the slope.`,'📐'],
['Equation of a line',`A straight line is <b>y = a + bx</b>, where a is the vertical intercept and b the slope. The book\u2019s budget constraint example (burgers and bus tickets) has a vertical intercept of 5 and slope \u22120.25. Plug in x to find y.`,'📏'],
['Growth and ratios',`<b>Percent change</b> = (new \u2212 old) \u00f7 old \u00d7 100. With compound growth, a value that grows at rate g for n years becomes (1 + g)\u207f times larger. A <b>ratio</b> compares two numbers by dividing one by the other.`,'🔢']],
s:[['Solving systems',`Equilibrium is where two lines meet. Set Qd = Qs and solve for P, then substitute back to find Q. For lines y = b\u2081 + m\u2081x and y = b\u2082 + m\u2082x, the crossing is at x = (b\u2082 \u2212 b\u2081)/(m\u2081 \u2212 m\u2082).`,'🧮'],
['Areas',`Consumer and producer surplus are <b>triangles</b>: area = \u00bd \u00d7 base \u00d7 height. For a linear demand curve, consumer surplus = \u00bd \u00d7 (highest price \u2212 price paid) \u00d7 quantity. A rectangle\u2019s area is base \u00d7 height, such as revenue = P \u00d7 Q.`,'🔺'],
['Elasticity as slope',`Along a straight demand line Q = a \u2212 bP the slope is constant but elasticity changes: <b>E = (\u0394Q/\u0394P) \u00d7 (P/Q) = bP/Q</b> (absolute value). It is high at high prices and low at low prices.`,'🎚️']]},
qs:{
e:[mc(`Slope tells you\u2026`,[`how steep a line is`,`how long a line is`,`what colour it is`,`where it starts`],0,`It is rise divided by run.`),
mc(`A line that goes DOWN as you go right has\u2026`,[`a negative slope`,`a positive slope`,`no slope`,`a slope of 100`],0,`Downhill means negative.`),
mc(`Going from 50 to 60 is a percent change of\u2026`,[`20%`,`10%`,`60%`,`50%`],0,`10 \u00f7 50 \u00d7 100 = 20.`),
mc(`The two axes on a graph are called\u2026`,[`x (across) and y (up)`,`north and south`,`start and end`,`top and bottom only`],0,`Horizontal x, vertical y.`)],
a:[mc(`The slope between (1, 2) and (3, 8) is\u2026`,[`3`,`2`,`6`,`1/3`],0,`Rise 6 \u00f7 run 2 = 3.`),
mc(`In y = a + bx, the number a is the\u2026`,[`vertical intercept`,`slope`,`x value`,`area`],0,`Where the line crosses the y-axis.`),
mc(`A demand curve usually has a\u2026`,[`negative slope`,`positive slope`,`zero slope`,`vertical slope always`],0,`Price up, quantity down.`),
mc(`With compound growth of 5% a year, a value after 2 years is multiplied by\u2026`,[`1.1025`,`1.10`,`2.05`,`1.05`],0,`1.05 \u00d7 1.05.`)],
s:[mc(`Two lines meet where\u2026`,[`their y values (or Qd and Qs) are equal`,`their slopes are equal`,`they are parallel`,`x = 0`],0,`Set the equations equal and solve.`),
mc(`The area of a triangle is\u2026`,[`\u00bd \u00d7 base \u00d7 height`,`base \u00d7 height`,`base + height`,`base \u00f7 height`],0,`Used for surplus.`),
mc(`Along a straight-line demand curve, elasticity is\u2026`,[`higher at higher prices`,`the same everywhere`,`higher at lower prices`,`always zero`],0,`E = bP/Q grows with P.`),
mc(`Revenue as an area is\u2026`,[`P \u00d7 Q, a rectangle`,`\u00bd P \u00d7 Q`,`P + Q`,`P \u00f7 Q`],0,`Price times quantity.`)]},
gen:function(lv){
  if(lv==='e'){if(Math.random()<0.5){const run=S.int(2,5),sl=S.int(1,4);return {q:`A line goes up <b>${run*sl}</b> when it goes across <b>${run}</b>. What is its slope (rise \u00f7 run)?`,type:'num',ans:sl,tol:0.01,hint:`${run*sl} \u00f7 ${run}`,why:`${run*sl} \u00f7 ${run} = ${sl}.`};}
    const b=S.int(1,4),a=S.int(1,5),x=S.int(2,6);return {q:`A line is <b>y = ${a} + ${b}x</b>. What is y when x = ${x}?`,type:'num',ans:a+b*x,tol:0.01,hint:`Put x = ${x} into the rule.`,why:`${a} + ${b}\u00d7${x} = ${a+b*x}.`};}
  if(lv==='a'){const t=S.pick(['slope','y','pc']);
    if(t==='slope'){const x1=S.int(0,4),y1=S.int(0,10),dx=S.int(2,5),dy=S.pick([-8,-6,-4,4,6,10]);return {q:`Find the slope between (${x1}, ${y1}) and (${x1+dx}, ${y1+dy}).`,type:'num',ans:dy/dx,tol:0.01,hint:`rise \u00f7 run`,why:`${dy} \u00f7 ${dx} = ${f(dy/dx,2)}.`};}
    if(t==='y'){const a=S.int(5,20),b=S.pick([-0.5,-0.25,0.5,2,3]),x=S.pick([2,4,8]);return {q:`A line is y = ${a} + (${b})x. Find y when x = ${x}.`,type:'num',ans:a+b*x,tol:0.01,hint:`${a} + ${b}\u00d7${x}`,why:`${a} + ${b*x} = ${a+b*x}.`};}
    const o=S.pick([40,50,80,200]),n=Math.round(o*S.pick([1.1,1.25,1.5,0.8]));return {q:`A value changes from ${o} to ${n}. What is the percent change?`,type:'num',ans:100*(n-o)/o,tol:0.1,unit:'%',hint:`(new \u2212 old) \u00f7 old \u00d7 100`,why:`(${n} \u2212 ${o}) \u00f7 ${o} = ${f(100*(n-o)/o,1)}%.`};}
  const t=S.pick(['meet','area','el']);
  if(t==='meet'){const b1=S.int(20,40),m1=-S.pick([1,2]),b2=S.int(0,10),m2=S.pick([1,2,3]);const x=(b2-b1)/(m1-m2);return {q:`Demand: P = ${b1} \u2212 ${-m1}Q. Supply: P = ${b2} + ${m2}Q. Find the equilibrium quantity (2 decimals).`,type:'num',ans:x,tol:0.02,hint:`Set ${b1} \u2212 ${-m1}Q = ${b2} + ${m2}Q.`,why:`Q = (${b1} \u2212 ${b2}) \u00f7 (${-m1} + ${m2}) = ${f(x,2)}.`};}
  if(t==='area'){const base=S.int(10,40),h=S.int(6,20);return {q:`A triangle of consumer surplus has base ${base} (quantity) and height ${h} (price). What is its area?`,type:'num',ans:0.5*base*h,tol:0.01,hint:`\u00bd \u00d7 base \u00d7 height`,why:`\u00bd \u00d7 ${base} \u00d7 ${h} = ${0.5*base*h}.`};}
  const a=S.pick([80,100,120]),b=S.pick([2,4,5]),P=S.pick([5,8,10]);const Qd=a-b*P;return {q:`Demand Q = ${a} \u2212 ${b}P. At P = ${P}, quantity is ${Qd}. Compute the point elasticity |E| = bP/Q (2 decimals).`,type:'num',ans:b*P/Qd,tol:0.02,hint:`${b} \u00d7 ${P} \u00f7 ${Qd}`,why:`${b*P} \u00f7 ${Qd} = ${f(b*P/Qd,2)}.`};
}});

W({id:14,pack:'micro',emoji:'🌀',ch:'Microeconomics Appendix B: Indifference Curves',lab:'indiff',
name:{e:'Happy Curves',a:'Indifference Curves',s:'Indifference Curves and Consumer Choice'},
tag:{e:'Mixes that make you equally happy.',a:'Indifference curves, the marginal rate of substitution and the best bundle.',s:'Tangency, price changes and the substitution and income effects.'},
cards:{
e:[['Equally happy mixes',`Suppose Lilly could have <b>2 books and 120 doughnuts</b> or <b>3 books and 84 doughnuts</b>, and she would be <b>just as happy</b> either way. A curve joining all the mixes that make her equally happy is an <b>indifference curve</b>.`,'📚'],
['Higher is better',`Curves farther from the corner mean <b>more of both</b>, so Lilly is happier. Her money limits her though: the best mix is on the <b>highest curve</b> that her <b>budget line</b> reaches.`,'🏔️'],
['Swapping',`How many doughnuts would Lilly give up for one more book? That swap rate changes: when she has lots of doughnuts she will give up many; when she has few, she will give up only a few.`,'🔄']],
a:[['Indifference curves',`An <b>indifference curve</b> joins bundles that give the <b>same utility</b>. Curves slope down, never cross, and farther from the origin means higher utility. They are bowed in toward the origin because of diminishing marginal utility.`,'🌀'],
['MRS',`The <b>marginal rate of substitution</b> is the slope of the indifference curve: the amount of one good you will give up for one more unit of the other, keeping utility the same. It equals MU\u2093/MU\u1d67. It is high on the left (lots of Y, little X) and low on the right.`,'⚖️'],
['The best bundle',`The consumer maximises utility where the budget line is <b>tangent</b> to an indifference curve: <b>MRS = P\u2093 / P\u1d67</b>. This is the same rule as MU\u2093/P\u2093 = MU\u1d67/P\u1d67. A bundle on a lower curve wastes money; a higher curve is unaffordable.`,'🎯']],
s:[['Properties',`Indifference curves slope downward because more of both goods is preferred (monotonic preferences), cannot cross (transitivity), and are convex (diminishing MRS). With U = \u221a(xy), utility is constant along y = U\u00b2/x and MRS = y/x.`,'🔬'],
['Optimum',`Maximise U subject to P\u2093x + P\u1d67y = I. At the optimum MRS = P\u2093/P\u1d67 and the budget is exhausted. For U = \u221a(xy) the consumer spends half of income on each good: x* = I/(2P\u2093), y* = I/(2P\u1d67).`,'🎯'],
['Price change: SE and IE',`When P\u2093 falls, decompose the change in x: the <b>substitution effect</b> (move along the original curve to the new price ratio) and the <b>income effect</b> (move to the new curve because purchasing power rose). Total effect = SE + IE. For a normal good both raise x.`,'🔄']]},
qs:{
e:[mc(`Mixes on the same indifference curve make Lilly\u2026`,[`equally happy`,`very hungry`,`unhappy`,`poor`],0,`That is the definition.`),
mc(`A curve farther from the corner means\u2026`,[`more of both and a happier Lilly`,`less of both`,`the same happiness`,`a smaller budget`],0,`More is better.`),
mc(`The best mix Lilly can buy is on\u2026`,[`the highest curve her budget line reaches`,`the lowest curve`,`any curve`,`a curve she cannot afford`],0,`The budget line limits her.`),
mc(`If she has lots of doughnuts and few books, she is\u2026`,[`willing to give up many doughnuts for one more book`,`unwilling to give up any`,`bored`,`rich`],0,`Doughnuts are plentiful so each is worth little.`)],
a:[mc(`The marginal rate of substitution is\u2026`,[`the slope of an indifference curve`,`the price`,`the budget`,`total utility`],0,`How much of Y you swap for one more X.`),
mc(`At the best bundle\u2026`,[`MRS = Px/Py`,`MRS = 0`,`Px = Py`,`MU = 0`],0,`The budget line is tangent to the curve.`),
mc(`Indifference curves are bowed toward the origin because of\u2026`,[`diminishing marginal utility`,`taxes`,`price changes`,`inflation`],0,`Giving up plentiful goods is cheap; scarce ones costly.`),
mc(`Indifference curves cannot cross because\u2026`,[`one bundle can\u2019t be both equally and more preferred`,`they are straight`,`budgets are fixed`,`prices change`],0,`It would contradict consistent preferences.`)],
s:[mc(`For U = \u221a(xy), the consumer spends\u2026`,[`half of income on each good`,`all income on X`,`all on Y`,`a third on X`],0,`x* = I/(2Px), y* = I/(2Py).`),
mc(`The substitution effect of a fall in Px is a move\u2026`,[`along the original indifference curve to the new price ratio`,`to a higher curve`,`to the old budget line`,`to zero X`],0,`Holds utility constant.`),
mc(`The income effect of a price fall is a move\u2026`,[`to a higher indifference curve`,`along the same curve`,`to the origin`,`to the old budget line`],0,`Purchasing power rises.`),
mc(`Convex indifference curves mean MRS\u2026`,[`falls as you move right`,`rises as you move right`,`is constant`,`is zero`],0,`Diminishing MRS.`)]},
gen:function(lv){
  if(lv==='e'){const b=S.int(1,4),d1=S.int(100,140),drop=S.pick([30,36,40,48]);return {q:`Lilly is equally happy with <b>${b} ${b===1?'book':'books'} and ${d1} doughnuts</b> or <b>${b+1} books and ${d1-drop} doughnuts</b>. How many doughnuts does she give up for ONE more book?`,type:'num',ans:drop,tol:0.01,hint:`${d1} \u2212 ${d1-drop}`,why:`${d1} \u2212 ${d1-drop} = ${drop}.`};}
  if(lv==='a'){const px=S.pick([2,4,6,8]),py=S.pick([1,2]);if(Math.random()<0.5)return {q:`Px = ${$(px)} and Py = ${$(py)}. At the best bundle, what is the MRS (units of Y given up per extra X)?`,type:'num',ans:px/py,tol:0.01,hint:`MRS = Px \u00f7 Py`,why:`${px} \u00f7 ${py} = ${px/py}.`};
    const I=px*S.pick([10,20,30]);return {q:`Utility is U = \u221a(xy). Income ${$(I)}, Px = ${$(px)}. How many units of X does the consumer buy at the best bundle (x* = I/(2Px))?`,type:'num',ans:I/(2*px),tol:0.01,hint:`Half of income goes to X.`,why:`${I} \u00f7 (2\u00d7${px}) = ${I/(2*px)}.`};}
  const px=S.pick([8,12,16]),I=px*S.pick([8,16,24]);const xo=I/(2*px),xc=I/px,xn=2*I/px;if(Math.random()<0.5)return {q:`U = \u221a(xy). Income ${$(I)}, Px falls from ${$(px)} to ${$(px/4)}. The original bundle has x = ${f(xo,2)}. After the price fall the utility-maintaining (compensated) bundle has x = ${f(xc,2)}. Compute the <b>substitution effect</b> on x.`,type:'num',ans:xc-xo,tol:0.02,hint:`compensated x \u2212 original x`,why:`${f(xc,2)} \u2212 ${f(xo,2)} = ${f(xc-xo,2)}.`};
  return {q:`U = \u221a(xy). Income ${$(I)}, Px falls from ${$(px)} to ${$(px/4)}. Original x = ${f(xo,2)}, compensated x = ${f(xc,2)}, new best x = ${f(xn,2)}. Compute the <b>income effect</b> on x.`,type:'num',ans:xn-xc,tol:0.02,hint:`new best x \u2212 compensated x`,why:`${f(xn,2)} \u2212 ${f(xc,2)} = ${f(xn-xc,2)}.`};
}});

W({id:15,pack:'micro',emoji:'💎',ch:'Microeconomics Appendix C and Chapter 17',lab:'pv',
name:{e:'Time Machine Money',a:'Present Value',s:'Discounting, Bonds and Project Choice'},
tag:{e:'Is money later worth the same as money now?',a:'Discounting payments and comparing costs with future benefits.',s:'Streams, NPV decisions and why bond prices move opposite to interest rates.'},
cards:{
e:[['Now or later?',`Would you rather have <b>$100 today</b> or <b>$100 in five years</b>? Today! You could put it in a bank and it would grow. So money you will get later is worth <b>less</b> than the same money today.`,'⏳'],
['Present value',`The <b>present value</b> is what a future payment is worth <b>today</b>. If the bank pays 10%, then $110 next year is worth $100 today.`,'💵'],
['Bigger rate, smaller value',`The higher the interest rate and the longer you wait, the <b>less</b> a future payment is worth today.`,'📉']],
a:[['Discounting',`<b>Present discounted value</b> PV = FV \u00f7 (1 + r)\u207f. At r = 10%, $1,000 in 2 years is worth about $826 today. The formula undoes compound interest.`,'🧮'],
['Streams of payments',`For several payments, discount each and add them. For a project that costs C today and pays A each year, <b>NPV = PV of payments \u2212 C</b>. If NPV > 0 the project adds value. Firms and governments compare present costs with discounted future benefits.`,'🏗️'],
['Bonds',`A bond\u2019s price is the present value of its promised payments. A bond issued at 8% is worth its face value at 8%. If market interest rates rise to 11%, the fixed payments are discounted more heavily, so the bond\u2019s value <b>falls</b>.`,'📜']],
s:[['Formulas',`PV = \u03a3 A\u209c / (1 + r)\u1d57. For equal payments A for n years: PV = A[1 \u2212 (1 + r)\u207b\u207f]/r. A perpetuity of A a year is worth A/r. Higher discount rates reduce PV of distant payments the most.`,'📐'],
['Investment decisions',`Accept a project when <b>NPV > 0</b>. The choice of discount rate matters: long-run benefits, such as those of reducing carbon emissions, look small at high rates and large at low rates, which is why disputes over environmental policy often turn on the discount rate.`,'🌍'],
['Bond pricing',`Price = \u03a3 coupon/(1 + r)\u1d57 + face/(1 + r)\u207f. When the market rate equals the coupon rate the bond sells at par; above it, at a discount; below it, at a premium. Bond prices and interest rates move in opposite directions.`,'📜']]},
qs:{
e:[mc(`$100 today is\u2026`,[`worth more than $100 in five years`,`worth less than $100 in five years`,`worth the same`,`worth nothing`],0,`Today\u2019s money can earn interest.`),
mc(`If the bank pays 10%, $110 next year is worth how much today?`,[`$100`,`$110`,`$121`,`$90`],0,`110 \u00f7 1.10.`),
mc(`A higher interest rate makes future money worth\u2026`,[`less today`,`more today`,`the same`,`double`],0,`Discounting is heavier.`),
mc(`Waiting longer for a payment makes it worth\u2026`,[`less today`,`more today`,`the same`,`a prize`],0,`More time to discount.`)],
a:[mc(`The present value formula is\u2026`,[`FV \u00f7 (1 + r)\u207f`,`FV \u00d7 (1 + r)\u207f`,`FV \u2212 r`,`FV + r`],0,`It reverses compound growth.`),
mc(`A project should be done if its NPV is\u2026`,[`positive`,`negative`,`zero only`,`unknown`],0,`Benefits exceed costs in today\u2019s money.`),
mc(`If market interest rates rise, an existing bond\u2019s value\u2026`,[`falls`,`rises`,`stays the same`,`doubles`],0,`Its fixed payments are discounted more.`),
mc(`Why discount future payments?`,[`Money today can earn interest`,`Prices never change`,`The future is certain`,`It makes numbers bigger`],0,`Time has value.`)],
s:[mc(`A perpetuity paying A a year has present value\u2026`,[`A / r`,`A \u00d7 r`,`A \u00d7 (1 + r)`,`A \u2212 r`],0,`Infinite series of discounted payments.`),
mc(`A bond with coupon 5% when the market rate is 8% sells at\u2026`,[`a discount`,`a premium`,`par`,`zero`],0,`Its payments are below market rate.`),
mc(`A lower discount rate makes distant benefits seem\u2026`,[`larger in present value`,`smaller`,`unchanged`,`negative`],0,`Less discounting.`),
mc(`Bond prices and interest rates are\u2026`,[`inversely related`,`positively related`,`unrelated`,`equal`],0,`The seesaw.`)]},
gen:function(lv){
  if(lv==='e'){const P=S.pick([100,200,500]),r=S.pick([10,20,5]);return {q:`The bank pays <b>${r}%</b> a year. A friend promises you <b>$${P*(1+r/100)}</b> next year. How much is that worth today?`,type:'num',ans:P,tol:0.05,hint:`divide by ${1+r/100}`,why:`${P*(1+r/100)} \u00f7 ${1+r/100} = ${P}.`};}
  if(lv==='a'){const t=S.pick(['one','two','npv']);const r=S.pick([5,8,10]);
    if(t==='one'){const FV=S.pick([1000,2000,5000]),n=S.pick([2,3,5]);return {q:`Find the present value of $${FV} due in ${n} years at ${r}% (2 decimals).`,type:'num',ans:FV/Math.pow(1+r/100,n),tol:0.05,hint:`FV \u00f7 ${f(Math.pow(1+r/100,n),4)}`,why:`${FV} \u00f7 ${f(Math.pow(1+r/100,n),4)} = ${f(FV/Math.pow(1+r/100,n),2)}.`};}
    if(t==='two'){const A=S.pick([100,200,500]);const pv=A/(1+r/100)+A/Math.pow(1+r/100,2);return {q:`A project pays $${A} after 1 year and $${A} after 2 years. At ${r}%, what is the present value of the two payments (2 decimals)?`,type:'num',ans:pv,tol:0.05,hint:`Discount each payment separately.`,why:`${A}/${1+r/100} + ${A}/${f(Math.pow(1+r/100,2),4)} = ${f(pv,2)}.`};}
    const A=S.pick([100,200]),C=S.pick([250,300,350]);const pv=A/(1+r/100)+A/Math.pow(1+r/100,2);return {q:`A project costs $${C} today and pays $${A} after 1 year and $${A} after 2 years. At ${r}%, what is the NPV (PV of payments \u2212 cost, 2 decimals)?`,type:'num',ans:pv-C,tol:0.05,hint:`Find PV of payments first.`,why:`PV = ${f(pv,2)}; NPV = ${f(pv,2)} \u2212 ${C} = ${f(pv-C,2)}.`};}
  const t=S.pick(['bond','perp','three']);const r=S.pick([4,5,8,10]);
  if(t==='bond'){const c=S.pick([50,60,80]),F=1000;const p=c/(1+r/100)+(c+F)/Math.pow(1+r/100,2);return {q:`A bond pays $${c} after 1 year and $${c+F} after 2 years (coupon plus $1,000 face value). The market rate is ${r}%. What is its price (2 decimals)?`,type:'num',ans:p,tol:0.1,hint:`Discount each payment at ${r}%.`,why:`${c}/${1+r/100} + ${c+F}/${f(Math.pow(1+r/100,2),4)} = ${f(p,2)}.`};}
  if(t==='perp'){const A=S.pick([50,100,200]),rr=S.pick([4,5,8,10]);return {q:`A perpetuity pays $${A} every year forever. The interest rate is ${rr}%. What is its present value (A \u00f7 r)?`,type:'num',ans:A/(rr/100),tol:0.5,hint:`${A} \u00f7 ${rr/100}`,why:`${A} \u00f7 ${rr/100} = ${f(A/(rr/100),0)}.`};}
  const A=S.pick([100,200]);const pv=A/(1+r/100)+A/Math.pow(1+r/100,2)+A/Math.pow(1+r/100,3);return {q:`Three yearly payments of $${A} (end of years 1, 2, 3) are discounted at ${r}%. What is their total present value (2 decimals)?`,type:'num',ans:pv,tol:0.1,hint:`Sum A/(1 + r)\u1d57 for t = 1, 2, 3.`,why:`Total = ${f(pv,2)}.`};
}});
})();
(function(){
'use strict';
const Q=window.Q,S=window.S;
const mc=(q,o,a,why)=>({q,o,a,why});
const W=w=>Q.worlds.push(w);
const f=(x,d)=>S.f(x,d);
const $=x=>'$'+Number(x).toLocaleString('en-US',{maximumFractionDigits:2});
function pd(){const H=S.int(8,14),L=S.int(3,H-3),C=H+S.int(3,8),Sk=S.int(0,L-1);return {H,L,C,S:Sk};}

W({id:16,pack:'micro',emoji:'🎲',ch:'Microeconomics Chapters 10 and 11',lab:'game',
name:{e:'Shop Showdown',a:'Games and Strategy',s:'Nash Equilibrium and Cartels'},
tag:{e:'Two shops, two prices, one tricky choice.',a:'Payoff matrices, dominant strategies and the prisoner\u2019s dilemma.',s:'Nash equilibrium, cartel stability and repeated games.'},
cards:{
e:[['Thinking about the other shop',`When only two shops sell ice cream, each shop\u2019s earnings depend on <b>both</b> shops\u2019 prices. So each shop has to think about what the other will do. That kind of thinking is called <b>strategy</b>.`,'🍦'],
['The tricky choice',`If both shops charge a <b>high</b> price, both earn a lot. But if one shop secretly charges a <b>low</b> price it steals customers and earns even more. So both are tempted to cut prices, and in the end <b>both earn less</b>.`,'😬'],
['Rules to stop teamwork',`Shops that secretly agree to keep prices high are called a <b>cartel</b>. This is against the law in many countries because it hurts shoppers.`,'⚖️']],
a:[['Payoff matrices',`In a <b>game</b>, each player picks a strategy and the payoffs depend on both choices. A <b>dominant strategy</b> is best <b>whatever the other player does</b>. A <b>Nash equilibrium</b> is a set of choices where nobody can do better by changing alone.`,'🎯'],
['The prisoner\u2019s dilemma',`If cheating pays more than cooperating (Cheat > High > Low > Sucker), both firms end at Low/Low although High/High pays both more. Oligopolists face this when they try to <b>collude</b> and keep prices high.`,'⛓️'],
['Policy',`Collusion is illegal under antitrust law, which also reviews <b>mergers</b> using concentration measures. Oligopolies can also compete on advertising, quality or capacity, not just price.`,'🏛️']],
s:[['Best responses',`A player\u2019s <b>best response</b> maximises payoff given the other\u2019s action. A cell where each player\u2019s action is a best response to the other\u2019s is a pure-strategy <b>Nash equilibrium</b>. A dominant strategy equilibrium is a special case.`,'🔬'],
['Cartel instability',`In the one-shot dilemma the Nash outcome (Low, Low) is worse for both than (High, High). Cartels need monitoring and punishment (OPEC, price-fixing conspiracies); the incentive to cheat grows with the size of the cheating gain C \u2212 H.`,'🧩'],
['Repeated games',`When the game repeats, firms can sustain cooperation using a <b>grim trigger</b> (cheat once and the other punishes forever). Cooperation is stable if the discount factor \u03b4 \u2265 (C \u2212 H)/(C \u2212 L). Patient firms with a small cheating gain can collude tacitly.`,'🔁']]},
qs:{
e:[mc(`If both shops charge High, each earns a lot. Why might one shop charge Low anyway?`,[`To steal customers and earn even more`,`To lose money`,`To close down`,`By accident`],0,`Cheating pays when the other stays High.`),
mc(`Shops that secretly agree to keep prices high form a\u2026`,[`cartel`,`club`,`team`,`market`],0,`That is collusion.`),
mc(`When both shops cut prices, both end up earning\u2026`,[`less than if both had kept prices high`,`more than before`,`the same`,`nothing ever`],0,`That is the dilemma.`),
mc(`Strategy means\u2026`,[`thinking about what the other player will do`,`guessing`,`flipping a coin`,`ignoring others`],0,`Choices depend on each other.`)],
a:[mc(`A dominant strategy is best\u2026`,[`whatever the other player does`,`only when the other cheats`,`only when the other cooperates`,`never`],0,`It beats every alternative.`),
mc(`A Nash equilibrium is where\u2026`,[`no player can gain by changing alone`,`everyone earns the most`,`one player wins`,`payoffs are equal`],0,`Each choice is a best response.`),
mc(`In the prisoner\u2019s dilemma, the Nash outcome is\u2026`,[`worse for both than cooperating`,`best for both`,`impossible`,`random`],0,`Both cheat and both lose out.`),
mc(`Collusion among competitors is generally\u2026`,[`illegal under antitrust law`,`encouraged`,`required`,`impossible`],0,`It raises prices for consumers.`)],
s:[mc(`A best response is\u2026`,[`the action with the highest payoff given the other player\u2019s action`,`the cheapest action`,`a random action`,`the cooperative action`],0,`Fix the other\u2019s move and maximise yours.`),
mc(`Cooperation can be sustained in a repeated game if\u2026`,[`players are patient enough (high \u03b4)`,`the game is played once`,`C is very large and \u03b4 small`,`there is no punishment`],0,`The future cost of punishment outweighs the gain from cheating.`),
mc(`The critical discount factor is\u2026`,[`(C \u2212 H)/(C \u2212 L)`,`(H \u2212 L)/(C \u2212 H)`,`C/H`,`L/H`],0,`Cheating gain divided by gain-minus-punishment.`),
mc(`A larger gain from cheating (C \u2212 H) makes collusion\u2026`,[`harder to sustain`,`easier`,`unaffected`,`mandatory`],0,`The temptation rises.`)]},
gen:function(lv){
  if(lv==='e'){const g=pd();if(Math.random()<0.5)return {q:`Two shops: both High earns <b>${g.H}</b> each; both Low earns <b>${g.L}</b> each; if you charge Low while the other charges High you earn <b>${g.C}</b>, and the other earns <b>${g.S}</b>. How much more do you earn by cheating (Low) than by both staying High?`,type:'num',ans:g.C-g.H,tol:0.01,hint:`${g.C} \u2212 ${g.H}`,why:`${g.C} \u2212 ${g.H} = ${g.C-g.H}.`};
    return {q:`Both High earns <b>${g.H}</b> each; both Low earns <b>${g.L}</b> each. If both end up at Low, how much does each shop lose compared with both staying High?`,type:'num',ans:g.H-g.L,tol:0.01,hint:`${g.H} \u2212 ${g.L}`,why:`${g.H} \u2212 ${g.L} = ${g.H-g.L}.`};}
  if(lv==='a'){const g=pd();const t=Math.random();if(t<0.5)return {q:`Payoffs: both High (${g.H}, ${g.H}); both Low (${g.L}, ${g.L}); you Low, other High (${g.C}, ${g.S}); you High, other Low (${g.S}, ${g.C}). Each firm has a dominant strategy of Low. What is each firm\u2019s payoff at the Nash equilibrium?`,type:'num',ans:g.L,tol:0.01,hint:`The Nash cell is (Low, Low).`,why:`Both Low: ${g.L} each.`};
    return {q:`Both High earns ${g.H} each, both Low earns ${g.L} each, cheating earns ${g.C} (the victim earns ${g.S}). What is the total industry payoff if both cooperate (High, High)?`,type:'num',ans:2*g.H,tol:0.01,hint:`Add both firms\u2019 payoffs.`,why:`${g.H} + ${g.H} = ${2*g.H}.`};}
  const g=pd();const d=(g.C-g.H)/(g.C-g.L);if(Math.random()<0.6)return {q:`In a repeated pricing game: cooperate (High, High) pays ${g.H} each period, cheating once pays ${g.C}, the punishment phase pays ${g.L}. Compute the critical discount factor \u03b4* = (C \u2212 H)/(C \u2212 L) (2 decimals).`,type:'num',ans:d,tol:0.01,hint:`(${g.C} \u2212 ${g.H}) \u00f7 (${g.C} \u2212 ${g.L})`,why:`${g.C-g.H} \u00f7 ${g.C-g.L} = ${f(d,2)}.`};
  return {q:`Cooperating pays ${g.H} each period, cheating pays ${g.C} once, and punishment pays ${g.L} each period afterwards. By how much is each period worse in the punishment phase than under cooperation (H \u2212 L)?`,type:'num',ans:g.H-g.L,tol:0.01,hint:`${g.H} \u2212 ${g.L}`,why:`${g.H} \u2212 ${g.L} = ${g.H-g.L} per period.`};
}});

W({id:17,pack:'micro',emoji:'📉',ch:'Microeconomics Chapter 8',lab:'profit',
name:{e:'Stand Decisions',a:'Firm Decisions',s:'Short-Run Supply and Long-Run Entry'},
tag:{e:'Make more, keep going, or close up?',a:'Profit, loss and the shutdown rule for a price-taking firm.',s:'P = MC, break-even and long-run entry and exit.'},
cards:{
e:[['Taking the price',`When many stands sell the same lemonade, you must accept the going price. Your only choice is <b>how many cups to make</b>. Make more while the <b>extra cup brings in more than it costs</b>.`,'🍋'],
['Profit or loss',`If your earnings per cup are higher than your cost per cup, you make a profit. If lower, a loss. If you are losing even on the lemons alone, it is better to <b>close the stand</b>.`,'🚪'],
['Others join or leave',`If lemonade stands make good profits, <b>more people open stands</b> and the price drops. If stands lose money, some close and the price rises. Over time profits shrink to zero.`,'🔄']],
a:[['The profit rule',`A price-taking firm produces where <b>P = MC</b> (the price equals the cost of the last unit). Profit = (P \u2212 ATC) \u00d7 q: price minus average total cost, times quantity.`,'📐'],
['Shutdown rule',`If P is below <b>average variable cost</b> the firm should shut down in the short run: it loses only its fixed cost instead of more. If P is between AVC and ATC, it keeps producing at a loss because it covers some fixed cost.`,'🛑'],
['Long run',`With free entry and exit, <b>economic profit</b> attracts new firms, shifting supply right and lowering price; losses cause exit. The long-run price equals the <b>minimum of ATC</b>, where economic profit is zero.`,'♻️']],
s:[['Output decision',`With VC = c\u2081q + c\u2082q\u00b2: MC = c\u2081 + 2c\u2082q, so q* = (P \u2212 c\u2081)/(2c\u2082) when P > c\u2081. The short-run supply curve of the firm is its MC curve above the minimum of AVC.`,'🧮'],
['Shutdown and break-even',`The shutdown price is the minimum AVC (c\u2081 here). The break-even price is the minimum ATC, at q = \u221a(FC/c\u2082), and equals c\u2081 + 2\u221a(FC\u00b7c\u2082). Between the two the firm operates at a loss in the short run.`,'📏'],
['Entry, exit and efficiency',`In the long run P = minimum ATC, so firms produce at the least-cost scale (productive efficiency) and price equals marginal cost (allocative efficiency). Economic profit of zero still covers the owners\u2019 opportunity costs.`,'✅']]},

  const t=S.pick(['q','prof','be']);const c1=S.pick([2,4,5]),c2=S.pick([0.25,0.5,1]),F=S.pick([16,36,64,100]);

  if(t==='prof'){const q=S.int(4,14),P=c1+2*c2*q;const pr=P*q-(F+c1*q+c2*q*q);return {q:`FC = ${F}, VC = ${c1}q + ${c2}q\u00b2, price ${$(P)}. At the profit-maximising output (q = ${q}), compute profit.`,type:'num',ans:pr,tol:0.02,hint:`P\u00b7q \u2212 (FC + c\u2081q + c\u2082q\u00b2)`,why:`${P*q} \u2212 ${F+c1*q+c2*q*q} = ${f(pr,2)}.`};}
  return {q:`FC = ${F}, VC = ${c1}q + ${c2}q\u00b2. Compute the break-even price = minimum ATC = c\u2081 + 2\u221a(FC\u00b7c\u2082) (2 decimals).`,type:'num',ans:c1+2*Math.sqrt(F*c2),tol:0.02,hint:`\u221a(${F}\u00d7${c2}) = ${f(Math.sqrt(F*c2),2)}`,why:`${c1} + 2\u00d7${f(Math.sqrt(F*c2),2)} = ${f(c1+2*Math.sqrt(F*c2),2)}.`};

W({id:18,pack:'micro',emoji:'🛡️',ch:'Microeconomics Chapter 16',lab:'insure',
name:{e:'Safety Net Jar',a:'Insurance and Risk',s:'Asymmetric Information'},
tag:{e:'Sharing risk so bad luck hurts less.',a:'Expected loss, premiums and pooled risk.',s:'Adverse selection, moral hazard and how they break markets.'},
cards:{
e:[['Bad luck',`Sometimes something bad happens, like losing lunch money. One kid can\u2019t predict if it will happen to them, but in a big group <b>a certain number of kids</b> will lose theirs every year.`,'🍀'],
['The jar',`If every kid puts a little into a jar, the kids who lose lunch money can take some out. That is <b>insurance</b>: lots of people <b>pooling</b> their risk so nobody faces the whole loss alone.`,'🫙'],
['Sneaky information',`If kids who will surely lose their money are the only ones who join, the jar runs dry. Insurance works best when people can\u2019t hide how risky they are.`,'🕵️']],
a:[['Expected loss and premium',`<b>Expected loss = probability \u00d7 size of loss.</b> A fair premium equals the expected loss. A 10% chance of losing $1,000 has an expected loss of $100. Insurers add costs and profit, so real premiums are higher.`,'🧮'],
['Pooling',`An insurer can predict its claims because of the <b>law of large numbers</b>: with many independent customers the average claim settles near the expected loss. People pay a premium to avoid a large uncertain loss.`,'🫂'],
['Information problems',`<b>Adverse selection</b>: those most likely to claim are most eager to buy. <b>Moral hazard</b>: insured people may take more risks. Insurers use deductibles, co-payments, screening and experience rating.`,'⚠️']],
s:[['Information asymmetry',`When buyers know their own risk better than the insurer, a single premium based on the average attracts high-risk buyers most. Safe customers who value insurance less than the premium leave, raising the average risk and the premium: an <b>adverse selection spiral</b>.`,'🌀'],
['Moral hazard',`Full insurance weakens the incentive to take care. Deductibles, co-insurance and monitoring restore incentives. Mandates and group plans pool good and bad risks to avoid unravelling.`,'🛠️'],
['Beyond insurance',`Asymmetric information appears in used cars (lemons), loans (credit rationing) and labor markets (signalling through education). Warranties, reputation and regulation help reduce the problem.`,'🔬']]},
qs:{
e:[mc(`Insurance means\u2026`,[`many people sharing the risk of a bad event`,`everybody losing money`,`a lucky guess`,`a kind of toy`],0,`Pooling risk.`),
mc(`Why does a big pool make claims easy to predict?`,[`Averages are steady in large groups`,`Nobody loses anything`,`Everyone loses`,`There is no luck`],0,`Law of large numbers.`),
mc(`If only the riskiest kids join the jar, the jar\u2026`,[`runs dry`,`overflows`,`stays equal`,`gets bigger`],0,`Too many claims.`),
mc(`A premium is\u2026`,[`what you pay for insurance`,`what you win`,`a prize`,`a loan`],0,`The price of cover.`)],
a:[mc(`Expected loss equals\u2026`,[`probability \u00d7 size of loss`,`probability + loss`,`loss only`,`premium \u00f7 loss`],0,`Probability weights the loss.`),
mc(`A 20% chance of a $500 loss has an expected loss of\u2026`,[`$100`,`$20`,`$500`,`$1,000`],0,`0.2 \u00d7 500.`),
mc(`Adverse selection occurs when\u2026`,[`the riskiest people are the most eager to buy`,`people take more risks after buying`,`insurers cheat`,`prices fall`],0,`Hidden risk types.`),
mc(`Moral hazard is\u2026`,[`riskier behaviour after getting insurance`,`hiding risk before buying`,`a tax`,`a law`],0,`Hidden action.`)],
s:[mc(`Adverse selection can cause an insurance market to\u2026`,[`unravel as low-risk customers leave`,`grow forever`,`become cheaper`,`vanish for high-risk only`],0,`Premiums rise as the pool gets riskier.`),
mc(`A deductible helps reduce\u2026`,[`moral hazard`,`risk pooling`,`expected loss`,`premiums to zero`],0,`The insured bears part of the loss.`),
mc(`Pooling good and bad risks, such as group plans, helps because\u2026`,[`it prevents the spiral of leaving`,`it increases losses`,`it ends insurance`,`it removes premiums`],0,`Everyone is in the pool.`),
mc(`The \u201clemons\u201d problem is an example of\u2026`,[`asymmetric information`,`perfect information`,`public goods`,`monopoly`],0,`Sellers know quality that buyers can\u2019t see.`)]},
gen:function(lv){
  if(lv==='e'){const n=S.pick([10,20,50,100]),p=S.pick([0.1,0.2,0.25]),L=S.pick([10,20,50]);return {q:`Each of <b>${n}</b> kids has a <b>${p*100}%</b> chance of losing <b>${$(L)}</b>. About how much money will be lost across all the kids in a year?`,type:'num',ans:n*p*L,tol:0.01,hint:`kids \u00d7 chance \u00d7 loss`,why:`${n} \u00d7 ${p} \u00d7 ${L} = ${n*p*L}.`};}
  if(lv==='a'){const t=S.pick(['el','n','load']);const p=S.pick([0.05,0.1,0.2,0.25]),L=S.pick([200,500,1000,2000]);
    if(t==='el')return {q:`There is a ${p*100}% chance of a ${$(L)} loss. Compute the expected loss (the fair premium).`,type:'num',ans:p*L,tol:0.01,hint:`p \u00d7 L`,why:`${p} \u00d7 ${L} = ${p*L}.`};
    if(t==='n'){const n=S.pick([100,500,1000]);return {q:`An insurer has ${n} customers, each with a ${p*100}% chance of a ${$(L)} claim. What is the expected total claims?`,type:'num',ans:n*p*L,tol:0.5,hint:`n \u00d7 p \u00d7 L`,why:`${n} \u00d7 ${p*L} = ${n*p*L}.`};}
    const ld=S.pick([10,20,25]);return {q:`The fair premium is ${$(p*L)}. The insurer adds a ${ld}% charge for costs and profit. What is the premium?`,type:'num',ans:p*L*(1+ld/100),tol:0.05,hint:`fair premium \u00d7 ${1+ld/100}`,why:`${p*L} \u00d7 ${1+ld/100} = ${f(p*L*(1+ld/100),2)}.`};}
  const t=S.pick(['avg','hi','ded']);const sh=S.pick([0.2,0.4,0.5]);
  if(t==='avg'){return {q:`${sh*100}% of customers are high risk (40% chance of a $1,000 loss); the rest are low risk (10% chance). What premium equals the average expected loss for the whole pool?`,type:'num',ans:(sh*0.4+(1-sh)*0.1)*1000,tol:0.5,hint:`share-weighted average of 400 and 100`,why:`${sh}\u00d7400 + ${1-sh}\u00d7100 = ${f((sh*0.4+(1-sh)*0.1)*1000,0)}.`};}
  if(t==='hi')return {q:`After low-risk customers leave an insurance pool, only high-risk people remain (40% chance of a $1,000 loss). What fair premium must the insurer now charge?`,type:'num',ans:400,tol:0.5,hint:`0.4 \u00d7 1,000`,why:`0.4 \u00d7 1,000 = 400.`};
  const L=S.pick([1000,2000]),p=S.pick([0.1,0.2]),d=S.pick([100,200,300]);return {q:`A policy has a deductible of ${$(d)}: the customer pays the first ${$(d)} of any loss. The chance of a ${$(L)} loss is ${p*100}%. What is the insurer\u2019s expected payout per customer?`,type:'num',ans:p*(L-d),tol:0.05,hint:`p \u00d7 (loss \u2212 deductible)`,why:`${p} \u00d7 (${L} \u2212 ${d}) = ${f(p*(L-d),2)}.`};
}});
})();
