<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Economics Quest: a game of choices and markets, in three levels</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;700;800&family=Outfit:wght@500;700;800&family=Inter:wght@400;500;600&family=Newsreader:opsz,wght@6..72,500;6..72,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#EEF1F8;--card:#FFFFFF;--card2:#F5F7FC;--ink:#14182B;--muted:#56607F;--line:#D3D9EA;--good:#12945A;--bad:#D4294B;--on:#FFFFFF;
  --dots:rgba(90,100,160,.14);--shadow:rgba(20,24,43,.12);
  --hf:'Outfit',system-ui,sans-serif;--bf:'Inter',system-ui,sans-serif;--rad:14px;
  --acc:#6C5CE7;--acc2:#00A88F;--acc3:#F0693E;--gold:#F5B800;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0C1020;--card:#151B33;--card2:#1B2342;--ink:#EEF1FF;--muted:#A5AED0;--line:#2A3459;--good:#4ADE80;--bad:#FF6B8A;--dots:rgba(165,174,208,.10);--shadow:rgba(0,0,0,.5);}
}
:root[data-theme="dark"]{--bg:#0C1020;--card:#151B33;--card2:#1B2342;--ink:#EEF1FF;--muted:#A5AED0;--line:#2A3459;--good:#4ADE80;--bad:#FF6B8A;--dots:rgba(165,174,208,.10);--shadow:rgba(0,0,0,.5);}
[data-lv="e"]{--hf:'Baloo 2','Trebuchet MS',sans-serif;--bf:'Nunito',system-ui,sans-serif;--rad:20px;--acc:#FF5A87;--acc2:#2EC4A6;--acc3:#7B5CFF;--gold:#FFC93C}
[data-lv="a"]{--hf:'Outfit',system-ui,sans-serif;--bf:'Inter',system-ui,sans-serif;--rad:14px;--acc:#7C6CFF;--acc2:#19D3B0;--acc3:#FF7A59;--gold:#FFC53D}
[data-lv="s"]{--hf:'Newsreader',Georgia,serif;--bf:'IBM Plex Sans',system-ui,sans-serif;--rad:8px;--acc:#0E7C86;--acc2:#B8901E;--acc3:#B23A48;--gold:#D4A62A}
html{height:100%;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--bf);font-size:16.5px;line-height:1.6}
[data-lv="e"] body,body[data-lv="e"]{background-image:radial-gradient(circle,var(--dots) 1.6px,transparent 1.8px);background-size:24px 24px;font-weight:600}
h1,h2,h3,h4{font-family:var(--hf);line-height:1.15;margin:0 0 .45em;font-weight:800}
[data-lv="s"] h1,[data-lv="s"] h2,[data-lv="s"] h3{font-weight:700;letter-spacing:-.01em}
h1{font-size:clamp(1.9rem,5vw,3rem)} h2{font-size:clamp(1.4rem,3.5vw,2rem)} h3{font-size:1.25rem}
p{margin:.45em 0 .85em}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px;border-radius:8px}
code,.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
.app{max-width:1020px;margin:0 auto;padding:0 16px 70px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;margin:0 -16px 18px;padding:9px 16px;background:var(--bg);border-bottom:2px solid var(--line);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;background:none;border:0;padding:0;cursor:pointer;font-family:var(--hf);font-weight:800;font-size:1.15rem}
.who{display:flex;align-items:center;gap:8px;margin-left:auto;font-size:.88rem}
.xpbar{width:110px;height:12px;border-radius:99px;background:var(--line);overflow:hidden;border:1px solid var(--line)}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));width:0;transition:width .5s}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 10px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-weight:700;font-size:.85rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--rad);padding:20px;box-shadow:0 6px 22px var(--shadow)}
[data-lv="e"] .card{border:3px solid var(--ink);box-shadow:5px 5px 0 var(--ink)}
.card+.card{margin-top:16px}
.btn{display:inline-flex;align-items:center;gap:8px;cursor:pointer;background:var(--acc);color:var(--on);border:1px solid transparent;border-radius:calc(var(--rad) - 4px);padding:.55em 1.2em;font-family:var(--hf);font-weight:800;font-size:1.02rem;transition:transform .08s,filter .15s}
.btn:hover{filter:brightness(1.08);transform:translateY(-1px)} .btn:active{transform:translateY(1px)}
[data-lv="e"] .btn{border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink)}
[data-lv="e"] .btn:active{box-shadow:0 1px 0 var(--ink);transform:translateY(3px)}
.btn.alt{background:var(--card);color:var(--ink);border-color:var(--line)}
[data-lv="e"] .btn.alt{border-color:var(--ink)}
.btn.g2{background:var(--acc2)} .btn.g3{background:var(--acc3)}
.btn.sm{padding:.25em .8em;font-size:.88rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.on{outline:3px solid var(--gold)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:10px 0}
.levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px;margin-top:18px}
.lvcard{cursor:pointer;text-align:left;padding:20px;border-radius:var(--rad);background:var(--card);border:2px solid var(--line);color:var(--ink);transition:transform .12s}
.lvcard:hover{transform:translateY(-4px)}
.lvcard .big{font-size:2.6rem;line-height:1}
.lvcard h3{margin:.3em 0 .1em}
.lvcard.e{border-color:#FF5A87;font-family:'Nunito',sans-serif} .lvcard.a{border-color:#7C6CFF;font-family:'Inter',sans-serif} .lvcard.s{border-color:#0E7C86;font-family:'IBM Plex Sans',sans-serif}
.lvcard.e h3{font-family:'Baloo 2'} .lvcard.a h3{font-family:'Outfit'} .lvcard.s h3{font-family:'Newsreader',serif}
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.world{position:relative;text-align:left;cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:var(--rad);padding:14px 14px 12px;min-height:150px;display:flex;flex-direction:column;gap:3px;color:var(--ink);transition:transform .12s}
[data-lv="e"] .world{border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink)}
.world:hover{transform:translateY(-3px)}
.world .em{font-size:2rem;line-height:1}
.world .nm{font-family:var(--hf);font-weight:800;font-size:1.08rem;line-height:1.15;margin-top:4px}
.world .ch{font-size:.78rem;color:var(--muted)}
.world .st{margin-top:auto;letter-spacing:2px}
.world.lock{opacity:.55;cursor:not-allowed}
.world.next::after{content:"Next up";position:absolute;top:-10px;right:10px;background:var(--acc);color:var(--on);border-radius:99px;padding:0 10px;font-size:.78rem;font-weight:800;font-family:var(--hf)}
.tabs{display:flex;gap:6px;margin:12px 0 16px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--card);padding:6px 16px;border-radius:99px;cursor:pointer;font-family:var(--hf);font-weight:800}
.tab.on{background:var(--acc);color:var(--on);border-color:transparent}
.learn{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:start}
.learn .ic{font-size:3rem;line-height:1;background:var(--card2);border:1px solid var(--line);border-radius:var(--rad);padding:12px 14px}
.learn h3{font-size:1.4rem}
.learn p,.learn li{font-size:1.04rem}
.tag{display:inline-block;font-size:.76rem;font-weight:700;color:var(--muted);border:1px dashed var(--muted);border-radius:99px;padding:0 10px;margin-bottom:6px}
.formula{font-family:'IBM Plex Mono',monospace;background:var(--card2);border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:8px;padding:9px 12px;margin:8px 0;font-size:.92rem;overflow-x:auto;white-space:pre-wrap;font-weight:500}
.dots{display:flex;gap:6px;justify-content:center;margin:14px 0 4px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)} .dots i.on{background:var(--acc)}
.hud{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.hearts{font-size:1.4rem;letter-spacing:2px}
.qtext{font-size:1.2rem;font-family:var(--hf);font-weight:700;margin:6px 0 10px}
[data-lv="s"] .qtext,[data-lv="a"] .qtext{font-family:var(--bf);font-weight:600}
.data{font-family:'IBM Plex Mono',monospace;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:8px 0;font-size:.95rem;overflow-x:auto}
.opts{display:grid;gap:9px;margin:10px 0}
.opt{cursor:pointer;text-align:left;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 14px;color:var(--ink);font-weight:600}
[data-lv="e"] .opt{border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink)}
.opt:hover{filter:brightness(1.05)}
.opt.right{background:var(--good);color:#06210F;border-color:var(--good)} .opt.wrong{background:var(--bad);color:#fff;border-color:var(--bad)}
input.ans,select.sel{font:inherit;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);width:11em;max-width:100%}
[data-lv="e"] input.ans{border:3px solid var(--ink)}
.fb{min-height:1.5em;margin:8px 0;font-weight:700}
.fb.good{color:var(--good)} .fb.bad{color:var(--bad)}
.why{background:var(--card2);border-radius:10px;padding:9px 12px;margin:8px 0;font-size:.95rem;border:1px dashed var(--line)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:9px;margin:10px 0}
.kpi{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.kpi b{display:block;font-family:'IBM Plex Mono',monospace;font-size:1.2rem}
.kpi span{font-size:.76rem;color:var(--muted)}
.ctrl{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;margin:5px 0}
.ctrl label{font-weight:700;font-size:.92rem}
.ctrl output{font-family:'IBM Plex Mono',monospace;font-size:.9rem;min-width:3.6em;text-align:right}
.ctrl input[type=range]{grid-column:1/-1;width:100%;accent-color:var(--acc);height:26px}
.ctrls{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:2px 20px}
.chart{width:100%;height:auto;display:block;background:var(--card);border:1px solid var(--line);border-radius:12px;touch-action:none}
.chart text{fill:var(--ink);font-family:var(--bf);font-size:11px}
.chart .mut{fill:var(--muted)} .chart .gl{stroke:var(--line)} .chart .ax{stroke:var(--muted)}
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.callout{border-radius:12px;padding:10px 14px;margin:12px 0;background:var(--card2);border-left:4px solid var(--acc)}
.callout b.t{display:block;font-size:.74rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.win{text-align:center}
.badge{display:inline-grid;place-items:center;width:130px;height:130px;border-radius:50%;background:var(--gold);color:#14182B;font-size:3.3rem;border:3px solid var(--ink);box-shadow:0 6px 0 var(--ink);margin:6px auto 10px;animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.2) rotate(-30deg)}}
.stars{font-size:2rem;letter-spacing:4px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:700;z-index:60;animation:rise .35s}
@keyframes rise{from{transform:translate(-50%,20px);opacity:0}}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
.confetti i{position:absolute;top:-20px;width:10px;height:16px;animation:fall 2.4s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.badges{display:flex;flex-wrap:wrap;gap:10px}
.bdg{width:92px;text-align:center;font-size:.76rem;line-height:1.2}
.bdg .i{display:grid;place-items:center;width:58px;height:58px;margin:0 auto 4px;border-radius:50%;background:var(--card2);border:2px solid var(--line);font-size:1.7rem;filter:grayscale(1);opacity:.45}
.bdg.got .i{filter:none;opacity:1;background:var(--gold);border-color:var(--ink)}
.tbl{border-collapse:collapse;width:100%;font-size:.9rem}
.tbl th,.tbl td{padding:5px 9px;border-bottom:1px solid var(--line);text-align:right}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.foot{margin-top:28px;text-align:center;color:var(--muted);font-size:.85rem}
.linkbtn{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;cursor:pointer;font:inherit}
@media (max-width:640px){.learn{grid-template-columns:1fr}.twocol{grid-template-columns:1fr}.xpbar{width:70px}.brand span.t{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>
(function(){
'use strict';
const S=window.S={};
S.rng=function(seed){let a=seed>>>0;return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};};
S.R=Math.random;
S.int=(a,b,r)=>a+Math.floor((r||S.R)()*(b-a+1));
S.pick=(arr,r)=>arr[Math.floor((r||S.R)()*arr.length)];
S.shuffle=(a,r)=>{a=a.slice();r=r||S.R;for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
S.norm01=r=>{r=r||S.R;let u=0,v=0;while(!u)u=r();while(!v)v=r();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);};
S.sum=a=>a.reduce((s,x)=>s+x,0);
S.mean=a=>S.sum(a)/a.length;
S.median=a=>{const b=a.slice().sort((x,y)=>x-y),n=b.length;return n%2?b[(n-1)/2]:(b[n/2-1]+b[n/2])/2;};
S.mode=a=>{const c={};a.forEach(x=>c[x]=(c[x]||0)+1);let best=null,m=0;for(const k in c){if(c[k]>m){m=c[k];best=+k;}}const ties=Object.keys(c).filter(k=>c[k]===m).length;return {v:best,n:m,unique:ties===1};};
S.vari=a=>{const m=S.mean(a);return S.sum(a.map(x=>(x-m)**2))/(a.length-1);};
S.sd=a=>Math.sqrt(S.vari(a));
S.quart=a=>{const b=a.slice().sort((x,y)=>x-y),n=b.length,h=Math.floor(n/2);const lo=b.slice(0,h),hi=b.slice(n%2?h+1:h);return {q1:S.median(lo),q3:S.median(hi)};};
S.iqr=a=>{const q=S.quart(a);return q.q3-q.q1;};
S.skew=a=>{const m=S.mean(a),s=Math.sqrt(S.sum(a.map(x=>(x-m)**2))/a.length);return s===0?0:S.sum(a.map(x=>((x-m)/s)**3))/a.length;};
S.kurt=a=>{const m=S.mean(a),s2=S.sum(a.map(x=>(x-m)**2))/a.length;return s2===0?0:S.sum(a.map(x=>(x-m)**4))/a.length/(s2*s2)-3;};
/* normal */
S.erf=x=>{const s=Math.sign(x);x=Math.abs(x);const t=1/(1+0.3275911*x);const y=1-(((((1.061405429*t-1.453152027)*t)+1.421413741)*t-0.284496736)*t+0.254829592)*t*Math.exp(-x*x);return s*y;};
S.cdf=z=>0.5*(1+S.erf(z/Math.SQRT2));
S.pdf=z=>Math.exp(-z*z/2)/Math.sqrt(2*Math.PI);
S.inv=p=>{if(p<=0)return -Infinity;if(p>=1)return Infinity;const a=[-3.969683028665376e+01,2.209460984245205e+02,-2.759285104469687e+02,1.383577518672690e+02,-3.066479806614716e+01,2.506628277459239e+00],b=[-5.447609879822406e+01,1.615858368580409e+02,-1.556989798598866e+02,6.680131188771972e+01,-1.328068155288572e+01],c=[-7.784894002430293e-03,-3.223964580411365e-01,-2.400758277161838e+00,-2.549732539343734e+00,4.374664141464968e+00,2.938163982698783e+00],d=[7.784695709041462e-03,3.224671290700398e-01,2.445134137142996e+00,3.754408661907416e+00];
  const pl=0.02425,ph=1-pl;let q,r;
  if(p<pl){q=Math.sqrt(-2*Math.log(p));return (((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1);}
  if(p<=ph){q=p-0.5;r=q*q;return (((((a[0]*r+a[1])*r+a[2])*r+a[3])*r+a[4])*r+a[5])*q/(((((b[0]*r+b[1])*r+b[2])*r+b[3])*r+b[4])*r+1);}
  q=Math.sqrt(-2*Math.log(1-p));return -(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1);};
/* gamma / beta */
S.lgam=x=>{const c=[76.18009172947146,-86.50532032941677,24.01409824083091,-1.231739572450155,0.1208650973866179e-2,-0.5395239384953e-5];let y=x,t=x+5.5;t-=(x+0.5)*Math.log(t);let s=1.000000000190015;for(let j=0;j<6;j++)s+=c[j]/++y;return -t+Math.log(2.5066282746310005*s/x);};
S.betacf=(x,a,b)=>{const MAXIT=200,EPS=3e-12,FP=1e-300;let qab=a+b,qap=a+1,qam=a-1,c=1,d=1-qab*x/qap;if(Math.abs(d)<FP)d=FP;d=1/d;let h=d;for(let m=1;m<=MAXIT;m++){const m2=2*m;let aa=m*(b-m)*x/((qam+m2)*(a+m2));d=1+aa*d;if(Math.abs(d)<FP)d=FP;c=1+aa/c;if(Math.abs(c)<FP)c=FP;d=1/d;h*=d*c;aa=-(a+m)*(qab+m)*x/((a+m2)*(qap+m2));d=1+aa*d;if(Math.abs(d)<FP)d=FP;c=1+aa/c;if(Math.abs(c)<FP)c=FP;d=1/d;const del=d*c;h*=del;if(Math.abs(del-1)<EPS)break;}return h;};
S.betai=(x,a,b)=>{if(x<=0)return 0;if(x>=1)return 1;const bt=Math.exp(S.lgam(a+b)-S.lgam(a)-S.lgam(b)+a*Math.log(x)+b*Math.log(1-x));return x<(a+1)/(a+b+2)?bt*S.betacf(x,a,b)/a:1-bt*S.betacf(1-x,b,a)/b;};
S.tcdf=(t,df)=>{const x=df/(df+t*t),p=0.5*S.betai(x,df/2,0.5);return t>0?1-p:p;};
S.tinv=(p,df)=>{let lo=-60,hi=60;for(let i=0;i<100;i++){const m=(lo+hi)/2;if(S.tcdf(m,df)<p)lo=m;else hi=m;}return (lo+hi)/2;};
S.tp2=(t,df)=>2*(1-S.tcdf(Math.abs(t),df));
S.gammaP=(a,x)=>{if(x<=0)return 0;const gln=S.lgam(a);if(x<a+1){let ap=a,sum=1/a,del=sum;for(let n=0;n<300;n++){ap++;del*=x/ap;sum+=del;if(Math.abs(del)<Math.abs(sum)*1e-14)break;}return sum*Math.exp(-x+a*Math.log(x)-gln);}let b=x+1-a,c=1/1e-300,d=1/b,h=d;for(let i=1;i<300;i++){const an=-i*(i-a);b+=2;d=an*d+b;if(Math.abs(d)<1e-300)d=1e-300;c=b+an/c;if(Math.abs(c)<1e-300)c=1e-300;d=1/d;const del=d*c;h*=del;if(Math.abs(del-1)<1e-14)break;}return 1-Math.exp(-x+a*Math.log(x)-gln)*h;};
S.chicdf=(x,df)=>S.gammaP(df/2,x/2);
S.chip=(x,df)=>1-S.chicdf(x,df);

L.sd=function(root,lv,api){
  const ct=el('div',{class:'ctrls'});root.append(el('p',null,lv==='e'?'A lemonade stand in a small town. Change how thirsty people are and how many lemons are available, then set a price and see if there is a shortage or too much lemonade.':'Demand: Qd = b(Pmax \u2212 P). Supply: Qs = d(P \u2212 P0). Shift the curves and apply price controls.'));root.append(ct);
  const b=2,d=2;
  const Pm=Q.slider(ct,{label:lv==='e'?'How thirsty is the town? (highest price anyone would pay)':'Demand level: Pmax',min:30,max:70,value:50,pre:'$',on:()=>{upd();api.touch();}});
  const P0=Q.slider(ct,{label:lv==='e'?'How hard is lemonade to make? (lowest price a seller accepts)':'Supply level: P0',min:0,max:30,value:10,pre:'$',on:()=>{upd();api.touch();}});

  const pc=Q.slider(ct,{label:lv==='e'?'Price you charge':'Controlled price',min:0,max:70,value:30,pre:'$',on:()=>{upd();api.touch();}});

  const kp=el('div'),ch=el('div');root.append(kp,ch);
  function upd(){const pm=Pm.get(),p0=P0.get();const Ps=(b*pm+d*p0)/(b+d),Qs=b*(pm-Ps);
    let price=Ps,note='';if(lv==='e'){price=pc.get();}else if(mode==='ceil'){price=Math.min(Ps,pc.get());if(pc.get()<Ps)note='binding';}else if(mode==='floor'){price=Math.max(Ps,pc.get());if(pc.get()>Ps)note='binding';}
    const qd=Math.max(0,b*(pm-price)),qs=Math.max(0,d*(price-p0));const gap=qd-qs;
    const k=[[usd(Ps),'equilibrium price'],[f(Qs,1),'equilibrium quantity']];
    if(lv==='e'||note){k.push([f(qd,1),'quantity buyers want at '+usd(price)]);k.push([f(qs,1),'quantity sellers offer']);k.push([gap>0.05?'Shortage of '+f(gap,1):gap<-0.05?'Surplus of '+f(-gap,1):'Balanced','at '+usd(price)]);}
    if(lv!=='e'){const cs=0.5*(pm-Ps)*Qs,ps=0.5*(Ps-p0)*Qs;k.push([f(cs,0),'consumer surplus']);k.push([f(ps,0),'producer surplus']);}
    kp.innerHTML='';kp.append(Q.kpis(k));

  const T=lv==='e'?[['ppp','Burger prices']]:lv==='a'?[['ppp','Purchasing power'],['comp','Competitiveness']]:[['ppp','Purchasing power'],['comp','Competitiveness'],['real','Real exchange rate']];
  tabs(root,T,api,(cur,box)=>{
    if(cur==='ppp'){const ct=el('div',{class:'ctrls'});box.append(el('p',null,lv==='e'?'A burger costs money in two countries. If money exchanged at the \u201cfair\u201d rate, a burger would cost the same everywhere. Compare it with the real rate.':'Purchasing power parity (PPP): the exchange rate that would make a basket cost the same in both countries is e* = P(abroad, local currency) \u00f7 P(home, dollars).'),ct);
      const Pu=Q.slider(ct,{label:'Basket price in the US',min:2,max:30,step:.5,dec:1,value:5,pre:'$',on:()=>u()}),Pf=Q.slider(ct,{label:'Same basket in the other country (local currency)',min:2,max:400,step:2,value:300,on:()=>u()}),E=Q.slider(ct,{label:'Actual exchange rate (local currency per $1)',min:2,max:200,step:1,value:120,on:()=>u()});const kp=el('div');box.append(kp);
      function u(){const pe=Pf.get()/Pu.get(),act=E.get(),price=Pf.get()/act;kp.innerHTML='';kp.append(Q.kpis([[f(pe,1),'PPP exchange rate (local per $)'],[usd(price),'the foreign basket priced in dollars at the actual rate'],[f(100*(price/Pu.get()-1),1)+'%',price>Pu.get()?'foreign basket is dearer than at home: local currency looks overvalued':'foreign basket is cheaper than at home: local currency looks undervalued']]),Q.callout('PPP in practice','Prices of goods that can\u2019t be traded (haircuts, rent) differ across countries, so PPP is a guide to long-run pressure rather than an exact rule.'));api.touch();}
      u();}
    if(cur==='comp'){const ct=el('div',{class:'ctrls'});box.append(el('p',null,'A US machine sells for $1,000. See what it costs a foreign buyer as the exchange rate changes. Foreign currency per dollar: e.'),ct);
      const E=Q.slider(ct,{label:'Foreign currency per $1 (e)',min:0.6,max:1.6,step:.05,dec:2,value:1.0,on:()=>u()});const kp=el('div'),ch=el('div');box.append(kp,ch);
      function u(){const e=E.get();kp.innerHTML='';kp.append(Q.kpis([[f(1000*e,0),'price of the machine in foreign currency'],[f(100*(e-1),1)+'%',e>1?'dollar has appreciated: US exports get more expensive abroad':e<1?'dollar has depreciated: US exports get cheaper abroad':'no change'],[f(100*(1/e),0)+' foreign cents','price of a US dollar of imports, per foreign unit']]));
        ch.innerHTML='';ch.append(Q.ch.xy([{t:'line',pts:[[0.6,600],[1.6,1600]],c:'var(--acc)'},{t:'pt',x:e,y:1000*e,label:'now'}],{x0:0.6,x1:1.6,y0:500,y1:1700,xl:'Foreign currency per dollar',yl:'Foreign price of the machine',H:240}),Q.callout('Competitiveness','A weaker dollar (depreciation) tends to raise exports and cut imports, shrinking a trade deficit; a stronger dollar does the opposite.'));api.touch();}
      u();}
    if(cur==='real'){const ct=el('div',{class:'ctrls'});box.append(el('p',null,'Real exchange rate = (e \u00d7 P\u2095) \u00f7 P\u1da0 compares price levels across countries: it measures how many foreign baskets one home basket buys.'),ct);
      const E=Q.slider(ct,{label:'Foreign currency per $1 (e)',min:0.5,max:2,step:.05,dec:2,value:1,on:()=>u()}),Ph=Q.slider(ct,{label:'Home price level (index)',min:80,max:160,value:100,on:()=>u()}),Pf=Q.slider(ct,{label:'Foreign price level (index)',min:80,max:160,value:100,on:()=>u()});const kp=el('div');box.append(kp);
      function u(){const re=E.get()*Ph.get()/Pf.get();kp.innerHTML='';kp.append(Q.kpis([[f(re,3),'real exchange rate'],[re>1.02?'Home goods relatively dear':re<0.98?'Home goods relatively cheap':'Near parity','competitiveness of home goods']]),Q.callout('Prices matter','If home inflation is higher than abroad and the nominal rate does not adjust, home goods become dearer relative to foreign goods and net exports tend to fall.'));api.touch();}
      u();}
  });
};

/* ===== W24: growth engine ===== */
L.growth2=function(root,lv,api){
  const T=lv==='e'?[['pf','Shovels']]:lv==='a'?[['pf','Production function'],['catch','Catching up']]:[['pf','Production function'],['catch','Catching up'],['acct','Growth accounting']];
  tabs(root,T,api,(cur,box)=>{
    if(cur==='pf'){const ct=el('div',{class:'ctrls'});box.append(el('p',null,lv==='e'?'Each digger with more shovels digs more, but the 10th shovel helps less than the 1st. Better technology (a bigger machine!) lifts everything.':'Output per worker y = A\u00b7k\u1d45 (with \u03b1 = 0.5): more capital per worker k raises y, with diminishing returns. A shifts the curve up.'),ct);
      const A=Q.slider(ct,{label:lv==='e'?'Technology (how clever the tools are)':'Technology A',min:1,max:3,step:.25,dec:2,value:1,on:()=>u()}),k=Q.slider(ct,{label:lv==='e'?'Shovels per digger':'Capital per worker k',min:1,max:100,value:25,on:()=>u()});const kp=el('div'),ch=el('div');box.append(kp,ch);
      function u(){const a=A.get(),kk=k.get(),y=a*Math.sqrt(kk),d=a*Math.sqrt(kk+1)-y;kp.innerHTML='';kp.append(Q.kpis([[f(y,2),'output per worker'],[f(d,3),'extra output from one more unit of capital (falls as k rises)']]));
        const pts=[];for(let x=0;x<=100;x+=2)pts.push([x,a*Math.sqrt(x)]);ch.innerHTML='';ch.append(Q.ch.xy([{t:'line',pts:pts.map(p=>[p[0],p[1]/a]),c:'var(--muted)',dash:'6 4',name:'A = 1'},{t:'line',pts,c:'var(--acc)',name:'Your A'},{t:'pt',x:kk,y,label:'now'}],{x0:0,x1:100,y0:0,y1:32,xl:lv==='e'?'Shovels per digger':'Capital per worker',yl:'Output per worker',H:260,legw:100}),Q.callout('Two engines','Growth in output per worker comes from <b>more capital and skills</b> (with diminishing returns) and from <b>better technology</b> (which shifts the curve up and has no built-in limit).'));api.touch();}
      u();}
    if(cur==='catch'){const ct=el('div',{class:'ctrls'});box.append(el('p',null,'Two countries save the same share and have the same technology. The poor one starts with little capital. k\u2032 = k + s\u00b7A\u221ak \u2212 \u03b4k. Does it catch up?'),ct);
      const s=Q.slider(ct,{label:'Saving and investment rate',min:5,max:40,value:20,suf:'%',on:()=>u()}),dl=Q.slider(ct,{label:'Depreciation rate',min:2,max:10,value:5,suf:'%',on:()=>u()}),Ar=Q.slider(ct,{label:'Poor country\u2019s technology as % of rich country\u2019s',min:50,max:100,value:100,suf:'%',on:()=>u()});const kp=el('div'),ch=el('div');box.append(kp,ch);
      function u(){const S0=s.get()/100,d=dl.get()/100;const sim=(k0,A)=>{let k=k0;const p=[];for(let t=0;t<=80;t++){p.push([t,A*Math.sqrt(k)]);k=k+S0*A*Math.sqrt(k)-d*k;}return p;};
        const rich=sim(60,1),poor=sim(5,Ar.get()/100);const star=(A)=>Math.pow(S0*A/d,2);
        kp.innerHTML='';kp.append(Q.kpis([[f(rich[80][1],2),'rich country output per worker, year 80'],[f(poor[80][1],2),'poor country output per worker, year 80'],[f(Math.sqrt(star(1)),2)+' vs '+f(Ar.get()/100*Math.sqrt(star(Ar.get()/100)),2),'steady-state output per worker (rich vs poor)']]));
        ch.innerHTML='';ch.append(Q.ch.xy([{t:'line',pts:rich,c:'var(--acc)',name:'Rich start'},{t:'line',pts:poor,c:'var(--acc3)',name:'Poor start'}],{x0:0,x1:80,y0:0,y1:Math.max(...rich.map(p=>p[1]),...poor.map(p=>p[1]))*1.1,xl:'Years',yl:'Output per worker',H:260,legw:110}),Q.callout('Convergence','With the same technology, saving and depreciation, the poor country grows faster because extra capital adds more where capital is scarce, and it catches up. If its technology is lower, it converges to a lower level: <b>conditional convergence</b>.'));api.touch();}
      u();}
    if(cur==='acct'){const ct=el('div',{class:'ctrls'});box.append(el('p',null,'Growth accounting: g\u1d67 = g\u2090 + \u03b1\u00b7g\u2096 + (1 \u2212 \u03b1)\u00b7g\u2097. Output growth splits into technology, capital and labor.'),ct);
      const gA=Q.slider(ct,{label:'Technology growth g\u2090',min:0,max:4,step:.25,dec:2,value:1,suf:'%',on:()=>u()}),gK=Q.slider(ct,{label:'Capital growth g\u2096',min:0,max:8,step:.25,dec:2,value:4,suf:'%',on:()=>u()}),gL=Q.slider(ct,{label:'Labor growth g\u2097',min:0,max:4,step:.25,dec:2,value:1,suf:'%',on:()=>u()}),al=Q.slider(ct,{label:'Capital share \u03b1',min:0.2,max:0.5,step:.05,dec:2,value:0.3,on:()=>u()});const kp=el('div'),ch=el('div');box.append(kp,ch);
      function u(){const a=al.get(),ga=gA.get(),ck=a*gK.get(),cl=(1-a)*gL.get(),g=ga+ck+cl;kp.innerHTML='';kp.append(Q.kpis([[f(g,2)+'%','output growth'],[f(100*ga/g,0)+'%','share from technology'],[f(100*ck/g,0)+'%','from capital'],[f(100*cl/g,0)+'%','from labor'],[f(72/g,1)+' yrs','doubling time (rule of 72)']]));
        ch.innerHTML='';ch.append(Q.ch.bars([{l:'Technology',v:ga,c:'var(--acc)'},{l:'Capital',v:ck,c:'var(--acc2)'},{l:'Labor',v:cl,c:'var(--acc3)'},{l:'Total',v:g,c:'var(--ink)'}],{H:230,vals:true,vf:v=>f(v,2)+'%'}),Q.callout('Productivity','Growth in output per worker = technology growth + \u03b1 \u00d7 growth of capital per worker. Over long periods technology (the residual) accounts for a large part of rising living standards.'));api.touch();}
      u();}
  });
};

(function(){
'use strict';
const Q=window.Q,S=window.S;
const mc=(q,o,a,why)=>({q,o,a,why});
const W=w=>Q.worlds.push(w);
const f=(x,d)=>S.f(x,d);
const $=x=>'$'+Number(x).toLocaleString('en-US',{maximumFractionDigits:2});
/* equilibrium helper: Qd=a-bP, Qs=c+dP with integer equilibrium */
function mk(){let P,Qx,b,d,a,c,g=0;do{P=S.int(4,12);b=S.pick([2,3,4,5]);d=S.pick([2,3,4]);Qx=S.int(40,100);a=Qx+b*P;c=Qx-d*P;g++;}while(c<0&&g<50);if(c<0){P=8;b=3;d=2;Qx=60;a=Qx+b*P;c=Qx-d*P;}return {P,Q:Qx,a,b,c,d};}

cards:{
e:[['Scarcity',`There is only so much time, money and stuff, but people want a lot. This is called <b>scarcity</b>. Because of scarcity we must <b>choose</b>. Economics is the study of how people, businesses and countries make those choices.`,'🏝️'],
['Opportunity cost',`The <b>opportunity cost</b> of something is <b>what you give up to get it</b>. If you spend your allowance on a pizza, you can\u2019t also spend it on games. The pizza\u2019s real price includes the games you gave up.`,'🔄'],
['Budget line and frontier',`A <b>budget line</b> shows every mix of two things you can afford. A country has a similar picture, the <b>production possibilities frontier</b>: the most of two goods it can make with its workers and tools.`,'📐']],
a:[['Scarcity and choice',`Economics studies how to use scarce resources to satisfy unlimited wants. <b>Microeconomics</b> looks at individual households, firms and markets; <b>macroeconomics</b> looks at the whole economy (growth, jobs, inflation). Economists use <b>models</b>, simplified theories, and often hold other things equal (<i>ceteris paribus</i>).`,'📚'],
['Budget constraint',`A <b>budget constraint</b> shows the bundles you can afford. With income I and prices P\u2093 and P\u1d67 the line runs from I/P\u2093 to I/P\u1d67. Its slope is the opportunity cost: giving up 1 unit of X costs <b>P\u2093 \u00f7 P\u1d67</b> units of Y.`,'💵'],
['The PPF',`The <b>production possibilities frontier</b> shows the maximum combinations of two goods an economy can produce. Points <b>on</b> it are efficient, <b>inside</b> it waste resources, <b>outside</b> it are unreachable now. Economic growth shifts it outward. Economies can be <b>market</b>, <b>command</b> or <b>mixed</b>.`,'🏭']],
s:[['Rational choice at the margin',`People compare the <b>marginal</b> benefit and marginal cost of one more unit. Opportunity cost, not just money, is the right measure of cost. The three basic questions are: what is produced, how, and for whom. Distinguish <b>positive</b> statements (testable facts) from <b>normative</b> ones (value judgements).`,'🎯'],
['Constraints and the PPF',`The PPF is bowed outward because resources are specialised: the <b>opportunity cost of one good rises</b> as more of it is produced. Moving along the frontier shows trade-offs; shifting it requires more resources, better technology or more skilled labor. Allocative efficiency picks the point society values most.`,'📈'],
['Systems and objections',`Economic systems differ in who decides: market economies rely on prices and private property; command economies on central planning; most are mixed. Common objections (people are not perfectly rational, tastes differ) are met by treating models as tools, with behavioral economics refining the assumptions.`,'🧭']]},

W({id:2,emoji:'⚖️',ch:'Book chapter 3',lab:'sd',
name:{e:'Lemonade Market',a:'Demand and Supply',s:'Equilibrium, Price Controls and Surplus'},
tag:{e:'Why do prices go up and down?',a:'Demand, supply, equilibrium, shifts and price controls.',s:'Four-step analysis, shortages and surpluses, consumer and producer surplus.'},
cards:{
e:[['Buyers and sellers',`<b>Demand</b> is how much people want to buy at each price: when the price is <b>lower</b>, people buy <b>more</b>. <b>Supply</b> is how much sellers offer: when the price is <b>higher</b>, sellers offer <b>more</b>.`,'🍋'],
['The meeting point',`Where the two meet is the <b>equilibrium</b>: the price at which the amount people want equals the amount sellers offer. If the price is too low there is a <b>shortage</b>; too high and there is a <b>surplus</b> (leftovers).`,'🤝'],
['Things that change the picture',`If a hot day makes everyone thirsty, <b>demand goes up</b> and the price rises. If lemons get cheap, <b>supply goes up</b> and the price falls.`,'☀️']],
a:[['Law of demand and supply',`The <b>law of demand</b>: higher price, lower quantity demanded (ceteris paribus). The <b>law of supply</b>: higher price, higher quantity supplied. <b>Equilibrium</b> is where Qd = Qs. With Qd = 100 \u2212 2P and Qs = 20 + 2P: P* = 20, Q* = 60.`,'📈'],
['Shifts versus movements',`A price change moves you <b>along</b> a curve. Changes in income, tastes, prices of related goods, number of buyers or expectations <b>shift demand</b>. Input costs, technology, taxes and number of sellers <b>shift supply</b>. Use the four-step process: draw the model, decide which curve shifts, shift it, compare equilibria.`,'↔️'],
['Price controls',`A <b>price ceiling</b> below equilibrium creates a <b>shortage</b>. A <b>price floor</b> above equilibrium creates a <b>surplus</b>. Controls are binding only if they are on the wrong side of equilibrium.`,'🚫']],
s:[['Equilibrium analysis',`Equilibrium is stable: a price above P* creates a surplus that pushes the price down; below P*, a shortage pushes it up. Comparative statics: an increase in demand raises both P* and Q*; an increase in supply lowers P* and raises Q*; when both shift, one of P* or Q* is ambiguous.`,'🧮'],
['Surplus and efficiency',`<b>Consumer surplus</b> is the area between the demand curve and the price; <b>producer surplus</b> the area between the price and the supply curve. At the competitive equilibrium total surplus is maximised. A binding price control removes mutually beneficial trades: a <b>deadweight loss</b>.`,'🔺'],
['Price controls in depth',`A binding ceiling reduces quantity traded to the quantity supplied and invites rationing, queues and black markets; a binding floor reduces quantity to the quantity demanded and leaves unsold surplus. Who gains and loses depends on the elasticity of demand and supply.`,'⚖️']]},

    return {q:`At a price of <b>${$(P)}</b> people want <b>${qs}</b> cups but sellers offer <b>${qd}</b> cups. How big is the <b>surplus</b> (cups left over)?`,type:'num',ans:qd-qs,tol:0.01,hint:`Offered minus wanted.`,why:`${qd} \u2212 ${qs} = ${qd-qs} left over.`};}
  if(lv==='a'){const m=mk(),t=S.pick(['p','q','gap']);const base=`Demand: Qd = ${m.a} \u2212 ${m.b}P. Supply: Qs = ${m.c} + ${m.d}P.`;
    if(t==='p')return {q:`${base} Find the equilibrium price.`,type:'num',ans:m.P,tol:0.01,hint:`Set Qd = Qs and solve for P.`,why:`${m.a} \u2212 ${m.b}P = ${m.c} + ${m.d}P \u2192 ${m.a-m.c} = ${m.b+m.d}P \u2192 P = ${m.P}.`};
    if(t==='q')return {q:`${base} Find the equilibrium quantity.`,type:'num',ans:m.Q,tol:0.01,hint:`First find P*, then plug into either curve.`,why:`P* = ${m.P}; Q = ${m.a} \u2212 ${m.b}\u00d7${m.P} = ${m.Q}.`};
    const pc=m.P-S.int(1,3);return {q:`${base} A price ceiling of ${$(pc)} is imposed (below the equilibrium). How large is the shortage?`,type:'num',ans:(m.a-m.b*pc)-(m.c+m.d*pc),tol:0.01,hint:`Compute Qd and Qs at the ceiling.`,why:`Qd = ${m.a-m.b*pc}, Qs = ${m.c+m.d*pc}; shortage = ${(m.a-m.b*pc)-(m.c+m.d*pc)}.`};}
  const m=mk();const t=S.pick(['cs','ps','shift']);
  if(t==='cs'){const pmax=m.a/m.b,cs=0.5*(pmax-m.P)*m.Q;return {q:`Demand: Qd = ${m.a} \u2212 ${m.b}P (so the highest price anyone pays is ${f(pmax,2)}). The equilibrium is P* = ${m.P}, Q* = ${m.Q}. Compute consumer surplus = \u00bd \u00d7 (highest price \u2212 P*) \u00d7 Q*.`,type:'num',ans:cs,tol:0.1,hint:`It is a triangle.`,why:`\u00bd \u00d7 (${f(pmax,2)} \u2212 ${m.P}) \u00d7 ${m.Q} = ${f(cs,2)}.`};}

  const sh=S.pick([10,20,30]),P2=(m.a+sh-m.c)/(m.b+m.d);return {q:`Demand: Qd = ${m.a} \u2212 ${m.b}P and supply Qs = ${m.c} + ${m.d}P. Demand rises so that Qd = ${m.a+sh} \u2212 ${m.b}P. Find the <b>new</b> equilibrium price (2 decimals).`,type:'num',ans:P2,tol:0.02,hint:`Solve ${m.a+sh} \u2212 ${m.b}P = ${m.c} + ${m.d}P.`,why:`P = (${m.a+sh} \u2212 ${m.c}) \u00f7 ${m.b+m.d} = ${f(P2,2)}.`};
}});

W({id:3,emoji:'💼',ch:'Book chapters 4 and 17',lab:'markets',
name:{e:'Jobs and Piggy Banks',a:'Labor and Financial Markets',s:'Wages, Interest and Compound Growth'},
tag:{e:'Wages are the price of work; interest is the price of borrowing.',a:'Labor markets, minimum wages, interest rates and compound growth.',s:'Loanable funds, crowding out, present value and real interest rates.'},
cards:{
e:[['The price of work',`Workers sell their time and businesses buy it. The price is the <b>wage</b>. If the wage is high, more people want jobs but businesses hire fewer. The wage settles where the two meet.`,'💼'],
['Interest',`If you <b>save</b> money in a bank, the bank pays you <b>interest</b>. If you <b>borrow</b>, you pay interest. With <b>compound interest</b> you earn interest on your interest, so money grows faster and faster.`,'🐷'],
['Rule of 72',`A quick trick: divide <b>72</b> by the interest rate to see how many years it takes your money to double. At 8% it takes about <b>9 years</b>.`,'⏱️']],
a:[['Labor markets',`Demand for labor slopes down; supply of labor slopes up; the equilibrium wage clears the market. A <b>minimum wage</b> above equilibrium raises pay for those employed but reduces jobs and creates <b>unemployment</b> (Ls \u2212 Ld).`,'👷'],
['Financial markets',`Savers supply funds and borrowers demand them; the <b>interest rate</b> is the price. Higher rates encourage saving and discourage borrowing. <b>Compound growth</b>: FV = P(1 + r)\u207f; <b>rule of 72</b>: doubling time \u2248 72 \u00f7 rate (%).`,'🏦'],
['Smart saving',`<b>Diversification</b> spreads risk across many investments. Stocks have higher average returns and higher risk than bank savings. Starting early matters because of compounding.`,'📊']],
s:[['Wages and employment',`Labor demand is derived from the demand for output and the marginal productivity of workers. A binding minimum wage w\u0305 > w* gives employment L\u1d48(w\u0305) and unemployment L\u02e2(w\u0305) \u2212 L\u1d48(w\u0305). The size of the job loss depends on the elasticity of labor demand.`,'⚙️'],
['Loanable funds',`The equilibrium interest rate clears the market for funds. Government borrowing shifts demand right, raising the interest rate and <b>crowding out</b> some private investment. Real interest rate \u2248 nominal rate \u2212 inflation.`,'🔁'],
['Time value of money',`<b>Present value</b> PV = FV / (1 + r)\u207f discounts future money. Exact doubling time is ln 2 / ln(1 + r); the rule of 72 approximates it. Efficient markets aggregate information in prices, so consistently beating the market is hard.`,'⏳']]},
qs:{
e:[mc(`If you put money in a bank, the bank pays you\u2026`,[`interest`,`a fine`,`nothing ever`,`a wage`],0,`Interest is the price for lending your money.`),
mc(`Compound interest means\u2026`,[`you earn interest on your interest`,`you pay twice`,`interest never changes`,`you must spend it`],0,`That makes savings grow faster over time.`),
mc(`The rule of 72 helps you guess\u2026`,[`how long money takes to double`,`your height`,`prices in a shop`,`the wage`],0,`72 \u00f7 interest rate.`),
mc(`A wage is\u2026`,[`the price of work`,`a kind of tax`,`a loan`,`a gift`],0,`Workers sell labor at a wage.`)],
a:[mc(`A minimum wage set above the equilibrium wage will\u2026`,[`create unemployment`,`create a shortage of workers`,`do nothing`,`lower wages`],0,`More people want jobs than firms offer.`),
mc(`If the interest rate rises, borrowing usually\u2026`,[`falls`,`rises`,`stays the same`,`doubles`],0,`Borrowing becomes more expensive.`),
mc(`Using the rule of 72, money at 6% doubles in about\u2026`,[`12 years`,`6 years`,`72 years`,`36 years`],0,`72 \u00f7 6 = 12.`),
mc(`Diversification means\u2026`,[`spreading money across many investments`,`putting everything in one stock`,`avoiding all savings`,`paying more interest`],0,`It reduces risk.`)],
s:[mc(`Government borrowing more tends to\u2026`,[`raise the interest rate and crowd out private investment`,`lower interest rates`,`have no effect`,`raise saving only`],0,`Demand for loanable funds rises.`),
mc(`The present value of $100 due in one year at 10% is\u2026`,[`about $90.91`,`$110`,`$100`,`$91.09`],0,`100 \u00f7 1.10.`),
mc(`Real interest rate is approximately\u2026`,[`nominal rate minus inflation`,`nominal rate plus inflation`,`inflation only`,`nominal rate times inflation`],0,`It adjusts for lost purchasing power.`),
mc(`A binding minimum wage creates more unemployment when labor demand is\u2026`,[`elastic`,`inelastic`,`vertical`,`unrelated`],0,`Firms cut more jobs when demand responds a lot to wages.`)]},
gen:function(lv){
  if(lv==='e'){if(Math.random()<0.5){const P=S.pick([100,200,500]),r=S.pick([10,20]);return {q:`You save <b>$${P}</b> at <b>${r}%</b> interest a year. How much do you have after <b>2 years</b> with compound interest?`,type:'num',ans:P*Math.pow(1+r/100,2),tol:0.05,hint:`Multiply by ${1+r/100} twice.`,why:`${P} \u00d7 ${1+r/100} \u00d7 ${1+r/100} = ${f(P*Math.pow(1+r/100,2),2)}.`};}
    const r=S.pick([4,6,8,9,12]);return {q:`Use the <b>rule of 72</b>. Money earns <b>${r}%</b> a year. About how many years does it take to double?`,type:'num',ans:72/r,tol:0.01,hint:`72 \u00f7 ${r}`,why:`72 \u00f7 ${r} = ${f(72/r,1)} years.`};}
  if(lv==='a'){const t=S.pick(['fv','r72','mw']);
    if(t==='fv'){const P=S.pick([500,1000,2000]),r=S.pick([4,5,6,8]),n=S.pick([3,5,10]);return {q:`You save $${P} at ${r}% a year, compounded, for ${n} years. Find the future value (nearest dollar): FV = P(1 + r)^n.`,type:'num',ans:P*Math.pow(1+r/100,n),tol:1,hint:`(1 + ${r/100})^${n} = ${f(Math.pow(1+r/100,n),4)}`,why:`${P} \u00d7 ${f(Math.pow(1+r/100,n),4)} = ${f(P*Math.pow(1+r/100,n),0)}.`};}
    if(t==='r72'){const r=S.pick([3,4,6,8,9]);return {q:`Rule of 72: how many years to double at ${r}% a year?`,type:'num',ans:72/r,tol:0.01,hint:`72 \u00f7 rate`,why:`72 \u00f7 ${r} = ${72/r}.`};}
    const w=S.pick([9,10,11,12]);return {q:`Labor demand: L = 100 \u2212 5w. Labor supply: L = 20 + 5w. A minimum wage of $${w} is set (equilibrium wage is $8). How many people are unemployed?`,type:'num',ans:(20+5*w)-(100-5*w),tol:0.01,hint:`Supply minus demand at $${w}.`,why:`Ls = ${20+5*w}, Ld = ${100-5*w}; unemployed = ${(20+5*w)-(100-5*w)}.`};}
  const t=S.pick(['pv','real','dbl']);
  if(t==='pv'){const FV=S.pick([1000,2000,5000]),r=S.pick([4,5,8,10]),n=S.pick([2,3,5]);return {q:`What is the present value of $${FV} received in ${n} years if the interest rate is ${r}%? PV = FV / (1 + r)^n (2 decimals).`,type:'num',ans:FV/Math.pow(1+r/100,n),tol:0.05,hint:`Divide by ${f(Math.pow(1+r/100,n),4)}`,why:`${FV} \u00f7 ${f(Math.pow(1+r/100,n),4)} = ${f(FV/Math.pow(1+r/100,n),2)}.`};}
  if(t==='real'){const nr=S.int(4,10),inf=S.int(1,4);return {q:`The nominal interest rate is ${nr}% and inflation is ${inf}%. What is the approximate real interest rate (%)?`,type:'num',ans:nr-inf,tol:0.01,hint:`nominal \u2212 inflation`,why:`${nr} \u2212 ${inf} = ${nr-inf}%.`};}
  const r=S.pick([3,5,8,10]);return {q:`Compute the exact doubling time at ${r}% compound growth: ln 2 \u00f7 ln(1 + r), in years (1 decimal).`,type:'num',ans:Math.log(2)/Math.log(1+r/100),tol:0.1,unit:'years',hint:`ln 2 = 0.6931`,why:`0.6931 \u00f7 ln(${1+r/100}) = ${f(Math.log(2)/Math.log(1+r/100),1)} years (rule of 72 says ${f(72/r,1)}).`};
}});
})();

W({id:4,emoji:'🎈',ch:'Book chapter 5',lab:'elastic',
name:{e:'Stretchy or Stiff',a:'Elasticity',s:'Elasticities and Total Revenue'},
tag:{e:'When prices change, do people notice?',a:'Price elasticity by the midpoint method, revenue and other elasticities.',s:'Determinants, polar cases, income and cross-price elasticity.'},
cards:{
e:[['Rubber bands',`When the price of something changes, do buyers react a lot? If they do, demand is <b>stretchy</b> (elastic): fancy candy or one brand of cereal. If they hardly react, it is <b>stiff</b> (inelastic): things you really need, like medicine or salt.`,'🎈'],
['Why it matters',`If demand is <b>stiff</b>, a shop can raise its price and make <b>more</b> money. If demand is <b>stretchy</b>, raising the price makes buyers run away and the shop earns <b>less</b>.`,'💰'],
['What makes it stretchy?',`Demand is more stretchy when there are <b>lots of substitutes</b>, when the thing is a <b>luxury</b>, and when buyers have <b>time</b> to find alternatives.`,'🔀']],
a:[['Midpoint formula',`<b>Elasticity = (% change in quantity) \u00f7 (% change in price)</b> using averages as the base: %\u0394Q = \u0394Q \u00f7 average Q, %\u0394P = \u0394P \u00f7 average P. The midpoint method gives the same value for a rise or a fall.`,'📐'],
['Elastic or inelastic?',`|E| > 1: <b>elastic</b>. |E| < 1: <b>inelastic</b>. |E| = 1: <b>unitary</b>. Total revenue = P \u00d7 Q. If demand is elastic, raising price lowers revenue; if inelastic, raising price raises revenue.`,'📊'],
['Other elasticities',`Determinants: availability of substitutes, necessity versus luxury, share of budget, time. <b>Income elasticity</b> tells how demand responds to income (negative for inferior goods). <b>Cross-price elasticity</b> is positive for substitutes and negative for complements. Elasticity of supply is also positive.`,'🧩']],
s:[['Computing and interpreting',`E\u1d48 = [(Q\u2082\u2212Q\u2081)/((Q\u2081+Q\u2082)/2)] \u00f7 [(P\u2082\u2212P\u2081)/((P\u2081+P\u2082)/2)]. Along a straight-line demand curve elasticity falls as price falls: elastic at high prices, inelastic at low prices, unitary at the midpoint. Polar cases: perfectly inelastic (vertical) and perfectly elastic (horizontal).`,'🧮'],
['Revenue and tax incidence',`Total revenue is maximised where elasticity is unitary. When a tax is imposed, the burden falls more on the side of the market that is <b>less elastic</b>. Supply elasticity rises with the time sellers have to adjust.`,'⚖️'],
['Income and cross elasticities',`Income elasticity > 1: luxury; between 0 and 1: normal necessity; < 0: inferior good. Cross-price elasticity of A with respect to the price of B: positive for substitutes, negative for complements, near zero for unrelated goods. Both use the midpoint method.`,'🔗']]},
qs:{
e:[mc(`Salt has few substitutes and people need it. Its demand is probably\u2026`,[`stiff (inelastic)`,`stretchy (elastic)`,`zero`,`infinite`],0,`People keep buying it even if the price rises.`),
mc(`If demand is stretchy and a shop raises its price, the shop\u2019s earnings\u2026`,[`go down`,`go up`,`stay the same`,`double`],0,`Buyers leave in large numbers.`),
mc(`Which makes demand more stretchy?`,[`Many substitutes`,`No other choices`,`It is a necessity`,`Nobody has time`],0,`Buyers can switch easily.`),
mc(`Fancy candy is probably\u2026`,[`stretchy`,`stiff`,`a necessity`,`free`],0,`It is a luxury with substitutes.`)],
a:[mc(`Elasticity of demand is\u2026`,[`% change in quantity \u00f7 % change in price`,`change in price \u00f7 change in quantity`,`price \u00d7 quantity`,`quantity \u00f7 price`],0,`That is the definition.`),
mc(`If |E| = 0.5, demand is\u2026`,[`inelastic`,`elastic`,`unitary`,`perfectly elastic`],0,`Less than 1.`),
mc(`When demand is inelastic, raising the price\u2026`,[`raises total revenue`,`lowers total revenue`,`leaves revenue unchanged`,`makes quantity rise`],0,`The percent fall in quantity is smaller than the percent rise in price.`),
mc(`Two goods with positive cross-price elasticity are\u2026`,[`substitutes`,`complements`,`unrelated`,`inferior goods`],0,`If the price of one rises, demand for the other rises.`)],
s:[mc(`Along a straight-line demand curve, the upper half is\u2026`,[`elastic`,`inelastic`,`unitary throughout`,`perfectly inelastic`],0,`High prices, small quantities: percent changes in Q are large.`),
mc(`A tax burden falls more on\u2026`,[`the side of the market that is less elastic`,`the more elastic side`,`the government`,`neither`],0,`The less elastic side cannot escape the tax easily.`),
mc(`An income elasticity below 0 indicates\u2026`,[`an inferior good`,`a luxury`,`a necessity`,`a complement`],0,`Demand falls when income rises.`),
mc(`Revenue is maximised where\u2026`,[`|E| = 1`,`|E| = 0`,`|E| is largest`,`price is highest`],0,`At unitary elasticity extra price and lost quantity offset.`)]},
gen:function(lv){
  if(lv==='e'){const p=S.pick([5,10,20]),g=S.pick([10,20,50]);if(Math.random()<0.5)return {q:`A toy costs <b>${$(p)}</b> and the price rises to <b>${$(p*(1+g/100))}</b>. By what percent did the price rise?`,type:'num',ans:g,tol:0.2,unit:'%',hint:`change \u00f7 old price \u00d7 100`,why:`${p*g/100} \u00f7 ${p} \u00d7 100 = ${g}%.`};
    const p2=S.pick([2,3,4,5]),q=S.int(10,40);return {q:`A shop sells <b>${q}</b> ice creams a day at <b>${$(p2)}</b> each. What is the shop\u2019s total revenue in a day?`,type:'num',ans:p2*q,tol:0.01,hint:`price \u00d7 quantity`,why:`${p2} \u00d7 ${q} = ${p2*q}.`};}
  if(lv==='a'){const t=S.pick(['el','tr']);const P1=S.pick([10,20,40]),P2=P1+S.pick([2,4,5]),Q1=S.int(80,200),Q2=Q1-S.int(5,40);
    if(t==='el'){const dq=(Q2-Q1)/((Q1+Q2)/2),dp=(P2-P1)/((P1+P2)/2);return {q:`The price rises from ${$(P1)} to ${$(P2)} and quantity demanded falls from ${Q1} to ${Q2}. Use the midpoint method to compute |elasticity| (2 decimals).`,type:'num',ans:Math.abs(dq/dp),tol:0.02,hint:`%\u0394Q = \u0394Q \u00f7 avg Q; %\u0394P = \u0394P \u00f7 avg P`,why:`%\u0394Q = ${f(100*dq,1)}%, %\u0394P = ${f(100*dp,1)}%; E = ${f(Math.abs(dq/dp),2)}.`};}
    return {q:`At ${$(P1)} a firm sells ${Q1} units; at ${$(P2)} it sells ${Q2}. By how much does total revenue change when the price rises (new minus old)?`,type:'num',ans:P2*Q2-P1*Q1,tol:0.5,hint:`Compute P \u00d7 Q both times.`,why:`${P2}\u00d7${Q2} \u2212 ${P1}\u00d7${Q1} = ${P2*Q2-P1*Q1}.`};}
  const t=S.pick(['inc','cross','pct']);
  if(t==='inc'){const Y1=S.pick([40,50]),Y2=Y1+S.pick([5,10]),Q1=S.int(80,120),Q2=Q1+S.int(5,25);const e=((Q2-Q1)/((Q1+Q2)/2))/((Y2-Y1)/((Y1+Y2)/2));return {q:`Income rises from $${Y1}k to $${Y2}k and quantity demanded of a good rises from ${Q1} to ${Q2}. Compute the income elasticity (midpoint, 2 decimals).`,type:'num',ans:e,tol:0.02,hint:`%\u0394Q \u00f7 %\u0394Income, each over its average`,why:`E = ${f(e,2)}.`};}
  if(t==='cross'){const P1=S.pick([10,20]),P2=P1+S.pick([2,4]),Q1=S.int(80,120),Q2=Q1+S.int(5,20);const e=((Q2-Q1)/((Q1+Q2)/2))/((P2-P1)/((P1+P2)/2));return {q:`The price of good B rises from $${P1} to $${P2}, and the quantity demanded of good A rises from ${Q1} to ${Q2}. Compute the cross-price elasticity (midpoint, 2 decimals). Are they substitutes?`,type:'num',ans:e,tol:0.02,hint:`Same midpoint formula, with good B\u2019s price.`,why:`E = ${f(e,2)} > 0, so substitutes.`};}
  const E=S.pick([0.5,1.5,2,3]),pc=S.pick([5,10]);return {q:`Price elasticity of demand is ${E} (in absolute value). By about what percent does quantity demanded fall if the price rises ${pc}%?`,type:'num',ans:E*pc,tol:0.2,unit:'%',hint:`%\u0394Q = E \u00d7 %\u0394P`,why:`${E} \u00d7 ${pc} = ${f(E*pc,1)}%.`};
}});

W({id:5,emoji:'🛍️',ch:'Book chapter 6',lab:'consumer',
name:{e:'Allowance Choices',a:'Consumer Choice',s:'Utility and the Budget Line'},
tag:{e:'How do we spend money to be happiest?',a:'Marginal utility, MU per dollar and the best bundle.',s:'Utility maximisation, income and substitution effects, behavioral economics.'},
cards:{
e:[['Happiness from stuff',`The first slice of pizza makes you very happy. The fifth is just okay. Each extra thing gives <b>less extra happiness</b> than the one before. Economists call happiness <b>utility</b>.`,'😋'],
['Best spending',`To get the most happiness for your money, spend your <b>last dollar</b> where it gives the <b>most extra happiness</b>. If a snack would make you happier than another toy, buy the snack.`,'💡'],
['Real people',`Real people are not perfect calculators. We follow habits, hate losing things more than we enjoy gaining things, and sometimes spend too fast. <b>Behavioral economics</b> studies this.`,'🧠']],
a:[['Utility',`<b>Total utility</b> is the satisfaction from consuming. <b>Marginal utility (MU)</b> is the extra satisfaction from one more unit, and it falls as you consume more (<b>diminishing marginal utility</b>).`,'📉'],
['The best bundle',`Spend where MU per dollar is highest. At the best bundle: <b>MU\u2093 / P\u2093 = MU\u1d67 / P\u1d67</b> and the budget is used up. If MU\u2093/P\u2093 is bigger than MU\u1d67/P\u1d67, buy more X and less Y.`,'⚖️'],
['Changes in price and income',`A fall in the price of X raises purchasing power (<b>income effect</b>) and makes X cheaper relative to Y (<b>substitution effect</b>); both usually raise the quantity of X. <b>Behavioral economics</b> adds loss aversion and framing.`,'🔄']],
s:[['Utility maximisation',`Maximise total utility subject to P\u2093X + P\u1d67Y = I. The first-order condition MU\u2093/P\u2093 = MU\u1d67/P\u1d67 says the last dollar must be equally productive everywhere. With discrete units, find the affordable bundle with the highest total utility.`,'🎯'],
['Income and substitution effects',`A price fall rotates the budget line outward along the axis of the cheaper good. The substitution effect always moves consumption toward the cheaper good; the income effect depends on whether the good is normal or inferior (Giffen goods are theoretical extreme cases).`,'🔬'],
['Beyond rationality',`Behavioral findings: <b>loss aversion</b>, <b>anchoring</b>, <b>present bias</b>, and <b>status quo bias</b> challenge strict maximisation. Models remain useful benchmarks, with nudges and framing used to improve choices.`,'🧭']]},
qs:{
e:[mc(`Diminishing marginal utility means\u2026`,[`each extra unit adds less happiness than the last`,`each extra unit adds more`,`you get tired of money`,`prices fall`],0,`The first bite is the best.`),
mc(`To be happiest, you should spend your last dollar on\u2026`,[`whatever gives the most extra happiness`,`the most expensive thing`,`the thing you already have most of`,`nothing`],0,`That is how to get the most out of a budget.`),
mc(`Behavioral economics notices that real people\u2026`,[`do not always choose perfectly`,`never choose`,`always choose perfectly`,`ignore prices`],0,`They use habits and rules of thumb.`),
mc(`The 5th slice of pizza makes you\u2026`,[`less extra happy than the 1st`,`happier than the 1st`,`exactly as happy as the 1st`,`very hungry`],0,`Utility from extra units shrinks.`)],
a:[mc(`Marginal utility is\u2026`,[`the extra satisfaction from one more unit`,`total satisfaction`,`the price`,`the budget`],0,`It is a change, not a total.`),
mc(`At the utility-maximising bundle\u2026`,[`MU/P is equal for all goods`,`MU is equal for all goods`,`P is equal for all goods`,`quantities are equal`],0,`The last dollar is equally useful everywhere.`),
mc(`If MUx/Px > MUy/Py, you should\u2026`,[`buy more X and less Y`,`buy more Y and less X`,`buy nothing`,`do nothing`],0,`X gives more satisfaction per dollar.`),
mc(`The substitution effect of a fall in the price of X is to\u2026`,[`buy more X because it is relatively cheaper`,`buy less X`,`buy only Y`,`stop buying X`],0,`Consumers switch toward the relatively cheaper good.`)],
s:[mc(`Loss aversion means people\u2026`,[`feel losses more strongly than equal gains`,`like losses`,`ignore gains`,`always take risks`],0,`A key behavioral finding.`),
mc(`The income effect of a price fall for a normal good\u2026`,[`raises consumption of the good`,`lowers consumption`,`has no effect`,`is always zero`],0,`Real purchasing power rises.`),
mc(`With discrete units, the utility-maximising affordable bundle is found by\u2026`,[`comparing total utility across all affordable bundles`,`choosing equal quantities`,`buying only the cheaper good`,`maximising MU`],0,`Equating MU/P is the guide.`),
mc(`A \u201cnudge\u201d is\u2026`,[`a change in framing or defaults that helps people choose better`,`a tax`,`a ban`,`a subsidy`],0,`It keeps options open but shapes choices.`)]},

  if(lv==='a'){const mux=S.pick([12,16,20,24]),px=S.pick([2,4]),muy=S.pick([6,9,12]),py=S.pick([1,2,3]);if(Math.random()<0.5)return {q:`MU of X = ${mux} and Px = ${$(px)}. What is MU per dollar for X?`,type:'num',ans:mux/px,tol:0.01,hint:`MU \u00f7 P`,why:`${mux} \u00f7 ${px} = ${mux/px}.`};
    return {q:`MU of X = ${mux}, Px = ${$(px)}; MU of Y = ${muy}, Py = ${$(py)}. Compute MU/P for Y, then say which good gives more satisfaction per dollar: enter the MU/P of Y.`,type:'num',ans:muy/py,tol:0.01,hint:`MU \u00f7 P for Y`,why:`${muy} \u00f7 ${py} = ${f(muy/py,2)} versus X: ${f(mux/px,2)}.`};}
  const px=S.pick([2,4,5]),py=S.pick([1,2,3]),mux=S.pick([20,24,30]);const t=Math.random();
  if(t<0.5)return {q:`At the best bundle MU\u2093/P\u2093 = MU\u1d67/P\u1d67. If MU\u2093 = ${mux}, P\u2093 = ${$(px)} and P\u1d67 = ${$(py)}, what must MU\u1d67 be?`,type:'num',ans:mux/px*py,tol:0.01,hint:`MU\u1d67 = (MU\u2093/P\u2093) \u00d7 P\u1d67`,why:`${mux}/${px} \u00d7 ${py} = ${f(mux/px*py,2)}.`};

W({id:6,emoji:'🏭',ch:'Book chapter 7',lab:'costs',
name:{e:'Lemonade Costs',a:'Production and Costs',s:'Short-Run and Long-Run Cost'},
tag:{e:'What does it cost to make more?',a:'Fixed and variable costs, average and marginal cost, profit.',s:'Diminishing returns, cost minimisation, accounting versus economic profit and scale.'},
cards:{
e:[['Costs that stay and costs that grow',`Your lemonade stand\u2019s <b>rent</b> stays the same however many cups you sell: that is a <b>fixed cost</b>. The lemons grow with every cup: that is a <b>variable cost</b>. Together they are your <b>total cost</b>.`,'🍋'],
['Cost per cup',`Divide the total cost by the number of cups to get the <b>average cost</b>. The more cups you make, the more the rent is shared, so each cup can cost less.`,'🥤'],
['Profit',`<b>Profit</b> is the money you earn minus your costs. Economists also count what you give up, like your own time, as a cost. That is called an <b>implicit cost</b>.`,'💵']],
a:[['Cost concepts',`<b>Fixed cost (FC)</b> does not change with output; <b>variable cost (VC)</b> does. TC = FC + VC. <b>Average total cost</b> ATC = TC \u00f7 q. <b>Marginal cost</b> MC = \u0394TC \u00f7 \u0394q, the extra cost of one more unit.`,'📊'],
['Shapes of the curves',`MC rises because of <b>diminishing marginal productivity</b>: adding more workers to fixed equipment yields smaller gains. ATC is U-shaped: falling as fixed cost is spread, then rising. MC crosses ATC at its minimum.`,'📈'],
['Profit and opportunity cost',`<b>Accounting profit</b> = revenue \u2212 explicit costs. <b>Economic profit</b> = accounting profit \u2212 implicit costs (the value of owner time and capital). In the long run firms can change all inputs; <b>economies of scale</b> mean average cost falls as the firm grows.`,'⚖️']],
s:[['Production in the short run',`With a fixed input, output rises with more of the variable input but at a decreasing rate: marginal product falls, so marginal cost rises. If VC = c\u2081q + c\u2082q\u00b2 then MC = c\u2081 + 2c\u2082q, AVC = c\u2081 + c\u2082q, ATC = FC/q + c\u2081 + c\u2082q.`,'⚙️'],
['Minimum efficient scale',`ATC is minimised where MC = ATC. For the quadratic case this occurs at q* = \u221a(FC/c\u2082). The relationship MC < ATC pulls the average down, MC > ATC pulls it up. Sunk costs are irrelevant to forward-looking decisions.`,'🔬'],
['Long run',`In the long run all inputs vary; the long-run average cost curve is the lower envelope of short-run curves. <b>Economies of scale</b>, <b>constant returns</b> and <b>diseconomies of scale</b> describe how LRAC changes with size. Economic profit includes the normal return to owners.`,'🏗️']]},
qs:{
e:[mc(`The rent for your stand, paid however many cups you sell, is a\u2026`,[`fixed cost`,`variable cost`,`profit`,`price`],0,`It does not change with output.`),
mc(`Average cost per cup is\u2026`,[`total cost \u00f7 number of cups`,`price \u00d7 cups`,`rent only`,`lemons only`],0,`Total cost divided by output.`),
mc(`Profit is\u2026`,[`money earned minus costs`,`money earned plus costs`,`costs only`,`the price`],0,`Revenue minus costs.`),
mc(`Your own time that you could have spent elsewhere is\u2026`,[`an implicit cost`,`free`,`a fixed price`,`revenue`],0,`Economists count what you give up.`)],
a:[mc(`Marginal cost is\u2026`,[`the extra cost of producing one more unit`,`total cost \u00f7 output`,`fixed cost`,`price`],0,`MC = \u0394TC/\u0394q.`),
mc(`Marginal cost rises mainly because of\u2026`,[`diminishing marginal productivity`,`falling prices`,`taxes`,`fixed cost`],0,`Extra workers add less and less output.`),
mc(`Economic profit differs from accounting profit because it also subtracts\u2026`,[`implicit costs`,`taxes`,`revenue`,`variable costs twice`],0,`The owner\u2019s forgone alternatives count.`),
mc(`MC crosses ATC at\u2026`,[`the minimum of ATC`,`the maximum of ATC`,`zero output`,`the price`],0,`Below ATC the average falls; above it, rises.`)],
s:[mc(`For VC = c\u2081q + c\u2082q\u00b2, MC equals\u2026`,[`c\u2081 + 2c\u2082q`,`c\u2081 + c\u2082q`,`c\u2082q`,`FC/q`],0,`The derivative of VC.`),
mc(`ATC is lowest where\u2026`,[`MC = ATC`,`MC = 0`,`AVC = FC`,`ATC = AVC`],0,`The marginal curve cuts the average curve at its minimum.`),
mc(`Economies of scale means\u2026`,[`long-run average cost falls as output rises`,`costs rise with size`,`fixed cost disappears`,`price rises`],0,`Larger firms can have lower unit costs.`),
mc(`A sunk cost should be\u2026`,[`ignored in forward-looking decisions`,`counted as marginal cost`,`doubled`,`always avoided`],0,`It cannot be recovered whatever you choose now.`)]},
gen:function(lv){
  if(lv==='e'){const fc=S.pick([10,20,30,40]),c=S.pick([0.5,1,2]),n=S.pick([10,20,25,40]);if(Math.random()<0.5)return {q:`Stand rent is <b>${$(fc)}</b> and lemons cost <b>${$(c)}</b> per cup. What is the <b>total cost</b> of making <b>${n}</b> cups?`,type:'num',ans:fc+c*n,tol:0.01,hint:`rent + cost per cup \u00d7 cups`,why:`${fc} + ${c} \u00d7 ${n} = ${fc+c*n}.`};
    return {q:`Rent is ${$(fc)} and each cup\u2019s lemons cost ${$(c)}. If you make ${n} cups, what is the <b>average cost</b> per cup?`,type:'num',ans:(fc+c*n)/n,tol:0.01,hint:`total cost \u00f7 cups`,why:`(${fc} + ${c}\u00d7${n}) \u00f7 ${n} = ${f((fc+c*n)/n,2)}.`};}
  if(lv==='a'){const t=S.pick(['mc','atc','prof']);const q1=S.pick([10,20]),q2=q1+S.pick([5,10]),tc1=S.int(100,200),tc2=tc1+S.int(20,80);
    if(t==='mc')return {q:`Total cost is ${$(tc1)} at output ${q1} and ${$(tc2)} at output ${q2}. What is the marginal cost per unit between them?`,type:'num',ans:(tc2-tc1)/(q2-q1),tol:0.01,hint:`\u0394TC \u00f7 \u0394q`,why:`(${tc2} \u2212 ${tc1}) \u00f7 ${q2-q1} = ${f((tc2-tc1)/(q2-q1),2)}.`};
    if(t==='atc')return {q:`Total cost of producing ${q2} units is ${$(tc2)}. What is the average total cost?`,type:'num',ans:tc2/q2,tol:0.01,hint:`TC \u00f7 q`,why:`${tc2} \u00f7 ${q2} = ${f(tc2/q2,2)}.`};
    const rev=S.int(200,400),ex=S.int(120,180),im=S.int(20,80);return {q:`A firm has revenue ${$(rev)}, explicit costs ${$(ex)} and implicit costs ${$(im)}. What is its <b>economic profit</b>?`,type:'num',ans:rev-ex-im,tol:0.01,hint:`revenue \u2212 explicit \u2212 implicit`,why:`${rev} \u2212 ${ex} \u2212 ${im} = ${rev-ex-im}.`};}
  const t=S.pick(['mc','min','atc']);const F=S.pick([36,64,100,144]),c1=S.pick([2,4,5]),c2=S.pick([1,0.5,0.25]);
  if(t==='mc'){const q=S.int(4,20);return {q:`VC = ${c1}q + ${c2}q\u00b2. Compute marginal cost MC = c\u2081 + 2c\u2082q at q = ${q}.`,type:'num',ans:c1+2*c2*q,tol:0.01,hint:`${c1} + 2 \u00d7 ${c2} \u00d7 ${q}`,why:`${c1} + ${2*c2*q} = ${c1+2*c2*q}.`};}
  if(t==='min')return {q:`FC = ${F} and VC = ${c1}q + ${c2}q\u00b2. At what output q* is average total cost lowest? (q* = \u221a(FC/c\u2082), 1 decimal)`,type:'num',ans:Math.sqrt(F/c2),tol:0.1,hint:`\u221a(${F} \u00f7 ${c2})`,why:`\u221a(${F}/${c2}) = ${f(Math.sqrt(F/c2),2)}.`};
  const q=S.int(4,16);return {q:`FC = ${F}, VC = ${c1}q + ${c2}q\u00b2. Compute ATC = FC/q + c\u2081 + c\u2082q at q = ${q} (2 decimals).`,type:'num',ans:F/q+c1+c2*q,tol:0.02,hint:`FC/q + c\u2081 + c\u2082q`,why:`${F}/${q} + ${c1} + ${c2}\u00d7${q} = ${f(F/q+c1+c2*q,2)}.`};
}});
})();

W({id:7,emoji:'🏪',ch:'Book chapters 8\u201311',lab:'firm',
name:{e:'Many Stands, One Stand',a:'Market Structures',s:'Competition, Monopoly and Antitrust'},
tag:{e:'Lots of sellers or just one? It changes the price.',a:'Perfect competition, monopoly, oligopoly and the HHI.',s:'P = MC, MR = MC, deadweight loss, collusion and merger policy.'},
cards:{
e:[['Many sellers',`When lots of stands sell the same lemonade, no single stand can charge much. If it asks too much, buyers walk next door. Competition keeps prices <b>low</b> and pushes sellers to be <b>efficient</b>.`,'🏪'],
['Only one seller',`A <b>monopoly</b> is the only seller. With no rivals it can <b>raise the price</b> and sell <b>less</b>. Monopolies can form when others can\u2019t easily enter (a patent, a special resource, or very big costs).`,'👑'],
['A few big sellers',`When just a few big firms share a market (like phone companies) it is called an <b>oligopoly</b>. They might compete hard or secretly agree to keep prices high. Governments make rules (<b>antitrust</b>) to stop unfair behaviour.`,'🤝']],
a:[['Perfect competition',`Many small firms sell identical goods and are <b>price takers</b>. Each firm produces where <b>P = MC</b>. If P is below average variable cost the firm should shut down in the short run. Free entry and exit drive long-run economic profit to zero.`,'🧮'],
['Monopoly',`A monopolist faces the market demand curve, so marginal revenue is below price (MR < P). It maximises profit where <b>MR = MC</b>, charging a higher price and producing less than competition, causing a <b>deadweight loss</b>. Barriers to entry protect it.`,'👑'],
['Between the two',`<b>Monopolistic competition</b>: many firms, differentiated products. <b>Oligopoly</b>: few firms, strategic behaviour (collusion, prisoner\u2019s dilemma). <b>HHI</b> = sum of squared market shares: 10,000 for a monopoly, near 0 for many tiny firms. Antitrust law reviews mergers and regulates natural monopolies.`,'📊']],
s:[['Price takers and profit',`In perfect competition P = MR = MC at the optimum; the short-run supply curve is the MC curve above AVC. Entry when economic profit > 0 and exit when < 0 drive price to the minimum of long-run ATC, achieving productive and allocative efficiency.`,'⚙️'],
['Monopoly pricing',`With linear demand P = a \u2212 bQ, MR = a \u2212 2bQ. For constant marginal cost c: Q\u1d50 = (a \u2212 c)/(2b), P\u1d50 = (a + c)/2, while competition gives Q\u1d9c = (a \u2212 c)/b. Deadweight loss = (a \u2212 c)\u00b2/(8b). Price discrimination can capture more surplus.`,'🔬'],
['Strategy and policy',`Oligopolists face a <b>prisoner\u2019s dilemma</b>: each gains by cheating on a cartel, so collusion is unstable without enforcement. Merger review uses concentration ratios and the HHI; natural monopolies are regulated by price caps or cost-plus rules, each with trade-offs.`,'🎲']]},
qs:{
e:[mc(`A monopoly is\u2026`,[`the only seller of a good`,`a type of game`,`a very big shop`,`a government`],0,`One seller means no direct competition.`),
mc(`Compared with competition, a monopoly usually charges a\u2026`,[`higher price and sells less`,`lower price and sells more`,`the same price`,`price of zero`],0,`It restricts output to raise price.`),
mc(`Competition among many stands usually leads to\u2026`,[`lower prices`,`higher prices`,`no lemonade`,`one winner`],0,`Sellers compete for buyers.`),
mc(`An oligopoly has\u2026`,[`a few big sellers`,`one seller`,`thousands of tiny sellers`,`no sellers`],0,`A few firms share most of the market.`)],
a:[mc(`A perfectly competitive firm maximises profit where\u2026`,[`P = MC`,`MR = P = 0`,`MC = 0`,`P = ATC always`],0,`It is a price taker, so MR = P.`),
mc(`A monopolist produces where\u2026`,[`MR = MC`,`P = MC`,`P = MR`,`MC = 0`],0,`Marginal revenue equals marginal cost.`),
mc(`HHI of a market with one firm having 100% share is\u2026`,[`10,000`,`100`,`1`,`0`],0,`100\u00b2.`),
mc(`In the short run a competitive firm should shut down if\u2026`,[`price is below average variable cost`,`price is above MC`,`profit is positive`,`price equals ATC`],0,`It cannot cover even its variable costs.`)],
s:[mc(`With P = a \u2212 bQ, marginal revenue is\u2026`,[`a \u2212 2bQ`,`a \u2212 bQ`,`a`,`bQ`],0,`MR has twice the slope.`),
mc(`In the long run, free entry in perfect competition drives economic profit to\u2026`,[`zero`,`infinity`,`a negative number`,`the monopoly level`],0,`Entry continues while profits exist.`),
mc(`Collusion among oligopolists is hard to maintain because\u2026`,[`each member gains by cheating`,`prices are fixed`,`it is legal`,`demand is infinite`],0,`The prisoner\u2019s dilemma logic.`),
mc(`Monopoly deadweight loss arises because\u2026`,[`output is below the efficient level`,`output is too high`,`prices are too low`,`MC is zero`],0,`Some beneficial trades are not made.`)]},
gen:function(lv){
  if(lv==='e'){const p=S.int(3,9),c=S.int(1,Math.min(5,p-1)),n=S.int(10,40);return {q:`You sell <b>${n}</b> cups at <b>${$(p)}</b> each and each cup costs you <b>${$(c)}</b> to make. What is your profit?`,type:'num',ans:(p-c)*n,tol:0.01,hint:`(price \u2212 cost per cup) \u00d7 cups`,why:`(${p} \u2212 ${c}) \u00d7 ${n} = ${(p-c)*n}.`};}
  if(lv==='a'){const t=S.pick(['hhi','q','mono']);
    if(t==='hhi'){const s=[S.int(20,40),S.int(15,30),S.int(10,20)];s.push(100-S.sum(s));return {q:`Four firms have market shares of ${s.join('%, ')}%. Compute the HHI (sum of squared shares).`,type:'num',ans:S.sum(s.map(x=>x*x)),tol:0.5,hint:`Square each share and add.`,why:`${s.map(x=>x+'\u00b2').join(' + ')} = ${S.sum(s.map(x=>x*x))}.`};}
    if(t==='q'){const m=S.pick([2,4,5]),P=m*S.int(3,9);return {q:`A competitive firm has marginal cost MC = ${m}q. The market price is ${$(P)}. How many units does it produce (P = MC)?`,type:'num',ans:P/m,tol:0.01,hint:`Set ${m}q = ${P}.`,why:`q = ${P} \u00f7 ${m} = ${P/m}.`};}
    const a=S.pick([40,60,80]),c=S.pick([10,20]);return {q:`Demand: P = ${a} \u2212 Q (b = 1). Marginal cost is constant at ${$(c)}. Marginal revenue is ${a} \u2212 2Q. How many units does a monopolist produce (MR = MC)?`,type:'num',ans:(a-c)/2,tol:0.01,hint:`${a} \u2212 2Q = ${c}`,why:`Q = (${a} \u2212 ${c}) \u00f7 2 = ${(a-c)/2}.`};}
  const t=S.pick(['p','q','dwl']);const a=S.pick([60,80,100,120]),b=S.pick([1,2,4]),c=S.pick([10,20,30]);
  if(t==='p')return {q:`Demand P = ${a} \u2212 ${b}Q, constant marginal cost ${c}. Find the monopoly <b>price</b> (P = (a + c)/2).`,type:'num',ans:(a+c)/2,tol:0.01,hint:`Set MR = a \u2212 2bQ equal to ${c}, find Q, plug into demand.`,why:`Q = ${(a-c)/(2*b)}; P = ${a} \u2212 ${b}\u00d7${(a-c)/(2*b)} = ${(a+c)/2}.`};
  if(t==='q')return {q:`Demand P = ${a} \u2212 ${b}Q, constant marginal cost ${c}. How much more output would a competitive market produce than a monopoly? (Q\u1d9c \u2212 Q\u1d50)`,type:'num',ans:(a-c)/b-(a-c)/(2*b),tol:0.02,hint:`Q\u1d9c = (a\u2212c)/b; Q\u1d50 = (a\u2212c)/(2b)`,why:`${f((a-c)/b,2)} \u2212 ${f((a-c)/(2*b),2)} = ${f((a-c)/(2*b),2)}.`};
  return {q:`Demand P = ${a} \u2212 ${b}Q, constant marginal cost ${c}. Compute the monopoly deadweight loss = (a \u2212 c)\u00b2 \u00f7 (8b).`,type:'num',ans:(a-c)**2/(8*b),tol:0.05,hint:`(${a} \u2212 ${c})\u00b2 \u00f7 (8 \u00d7 ${b})`,why:`${(a-c)**2} \u00f7 ${8*b} = ${f((a-c)**2/(8*b),2)}.`};
}});

W({id:8,emoji:'🌫️',ch:'Book chapters 12, 13, 16 and 18',lab:'external',
name:{e:'Fixing Shared Problems',a:'Externalities and Public Goods',s:'Market Failure and Policy'},
tag:{e:'Smoke, parks and who pays for what.',a:'Pollution, taxes, public goods, information problems and voting.',s:'Pigouvian taxes, cap-and-trade, free riding, adverse selection and public choice.'},
cards:{
e:[['Harm to others',`If a factory makes smoke, the neighbours suffer but the factory does not pay. That harm is a <b>negative externality</b>. The factory makes too much because it ignores the harm. A <b>tax</b> equal to the harm makes it count it.`,'🏭'],
['Things we share',`Some things, like a clean street lamp or a lighthouse, help everybody and can\u2019t be kept from anyone. These are <b>public goods</b>. Because people can use them without paying, they are hard to sell, so <b>governments</b> often provide them.`,'💡'],
['Sneaky information',`If one person knows more than the other (a used-car seller knows the car\u2019s problems), trades can go wrong. That is called <b>asymmetric information</b>.`,'🕵️']],
a:[['Externalities',`A <b>negative externality</b> is a cost imposed on others (pollution); a positive one is a benefit to others (education, vaccines). Markets overproduce goods with negative externalities. Fixes: <b>Pigouvian tax</b> (tax = external cost), <b>command-and-control</b> rules, and market tools like <b>cap-and-trade</b> permits.`,'🌍'],
['Public goods',`Public goods are <b>nonrival</b> (one person\u2019s use doesn\u2019t reduce another\u2019s) and <b>nonexcludable</b> (you can\u2019t keep non-payers out), causing the <b>free-rider problem</b>. Innovation has positive externalities, so governments grant <b>patents</b> or fund research.`,'🌉'],
['Information and voting',`<b>Adverse selection</b>: hidden characteristics (risky customers buy insurance). <b>Moral hazard</b>: hidden actions after a deal (careless behaviour when insured). <b>Public choice</b> studies how voters and special interests shape policy; concentrated benefits and spread-out costs can lead to poor policy.`,'🗳️']],
s:[['Pollution policy',`With external marginal cost e the efficient quantity is where marginal social benefit = marginal social cost. A Pigouvian tax t = e internalises the externality. With linear curves the deadweight loss without a tax is e\u00b2 / (2(b + d)). <b>Tradable permits</b> achieve a cap at lowest cost by letting low-cost abaters sell permits.`,'🌫️'],
['Public goods and free riding',`Because of nonexcludability each person has an incentive to free ride, so private provision is too low. The efficient level is where the <b>sum of individual marginal benefits</b> equals marginal cost. Taxes, or government provision, overcome the problem; patents and subsidies address innovation spillovers.`,'🔦'],
['Asymmetric information and public choice',`<b>Adverse selection</b> can unravel markets (Akerlof\u2019s lemons) and justifies mandates, screening or signalling. <b>Moral hazard</b> is controlled with deductibles and monitoring. In public choice, <b>rational ignorance</b> and <b>logrolling</b> help explain why concentrated groups often win over diffuse majorities.`,'🔬']]},
qs:{
e:[mc(`Smoke from a factory that harms neighbours is a\u2026`,[`negative externality`,`public good`,`wage`,`profit`],0,`A cost imposed on others.`),
mc(`A tax equal to the harm done makes the factory\u2026`,[`count the harm in its decisions`,`close at once`,`ignore the harm`,`raise pollution`],0,`It makes the polluter pay.`),
mc(`A lighthouse is a good example of a\u2026`,[`public good`,`private toy`,`tax`,`loan`],0,`Everyone benefits and none can be excluded.`),
mc(`When people use something without paying and let others pay, they are\u2026`,[`free riders`,`taxpayers`,`owners`,`workers`],0,`That is the free-rider problem.`)],
a:[mc(`A Pigouvian tax is set equal to\u2026`,[`the external cost per unit`,`the price`,`the profit`,`zero`],0,`That makes the producer face the full social cost.`),
mc(`A public good is\u2026`,[`nonrival and nonexcludable`,`rival and excludable`,`always free`,`sold in shops`],0,`Both properties matter.`),
mc(`Moral hazard is\u2026`,[`riskier behaviour after getting insurance`,`hiding a car\u2019s fault before sale`,`a tax`,`a loan`],0,`A hidden action problem.`),
mc(`Cap-and-trade works by\u2026`,[`limiting total pollution and letting firms trade permits`,`banning all factories`,`taxing profits`,`giving free money`],0,`A market-oriented tool.`)],
s:[mc(`Without a tax, deadweight loss from a negative externality arises because\u2026`,[`output exceeds the socially efficient quantity`,`output is too low`,`prices are too high`,`supply is zero`],0,`Social cost exceeds private cost at the market quantity.`),
mc(`The efficient quantity of a public good is where\u2026`,[`the sum of marginal benefits equals marginal cost`,`one person\u2019s benefit equals cost`,`price is zero`,`MC = 0`],0,`Vertical summation of demands.`),

  if(lv==='a'){const t=S.pick(['soc','opt','cap']);const a=S.pick([60,80,100]),b=1,c=S.pick([10,20]),d=1,e=S.pick([10,20]);

    const nf=S.pick([4,5,10]),pm=S.pick([20,50,100]);return {q:`A cap-and-trade scheme issues ${pm} permits to each of ${nf} firms. Each permit allows one unit of pollution. What is the total pollution allowed?`,type:'num',ans:nf*pm,tol:0.01,hint:`firms \u00d7 permits each`,why:`${nf} \u00d7 ${pm} = ${nf*pm}.`};}
  const t=S.pick(['dwl','tax','mb']);const a=S.pick([60,80,100]),c=S.pick([10,20]),e=S.pick([8,10,12,16,20]);

  if(t==='tax'){const T=e,Qt=(a-c-T)/2;return {q:`With the Pigouvian tax t = ${T} on each unit (demand P = ${a} \u2212 Q, supply P = ${c} + Q), how much tax revenue does the government collect? (t \u00d7 Q after the tax)`,type:'num',ans:T*Qt,tol:0.02,hint:`Q after tax = (${a} \u2212 ${c} \u2212 ${T}) \u00f7 2`,why:`Q = ${Qt}; revenue = ${T} \u00d7 ${Qt} = ${T*Qt}.`};}
