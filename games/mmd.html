<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Demography Lab: Ghana (university edition)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,500;6..72,600;6..72,700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#F2F4F6; --panel:#FFFFFF; --panel2:#F7F9FA; --ink:#0F1B26; --muted:#556574; --line:#D3DBE2;
  --green:#006B3F; --green-ink:#FFFFFF; --gold:#F5B800; --gold-soft:#FFF3C6; --red:#CE1126; --blue:#1F5FAE;
  --good:#0E7A45; --bad:#B4162A; --code:#0F1B26; --code-ink:#E6EDF3;
  --c1:#006B3F; --c2:#E0A800; --c3:#CE1126; --c4:#1F5FAE; --c5:#7A4FB5; --c6:#2A9DA8;
  --shadow:0 1px 2px rgba(15,27,38,.06),0 6px 20px rgba(15,27,38,.06);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0A1218; --panel:#111C26; --panel2:#0E1822; --ink:#E8EEF3; --muted:#9FB0BE; --line:#223342;
    --green:#2FBF7A; --green-ink:#06210F; --gold:#F5C518; --gold-soft:#2B2508; --red:#FF6B7A; --blue:#6FA8F0;
    --good:#4ADE80; --bad:#FF7A8A; --code:#070D12; --code-ink:#DDE6EE;
    --c1:#2FBF7A; --c2:#F5C518; --c3:#FF6B7A; --c4:#6FA8F0; --c5:#B38CF0; --c6:#4CC9D6;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#0A1218; --panel:#111C26; --panel2:#0E1822; --ink:#E8EEF3; --muted:#9FB0BE; --line:#223342;
  --green:#2FBF7A; --green-ink:#06210F; --gold:#F5C518; --gold-soft:#2B2508; --red:#FF6B7A; --blue:#6FA8F0;
  --good:#4ADE80; --bad:#FF7A8A; --code:#070D12; --code-ink:#DDE6EE;
  --c1:#2FBF7A; --c2:#F5C518; --c3:#FF6B7A; --c4:#6FA8F0; --c5:#B38CF0; --c6:#4CC9D6;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35);
}
html{height:100%;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 72px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:16px;line-height:1.6}
h1,h2,h3,h4{font-family:'Newsreader',Georgia,'Times New Roman',serif;font-weight:600;line-height:1.2;margin:0 0 .5em;letter-spacing:-.01em}
h1{font-size:clamp(1.9rem,4.5vw,2.8rem)} h2{font-size:clamp(1.4rem,3vw,1.9rem)} h3{font-size:1.25rem} h4{font-size:1.05rem;font-family:'IBM Plex Sans',sans-serif;font-weight:600;letter-spacing:0}
p{margin:.5em 0 .9em} a{color:var(--blue)}
code,pre,.mono{font-family:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:6px}
button{font:inherit;color:inherit}
.flag{height:5px;background:linear-gradient(90deg,var(--red) 0 33.3%,var(--gold) 33.3% 66.6%,var(--green) 66.6%)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--panel);border-bottom:1px solid var(--line)}
.top .in{display:flex;align-items:center;gap:14px;padding:10px 18px;max-width:1280px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;cursor:pointer;padding:0;text-align:left}
.brand .star{width:30px;height:30px;border-radius:8px;background:var(--ink);color:var(--gold);display:grid;place-items:center;font-size:18px;line-height:1}
.brand b{font-family:'Newsreader',serif;font-size:1.2rem;font-weight:700}
.brand small{display:block;color:var(--muted);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;margin-top:-2px}
.top .sp{flex:1}
.prog{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--muted)}
.bar{width:120px;height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--green);width:0;transition:width .4s}
.iconbtn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:.85rem}
.iconbtn:hover{background:var(--panel2)}
.shell{display:grid;grid-template-columns:300px minmax(0,1fr);gap:0;max-width:1280px;margin:0 auto}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 56px);align-self:start;height:calc(100vh - 62px);overflow:auto;padding:18px 14px 40px 18px;border-right:1px solid var(--line)}
.side h5{margin:18px 0 6px;font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.side button.nav{display:flex;gap:8px;align-items:flex-start;width:100%;text-align:left;border:0;background:none;cursor:pointer;padding:7px 8px;border-radius:8px;font-size:.92rem;color:var(--ink)}
.side button.nav:hover{background:var(--panel2)}
.side button.nav.on{background:var(--gold-soft);box-shadow:inset 3px 0 0 var(--gold)}
.side .n{font-family:'IBM Plex Mono',monospace;font-size:.75rem;color:var(--muted);min-width:22px;padding-top:2px}
.side .ck{margin-left:auto;color:var(--good);font-weight:700}
.main{padding:26px 28px 80px;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:22px}
.card+.card{margin-top:18px}
.eyebrow{font-size:.75rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:6px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:14px 0 20px;flex-wrap:wrap}
.tab{border:0;background:none;padding:9px 16px;cursor:pointer;font-weight:500;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink);border-bottom-color:var(--gold);font-weight:600}
.brief p,.brief li{max-width:78ch}
.brief ul{padding-left:1.2em}
.formula{font-family:'IBM Plex Mono',monospace;background:var(--panel2);border:1px solid var(--line);border-left:4px solid var(--green);border-radius:8px;padding:10px 14px;margin:10px 0;overflow-x:auto;font-size:.92rem;white-space:pre-wrap}
.callout{border-radius:10px;padding:12px 16px;margin:14px 0;border:1px solid var(--line);background:var(--panel2)}
.callout.warn{border-left:4px solid var(--red)} .callout.info{border-left:4px solid var(--blue)} .callout.key{border-left:4px solid var(--gold);background:var(--gold-soft)}
.callout b.t{display:block;font-size:.78rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0}
.kpi{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.kpi b{display:block;font-family:'IBM Plex Mono',monospace;font-size:1.3rem;font-weight:600;line-height:1.2}
.kpi span{font-size:.78rem;color:var(--muted)}
.ctrls{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:6px 22px;margin:8px 0 14px}
.ctrl{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center}
.ctrl label{font-size:.88rem;font-weight:500}
.ctrl output{font-family:'IBM Plex Mono',monospace;font-size:.88rem;text-align:right;min-width:3.4em}
.ctrl input[type=range]{grid-column:1/-1;width:100%;accent-color:var(--green)}
.ctrl select,.ctrl input[type=number],input.num,select.sel,textarea.ta{font:inherit;padding:6px 9px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);max-width:100%}
.ctrl input[type=number]{width:9.5em;text-align:right;font-family:'IBM Plex Mono',monospace}
textarea.ta{width:100%;min-height:260px;font-family:'IBM Plex Mono',monospace;font-size:.88rem;line-height:1.5}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0;align-items:center}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 14px;cursor:pointer;font-weight:500;font-size:.92rem}
.btn:hover{background:var(--panel2)}
.btn.pri{background:var(--green);color:var(--green-ink);border-color:var(--green)}
.btn.pri:hover{filter:brightness(1.1)}
.btn.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.sm{padding:3px 10px;font-size:.82rem}
.chart{width:100%;height:auto;display:block;background:var(--panel);border:1px solid var(--line);border-radius:10px}
.chart text{fill:var(--ink);font-family:'IBM Plex Sans',sans-serif;font-size:11px}
.chart .mut{fill:var(--muted)}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .ax{stroke:var(--muted);stroke-width:1}
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.tbl{width:100%;border-collapse:collapse;font-size:.88rem;margin:10px 0}
.tbl th,.tbl td{padding:5px 9px;border-bottom:1px solid var(--line);text-align:right}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl th{font-weight:600;background:var(--panel2);position:sticky;top:0}
.tbl td.num,.tbl .mono{font-family:'IBM Plex Mono',monospace}
.tblwrap{overflow:auto;max-height:420px;border:1px solid var(--line);border-radius:8px}
.tbl tr.hl td{background:var(--gold-soft)}
.tbl input{width:6.5em;font-family:'IBM Plex Mono',monospace;font-size:.85rem;padding:2px 5px;border:1px solid var(--line);border-radius:5px;background:var(--panel);color:var(--ink);text-align:right}
.code{position:relative;background:var(--code);color:var(--code-ink);border-radius:10px;margin:12px 0;overflow:hidden}
.code pre{margin:0;padding:14px 16px;overflow:auto;font-size:.84rem;line-height:1.55}
.code button{position:absolute;top:8px;right:8px;background:#ffffff1a;color:var(--code-ink);border:1px solid #ffffff33;border-radius:6px;padding:2px 9px;font-size:.75rem;cursor:pointer}
.q{border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:12px 0;background:var(--panel)}
.q.ok{border-left:5px solid var(--good)} .q.no{border-left:5px solid var(--bad)}
.q .qn{font-family:'IBM Plex Mono',monospace;font-size:.78rem;color:var(--muted)}
.q .fb{margin-top:8px;font-size:.92rem}
.q .fb.good{color:var(--good)} .q .fb.bad{color:var(--bad)}
.q .opts{display:grid;gap:6px;margin:8px 0}
.q .opt{display:flex;gap:8px;align-items:flex-start;padding:7px 10px;border:1px solid var(--line);border-radius:8px;cursor:pointer;background:var(--panel2)}
.q .opt input{margin-top:5px}
.sol{margin-top:8px;font-size:.9rem;background:var(--panel2);border-radius:8px;padding:10px 12px;border:1px dashed var(--line)}
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:26px;align-items:center}
.hero .stat{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.units{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;margin-top:16px}
.unit{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--panel)}
.unit h4{margin-bottom:4px} .unit ol{margin:6px 0 0;padding-left:1.3em;font-size:.9rem;color:var(--muted)}
.pill{display:inline-block;padding:1px 9px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);font-size:.75rem;color:var(--muted);margin-right:4px}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:.8rem;margin:6px 0;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
details.d{border:1px solid var(--line);border-radius:10px;margin:10px 0;background:var(--panel)}
details.d summary{cursor:pointer;padding:10px 14px;font-weight:600}
details.d>div{padding:0 14px 12px}
.menu{display:none}
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{position:fixed;inset:calc(env(safe-area-inset-top,0px) + 56px) 0 0 0;z-index:25;background:var(--panel);height:auto;display:none;border-right:0}
  .side.open{display:block}
  .menu{display:inline-block}
  .main{padding:18px 14px 70px}
  .hero,.twocol{grid-template-columns:1fr}
  .bar{width:70px}
  .brand small{display:none}
}
@media print{.top,.side,.tabs,.btn,.noprint{display:none!important}.shell{display:block}.card{box-shadow:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<script>
(function(){
'use strict';
const A=window.A={mods:[],units:[],labs:{},D:{},calc:{}};
const NS='http://www.w3.org/2000/svg';
const el=A.el=function(tag,attrs,...kids){
  const e=document.createElement(tag);

  for(const c of kids.flat(2)){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(String(c)));}
  return e;
};
const sv=A.sv=function(tag,attrs,...kids){
  const e=document.createElementNS(NS,tag);
  for(const k in attrs||{})e.setAttribute(k,attrs[k]);
  for(const c of kids.flat(2)){if(c==null)continue;e.append(c.nodeType?c:document.createTextNode(String(c)));}
  return e;
};
const fmt=A.fmt=(n,d)=>{d=d==null?0:d;if(n==null||isNaN(n))return '–';return Number(n).toLocaleString('en-US',{maximumFractionDigits:d,minimumFractionDigits:d});};
A.sum=a=>a.reduce((s,x)=>s+x,0);
A.abbr=n=>{const a=Math.abs(n);return a>=1e6?(n/1e6).toFixed(a>=1e7?0:1).replace(/\.0$/,'')+'M':a>=1e3?(n/1e3).toFixed(a>=1e4?0:1).replace(/\.0$/,'')+'k':String(Math.round(n*100)/100);};
A.cp=async function(t,btn){try{await navigator.clipboard.writeText(t);if(btn){const o=btn.textContent;btn.textContent='Copied';setTimeout(()=>btn.textContent=o,1200);}}catch(e){if(btn){btn.textContent='Select + copy';}}};

/* ---------- UI atoms ---------- */
A.slider=function(parent,o){
  const out=el('output',null,'');const id='s'+Math.random().toString(36).slice(2,8);
  const inp=el('input',{type:'range',id,min:o.min,max:o.max,step:o.step||1,value:o.value,'aria-label':o.label});
  const show=()=>{out.textContent=(o.pre||'')+fmt(inp.value,o.dec||0)+(o.suf||'');};
  inp.addEventListener('input',()=>{show();o.on&&o.on(+inp.value);});show();
  const w=el('div',{class:'ctrl'},el('label',{for:id},o.label),out,inp);parent.append(w);
  return {get:()=>+inp.value,set:v=>{inp.value=v;show();},el:w};
};
A.num=function(parent,o){
  const id='n'+Math.random().toString(36).slice(2,8);
  const inp=el('input',{type:'number',id,value:o.value,step:o.step||'any',min:o.min,max:o.max,'aria-label':o.label});
  inp.addEventListener('input',()=>o.on&&o.on(+inp.value));
  parent.append(el('div',{class:'ctrl'},el('label',{for:id},o.label),inp));
  return {get:()=>+inp.value,set:v=>{inp.value=v;}};
};
A.select=function(parent,o){
  const id='z'+Math.random().toString(36).slice(2,8);
  const s=el('select',{id,class:'sel','aria-label':o.label},o.options.map(x=>el('option',{value:x[0]},x[1])));
  s.value=o.value!=null?o.value:o.options[0][0];
  s.addEventListener('change',()=>o.on&&o.on(s.value));
  parent.append(el('div',{class:'ctrl'},el('label',{for:id},o.label),s));
  return {get:()=>s.value,set:v=>{s.value=v;},el:s};
};
A.toggle=function(parent,items,cur,on){
  const w=el('div',{class:'row',role:'group'});const bs=[];
  items.forEach(it=>{const b=el('button',{class:'btn'+(it[0]===cur?' on':''),onclick:()=>{bs.forEach(x=>x.classList.remove('on'));b.classList.add('on');on(it[0]);}},it[1]);bs.push(b);w.append(b);});
  parent.append(w);return w;
};
A.kpis=function(items){return el('div',{class:'kpis'},items.map(i=>el('div',{class:'kpi'},el('b',null,i[0]),el('span',null,i[1]))));};
A.callout=(kind,title,html)=>el('div',{class:'callout '+kind},title?el('b',{class:'t'},title):null,el('div',{html}));
A.code=function(text){const b=el('button',{onclick:()=>A.cp(text,b)},'Copy');return el('div',{class:'code'},b,el('pre',null,el('code',null,text)));};
A.table=function(head,rows,o){
  o=o||{};
  return el('div',{class:'tblwrap',style:o.h?('max-height:'+o.h+'px'):''},el('table',{class:'tbl'},
    el('thead',null,el('tr',null,head.map(h=>el('th',null,h)))),
    el('tbody',null,rows.map(r=>el('tr',{class:r.hl?'hl':''},(r.c||r).map((c,i)=>el('td',{class:(typeof c==='number'||(typeof c==='string'&&/^[-+0-9.,%\s]+$/.test(c)))?'num':''},c))))))); 
};
A.legend=items=>el('div',{class:'legend'},items.map(i=>el('span',null,el('i',{style:'background:'+i[1]}),i[0])));

/* ---------- chart helpers ---------- */
function niceTicks(lo,hi,n){
  n=n||5;if(hi===lo){hi=lo+1;}
  const span=hi-lo,raw=span/n,mag=Math.pow(10,Math.floor(Math.log10(raw))),r=raw/mag;
  const step=(r<1.5?1:r<3?2:r<7?5:10)*mag;
  const t=[];for(let v=Math.ceil(lo/step-1e-9)*step;v<=hi+1e-9;v+=step)t.push(Math.round(v/step)*step);
  return t;

A.niceTicks=niceTicks;
function mkSvg(W,H,label){return sv('svg',{viewBox:'0 0 '+W+' '+H,class:'chart',role:'img','aria-label':label||'Chart'});}
A.ch={};
A.ch.line=function(series,o){
  o=o||{};const W=o.W||680,H=o.H||320,pad={l:o.padl||58,r:18,t:o.legend===false?14:34,b:o.xl?46:32};
  const svg=mkSvg(W,H,o.label||'Line chart');
  let xs=[],ys=[];series.forEach(s=>s.pts.forEach(p=>{xs.push(p[0]);ys.push(p[1]);}));
  const x0=o.xmin!=null?o.xmin:Math.min(...xs),x1=o.xmax!=null?o.xmax:Math.max(...xs);
  let y0=o.ymin!=null?o.ymin:Math.min(0,...ys),y1=o.ymax!=null?o.ymax:Math.max(...ys)*1.06;if(y1===y0)y1=y0+1;
  const X=x=>pad.l+(x-x0)/(x1-x0||1)*(W-pad.l-pad.r),Y=y=>H-pad.b-(y-y0)/(y1-y0)*(H-pad.t-pad.b);
  niceTicks(y0,y1,5).forEach(v=>{svg.append(sv('line',{class:'gl',x1:pad.l,x2:W-pad.r,y1:Y(v),y2:Y(v)}),sv('text',{class:'mut',x:pad.l-7,y:Y(v)+4,'text-anchor':'end'},o.yfmt?o.yfmt(v):A.abbr(v)));});
  const xt=o.xticks||niceTicks(x0,x1,7);
  xt.forEach(v=>{svg.append(sv('line',{class:'ax',x1:X(v),x2:X(v),y1:H-pad.b,y2:H-pad.b+4}),sv('text',{class:'mut',x:X(v),y:H-pad.b+17,'text-anchor':'middle'},o.xfmt?o.xfmt(v):String(v)));});
  svg.append(sv('line',{class:'ax',x1:pad.l,x2:W-pad.r,y1:H-pad.b,y2:H-pad.b}));
  if(o.xl)svg.append(sv('text',{x:(pad.l+W-pad.r)/2,y:H-6,'text-anchor':'middle'},o.xl));
  if(o.yl)svg.append(sv('text',{x:13,y:(pad.t+H-pad.b)/2,'text-anchor':'middle',transform:'rotate(-90 13 '+(pad.t+H-pad.b)/2+')'},o.yl));
  (o.vlines||[]).forEach(v=>{svg.append(sv('line',{x1:X(v[0]),x2:X(v[0]),y1:pad.t,y2:H-pad.b,stroke:'var(--muted)','stroke-dasharray':'4 4'}),sv('text',{class:'mut',x:X(v[0])+4,y:pad.t+11},v[1]));});
  series.forEach((s,k)=>{

C.unIndex=(Mg,Fg)=>{

const SP={a1:0.30863488433993674,b1:10,a2:0.002062271091405915,a3:0.0001106598548361882,b3:0.08494401196198016};
C.SP=SP;
const H=(x,k)=>k*(SP.a1/SP.b1*(1-Math.exp(-SP.b1*x))+SP.a2*x+SP.a3/SP.b3*(Math.exp(SP.b3*x)-1));

const Lint=(a,b,k)=>{const n=Math.max(40,Math.round((b-a)*(a<1?400:20)));const h=(b-a)/n;let s=0;for(let i=0;i<n;i++)s+=C.lx(a+(i+.5)*h,k);return s*h;};

C.e0k=k=>Lint(0,130,k);
C.solveK=e=>{let lo=0.03,hi=8;for(let i=0;i<60;i++){const m=(lo+hi)/2;if(C.e0k(m)>e)lo=m;else hi=m;}return (lo+hi)/2;};
C.AGES19=[0,1,5,10,15,20,25,30,35,40,45,50,55,60,65,70,75,80,85];
C.modelMx=k=>{const a=C.AGES19,m=[];for(let i=0;i<a.length;i++){const lo=a[i],hi=i<a.length-1?a[i+1]:130;m.push((C.lx(lo,k)-C.lx(hi,k))/Lint(lo,hi,k));}return m;};

C.lifetable=(mx,sex)=>{
  const ages=C.AGES19,N=ages.length,n=ages.map((x,i)=>i===N-1?Infinity:ages[i+1]-x);

C.leslie=k=>{

C.SRB=1.03;
/* ---------- cohort-component projection ---------- */
C.base21=()=>({M:C.grp21(D.age21.m),F:C.grp21(D.age21.f)});
C.project=P=>{
  const steps=P.tfr.length;let {M,F}=C.base21();M=M.slice();F=F.slice();
  const pat=P.asfr||D.asfr['2022'],ps=C.tfr(pat);const out=[{yr:2021,M:M.slice(),F:F.slice(),births:null}];
  for(let s=0;s<steps;s++){
    const kf=C.solveK(P.e0[s]+(P.gap||0)/2),km=C.solveK(P.e0[s]-(P.gap||0)/2);

(function(){

/* M1: census explorer */

/* M2: dual-system estimation */
L.dse=function(root){
  const ctr=el('div',{class:'ctrls'});root.append(ctr);

  const mm=A.num(ctr,{label:'m: persons matched in both',value:9100,on:()=>draw()});
  root.append(kp,ch,el('h4',null,'When capture is not independent: hard-to-count groups'),
    el('p',null,'Suppose a share w of the population is hard to count. In that group each source captures people with probability p; elsewhere with probability 0.97 in both sources. People in a group are captured independently, but groups differ. The true population is 1.00; the DSE estimates it from the matched counts.'),het);
  function draw(){
    const a=n1.get(),b=n2.get(),m=mm.get();kp.innerHTML='';
    if(!(m>0&&m<=Math.min(a,b))){kp.append(A.callout('warn','Check inputs','m must be positive and no larger than n₁ or n₂.'));return;}

    kp.append(A.callout('key','Scaling to Ghana','If the omission rate shown were the national net coverage error, the census total of 30,832,019 would correspond to about '+fmt(30832019*N/a)+' people. This is a teaching scenario: use the published PES results for real coverage.'));
  }
  const w=A.slider(het,{label:'Share of hard-to-count population (w)',min:0,max:40,step:1,value:10,suf:'%',on:()=>hdraw()});
  const p=A.slider(het,{label:'Capture probability in hard-to-count group (each source)',min:20,max:97,step:1,value:70,suf:'%',on:()=>hdraw()});
  const out=el('div');het.append(out);
  function hdraw(){
    const W=w.get()/100,ph=p.get()/100,pe=0.97;
    const e1=(1-W)*pe+W*ph,e2=e1,em=(1-W)*pe*pe+W*ph*ph;const Nh=e1*e2/em;

const hhi=()=>{const T=sum(D.ethnic.map(e=>e[1]));return sum(D.ethnic.map(e=>(e[1]/T)**2));};
const nrr=(asfr,e0)=>{const k=C.solveK(e0),mid=[17.5,22.5,27.5,32.5,37.5,42.5,47.5];const mf=asfr.map(v=>v/1000/(1+C.SRB));const R0=sum(mf.map((m,i)=>5*m*C.lx(mid[i],k)));let lo=-0.1,hi=0.15;for(let i=0;i<60;i++){const r=(lo+hi)/2;const f=sum(mf.map((m,i)=>5*m*C.lx(mid[i],k)*Math.exp(-r*mid[i])));if(f>1)lo=r;else hi=r;}return {R0,r:(lo+hi)/2};};
const resid=(bs,ds)=>{const U=D.unB;const f10=2011-T0,f21=T1-2021;const ys=['2011','2012','2013','2014','2015','2016','2017','2018','2019','2020'];const B=f10*U['2010'][0]+sum(ys.map(y=>U[y][0]))+f21*U['2021'][0],Dd=f10*U['2010'][1]+sum(ys.map(y=>U[y][1]))+f21*U['2021'][1];return (30832019-24658823)-(1000*B*bs-1000*Dd*ds);};
const estExp=y=>24658823*Math.exp(C.expR(24658823,30832019,T1-T0)*(y-T0));
const tot=(sc,yr)=>C.metrics(A.runScenario(A.PRESETS[sc]).find(s=>s.yr===yr)).tot;
A.giniR=giniR;

const M=A.mods;
M.push({id:1,unit:1,title:'The census system and intercensal growth',ch:'Siegel & Swanson, Chapters 1–3 and 11',
brief:`<div class="eyebrow">Learning objectives</div><ul><li>Describe Ghana’s census history and the features that define a census.</li><li>Compute and compare linear, geometric and exponential growth rates using exact reference dates.</li><li>Explain why early and recent census counts are not directly comparable.</li></ul>
<h3>Ghana’s census history</h3>
<p>Ghana has conducted twelve censuses since 1891: six before independence (1891, 1901, 1911, 1921, 1931, 1948) and six after (1960, 1970, 1984, 2000, 2010, 2021). The ten-year rhythm was broken in 1941 (the Second World War), in 1980 and 1990 (economic and political instability), and in 2020 (COVID-19 moved the census from March 2020 to June 2021). The Statistical Service Act, 2019 (Act 1003) requires a census every ten years in March.</p>
<p>The 2021 Population and Housing Census was Ghana’s first fully digital census and a <b>de facto</b> count of everyone present on census night, 27 June 2021. The operation used tablets (computer-assisted personal interviewing), about 51,913 enumeration areas, 272 statistical districts and some 70,000 field officers, followed by a post-enumeration survey (PES).</p>
<p>The classic features of a census (Siegel &amp; Swanson, Ch. 2–3) are <i>individual enumeration</i>, <i>universality</i>, <i>simultaneity</i> and <i>periodicity</i>. Each has a practical meaning here: a unique record per person, no one excluded, one reference night, and a fixed cycle.</p>
<h3>Measuring growth between censuses</h3>
<div class="formula">Linear:       P₂ = P₁ (1 + r·t)        r = (P₂/P₁ − 1) / t
Geometric:    P₂ = P₁ (1 + r)ᵗ         r = (P₂/P₁)^(1/t) − 1
Exponential:  P₂ = P₁ e^(r·t)          r = ln(P₂/P₁) / t
Doubling time = ln 2 / r  ≈ 70 / (100·r)</div>
<p>The exponential rate is the standard for intercensal comparison because it treats growth as continuous. The time <i>t</i> must be measured between the actual census dates, not the nominal years.</p>
<div class="callout warn"><b class="t">Common error</b>Using 11 years for 2010–2021 instead of 10.76 (26 September 2010 to 27 June 2021) understates the growth rate by about 2%.</div>`,
lab:'census',
practice:[
 N('Using reference dates 2010.73 and 2021.49, compute the <b>exponential growth rate</b> 2010–2021 (% a year, 2 d.p.).',()=>100*C.expR(24658823,30832019,T1-T0),0.02,()=>`r = ln(30,832,019 / 24,658,823) ÷ 10.76 = ${sd(100*C.expR(24658823,30832019,T1-T0),3)}% a year.`,'%'),
 N('At that rate, how many years would the population take to double?',()=>C.dbl(C.expR(24658823,30832019,T1-T0)),0.2,()=>`t = ln 2 ÷ r = 0.6931 ÷ ${sd(C.expR(24658823,30832019,T1-T0),5)} = ${sd(C.dbl(C.expR(24658823,30832019,T1-T0)),1)} years.`,'years'),
 N('Compute the <b>geometric</b> annual growth rate between the 1960 census (date 1960.2) and the 2021 census (date 2021.49), in % a year.',()=>100*C.geoR(6726815,30832019,T1-C.cy(1960)),0.03,()=>`r = (30,832,019 / 6,726,815)^(1/61.29) − 1 = ${sd(100*C.geoR(6726815,30832019,T1-C.cy(1960)),3)}%.`,'%'),
 Q('Ghana’s count fell from 1,549,661 in 1901 to 1,503,911 in 1911. The most defensible reading is…',['A real fall of about 3% in the population','Changes in territory covered and in census methods make the counts non-comparable','The 1911 census over-counted','Emigration of most of the population'],1,'Early censuses covered changing territory and used very different procedures. A fall like this is a data-comparability warning, not evidence of demographic decline.'),
 Q('A student uses t = 11 years for 2010–2021. The growth rate will be…',['Overstated','Understated','Unchanged','Negative'],1,'The true interval is 10.76 years. A longer t in the denominator gives a smaller r.')
],
reflect:['Why might the 2021 census count differ from a count taken in March as the Act specifies? What does the shift of date do to intercensal rates?','Which of the four census features is hardest to achieve in Ghana, and what operational design choices address it?'],
r:`census <- data.frame(year = c(1960.2, 1970.2, 1984.2, 2000.2, 2010.73, 2021.49),
                     pop  = c(6726815, 8559313, 12296081, 18912079, 24658823, 30832019))
r <- diff(log(census$pop)) / diff(census$year)   # exponential rates
round(100 * r, 2)
round(log(2) / r, 1)                              # doubling times`});

M.push({id:2,unit:1,title:'Coverage evaluation: PES and dual-system estimation',ch:'Siegel & Swanson, Chapter 4',
brief:`<div class="eyebrow">Learning objectives</div><ul><li>Explain how a post-enumeration survey evaluates census coverage.</li><li>Apply the dual-system (capture–recapture) estimator and its Chapman correction.</li><li>Predict the direction of bias when the independence assumption fails.</li></ul>
<h3>Why evaluate coverage?</h3>
<p>Every census omits some people and counts others twice. Coverage evaluation estimates net coverage error by comparing the census with an independent source. In Ghana, a PES followed the 2021 enumeration. The estimates of net error are used to understand data quality, not to replace the published counts.</p>
<h3>The dual-system estimator</h3>
<div class="formula">Lincoln–Petersen:  N̂ = n₁ · n₂ / m
Chapman:           N̂ = (n₁+1)(n₂+1)/(m+1) − 1
Census coverage rate = n₁ / N̂      Omission rate = 1 − n₁/N̂</div>
<p>n₁ is the number counted by the census in the PES areas, n₂ the number counted by the PES, and m the number matched in both. The method assumes the two counts are <i>independent</i> and that the match is exact.</p>
<div class="callout key"><b class="t">Correlation bias</b>People who are hard to reach in the census (informal settlements, mobile populations, young children) tend to be hard for the PES too. Positive dependence makes m too large, so N̂ is biased <b>downward</b>. The GRID3 hard-to-count index used with the 2021 census is designed to target this problem.</div>`,
lab:'dse',
practice:[
 N('A PES area has n₁ = 9,800, n₂ = 9,500 and m = 9,100. Compute the Lincoln–Petersen estimate N̂.',()=>9800*9500/9100,1,()=>`N̂ = 9,800 × 9,500 ÷ 9,100 = ${sd(9800*9500/9100,1)}.`),
 N('What is the census <b>coverage rate</b> (n₁ ÷ N̂, in %)?',()=>100*9800/(9800*9500/9100),0.1,()=>`9,800 ÷ ${sd(9800*9500/9100,1)} = ${sd(100*9800/(9800*9500/9100),2)}%.`,'%'),
 N('Hard-to-count share 15%; capture probability 60% in each source in that group and 97% elsewhere. The DSE estimate as a percentage of the true population is…',()=>{const W=.15,ph=.6,pe=.97,e1=(1-W)*pe+W*ph,em=(1-W)*pe*pe+W*ph*ph;return 100*e1*e1/em;},0.2,()=>`n₁=n₂=0.9145; m = 0.85·0.97² + 0.15·0.6² = 0.8538; N̂ = 0.9145²/0.8538 = 0.9795, so 97.9% of truth.`,'%'),
 Q('If the same hard-to-reach people are missed by both the census and the PES, the DSE will…',['Overestimate the population','Underestimate the population','Be unbiased','Give a negative count'],1,'Positive correlation inflates m, shrinking n₁n₂/m.')
],
reflect:['Which groups in Ghana are most likely to be missed twice? How could the PES design reduce dependence between the two counts?','What would a census undercount of 2% imply for regional allocation formulas if it is concentrated in a few regions?'],
r:`dse <- function(n1, n2, m) {
  c(LP = n1*n2/m,
    Chapman = (n1+1)*(n2+1)/(m+1) - 1,
    coverage = n1/(n1*n2/m))
}
dse(9800, 9500, 9100)`});

M.push({id:3,unit:1,title:'Age and sex data quality: heaping and accuracy indices',ch:'Siegel & Swanson, Chapter 7',
brief:`<div class="eyebrow">Learning objectives</div><ul><li>Detect digit preference with Whipple’s and Myers' indices.</li><li>Compute the UN age-sex accuracy index and interpret its components.</li><li>Distinguish heaping from genuine cohort effects.</li></ul>
<h3>Why age data are fragile</h3>
<p>Age is reported by respondents, often without documents. People round to ages ending in 0 or 5, avoid some digits, or misreport ages of women and the elderly. Almost every demographic measure uses age, so errors spread.</p>
<h3>Indices</h3>
<div class="formula">Whipple = 100 · (P₂₅ + P₃₀ + … + P₆₀) / ( ⅕ · Σ P₂₃…P₆₂ )     100 = no preference, 500 = all at 0 or 5
Myers: for each terminal digit d, blend two sums of ages ending in d (weights d+1 and 9−d);
       index = ½ Σ |share_d − 10%|, range 0–90.
UN joint index = 3·SRS + ARS_male + ARS_female
  SRS = mean |change in sex ratio between successive 5-year groups|
  ARS = mean |100·2·Pₐ/(Pₐ₋₁ + Pₐ₊₁) − 100|     &lt;20 accurate · 20–40 inaccurate · &gt;40 highly inaccurate</div>
<p>Whipple classes: below 105 highly accurate; 105–110 fairly accurate; 110–125 approximate; 125–175 rough; above 175 very rough.</p>
<div class="callout info"><b class="t">Implementation note</b>This lab computes Myers' index on ages 10–89 using ages 10+d … 70+d in the first sum and 20+d … 80+d in the second. Other software uses slightly different conventions, so values are comparable only within one definition.</div>`,
lab:'heaping',
practice:[
 N('Compute Whipple’s index for <b>both sexes</b> (ages 23–62) from the 2021 single-year counts.',()=>C.whipple(popB),0.2,()=>`Σ(ages 25,30,…,60) ÷ (⅕ × Σ ages 23–62) × 100 = ${sd(C.whipple(popB),2)}.`),
 N('What percentage of the blended population (Myers) falls on terminal digit 0?',()=>C.myers(popB).pct[0],0.05,()=>`Digit 0 holds ${sd(C.myers(popB).pct[0],2)}% against an expected 10%.`,'%'),
 N('Compute the UN age-sex accuracy index (joint score).',()=>C.unIndex(C.grp21(D.age21.m),C.grp21(D.age21.f)).idx,0.2,()=>{const u=C.unIndex(C.grp21(D.age21.m),C.grp21(D.age21.f));return `3 × ${sd(u.SRS,2)} + ${sd(u.am,2)} + ${sd(u.af,2)} = ${sd(u.idx,2)}.`;}),
 Q('A Whipple index of about 116 is best described as…',['Highly accurate','Fairly accurate','Approximate','Very rough'],2,'110–125 is the “approximate” class.'),
 Q('The UN index is just under 20 here. The best interpretation is…',['The data are perfect','The data are accurate by the UN rule but close to the boundary, with visible heaping','The data must be discarded','The data are highly inaccurate'],1,'An index below 20 is classed “accurate”, but the lab shows clear digit preference, so a score near the boundary deserves care.')
],
reflect:['Whipple and Myers both flag heaping but disagree about its size on some definitions. Which would you report in a methods note and why?','The 2021 counts fall sharply between ages 21 and 22. List three hypotheses (coverage, migration, cohort size, reporting) and the data needed to test each.'],
r:`whipple <- function(P, ages = 0:95) {            # P indexed by single year of age 0..95
  num <- sum(P[ages %in% seq(25, 60, 5) + 1])    # careful: R is 1-indexed
  den <- sum(P[24:63]) / 5                        # ages 23..62
  100 * num / den
}`});

M.push({id:4,unit:2,title:'Age–sex structure, dependency and the demographic window',ch:'Siegel & Swanson, Chapter 7',
brief:`<div class="eyebrow">Learning objectives</div><ul><li>Read a population pyramid and compute dependency, ageing and sex-ratio indicators.</li><li>Compare measures computed from single years and from grouped data.</li><li>Link the age structure to the idea of a demographic dividend.</li></ul>
<h3>Ghana’s age structure</h3>
<p>In 2021, 35.3% of Ghanaians were aged 0–14 (down from 41.3% in 2000), 60.4% were 15–64 and 4.3% were 65 or older. The Ghana Statistical Service reports an age-dependency ratio of 66. Young people aged 15–35 now outnumber children: 38.2% of the population.</p>
<div class="formula">Total dependency ratio = 100 · (P₀₋₁₄ + P₆₅₊) / P₁₅₋₆₄
Youth dependency      = 100 · P₀₋₁₄ / P₁₅₋₆₄       Old-age dependency = 100 · P₆₅₊ / P₁₅₋₆₄
Ageing index          = 100 · P₆₅₊ / P₀₋₁₄            Sex ratio = 100 · males / females
Median age: the age that splits the population in two; interpolate within the median group.</div>
<div class="callout key"><b class="t">Dividend or dilemma?</b>A falling dependency ratio raises the share of potential workers. The first demographic dividend appears only when those people are productively employed; the second depends on saving and human-capital investment over the life course.</div>`,
lab:'structure',
practice:[
 N('Compute the 2021 <b>total dependency ratio</b> from the single-year data.',()=>dep21().td,0.1,()=>`(${fmt(dep21().y)} + ${fmt(dep21().o)}) ÷ ${fmt(dep21().w)} × 100 = ${sd(dep21().td,2)}.`),
 N('Compute the 2010 total dependency ratio from the 2010 age groups.',()=>dep10().td,0.1,()=>`(${fmt(dep10().y)} + ${fmt(dep10().o)}) ÷ ${fmt(dep10().w)} × 100 = ${sd(dep10().td,2)}.`),
 N('Compute the 2021 <b>median age</b> from single years (1 d.p.).',()=>C.medianSingle(popB),0.1,()=>`The cumulative count reaches half of 30,832,019 inside age ${Math.floor(C.medianSingle(popB))}; interpolating gives ${sd(C.medianSingle(popB),2)} years.`,'years'),
 N('Compute the 2021 <b>ageing index</b> (persons 65+ per 100 children under 15).',()=>dep21().ai,0.1,()=>`${fmt(dep21().o)} ÷ ${fmt(dep21().y)} × 100 = ${sd(dep21().ai,2)}.`),
 Q('Why do medians from single years and from 5-year groups differ slightly?',['Grouped data assume a uniform distribution within the group, so interpolation differs','Single-year data are wrong','Grouped data include more people','They never differ'],0,'Linear interpolation inside a 5-year group is an approximation; single-year ages need less interpolation.')
],
reflect:['Is a falling dependency ratio in Ghana mainly due to fewer children, more working-age adults, or both? Decompose the change from 75.6 to 65.6.','What data beyond age structure are needed to claim that Ghana is capturing a demographic dividend?'],
r:`ages_g <- c(sum(P[1:15]), sum(P[16:65]), sum(P[66:96]))   # 0-14, 15-64, 65+
dep <- (ages_g[1] + ages_g[3]) / ages_g[2] * 100
median_age <- approx(cumsum(P)/sum(P), 0:95, xout = 0.5)$y`});

M.push({id:5,unit:2,title:'Regions: growth, concentration and redistribution',ch:'Siegel & Swanson, Chapters 5 and 19',
brief:`<div class="eyebrow">Learning objectives</div><ul><li>Compute regional growth rates, shares and concentration measures.</li><li>Use a Lorenz curve and Gini coefficient for a regional distribution.</li><li>Recognise the limits of a redistribution proxy and of boundary-dependent comparisons.</li></ul>
<h3>Ghana’s regions</h3>
<p>Ghana has 16 regions (10 before the 2019 creation of six new regions) and 261 district assemblies. In 2021 Greater Accra, the smallest region by area, became the most populous (5,455,692), just ahead of Ashanti (5,440,463). The two together hold about 35% of the population.</p>
<p>Comparisons across 2010 and 2021 require 2010 counts re-tabulated to the current boundaries, which is what this lab uses. District comparisons are much riskier: many districts were split or merged, so a raw difference can reflect redrawn borders, not population change.</p>
<div class="formula">Growth rate rᵣ = ln(P₂₀₂₁ / P₂₀₁₀) / t
Relative gain = P₂₀₂₁ − P₂₀₁₀ · (P_Ghana,2021 / P_Ghana,2010)       (sums to zero across regions)
Gini = 1 − 2 · (area under the Lorenz curve)</div>
<div class="callout warn"><b class="t">Not a migration estimate</b>Relative gain mixes net migration with differences in natural increase (regional TFR ranges from 2.9 to 6.6). It shows where growth beat or trailed the national pace, not who moved.</div>`,
lab:'regions',
practice:[
 N('Compute the exponential growth rate 2010–2021 for <b>Greater Accra</b> (% a year).',()=>R.find(r=>r.n==='Greater Accra').rate,0.02,()=>`ln(5,455,692 / 4,010,054) ÷ 10.76 = ${sd(R.find(r=>r.n==='Greater Accra').rate,3)}%.`,'%'),
 Q('Which region grew fastest between 2010 and 2021?',['Greater Accra','Northern','Savannah','North East'],1,'Northern grew at about 3.7% a year, faster than North East (3.2%), Savannah (3.1%) and Greater Accra (2.9%).'),
 N('Compute Greater Accra’s <b>relative gain</b> (people) compared with growing at the national pace.',()=>R.find(r=>r.n==='Greater Accra').tr,2000,()=>`5,455,692 − 4,010,054 × (30,832,019/24,658,823) = ${fmt(R.find(r=>r.n==='Greater Accra').tr)}.`),
 N('Compute the Gini coefficient of the 2021 regional population distribution (3 d.p.).',()=>giniR(),0.003,()=>`Sort regions by size, cumulate population shares, integrate the Lorenz curve: Gini = ${sd(giniR(),3)}.`),
 Q('A district shows a 40% fall in population between two censuses. Before concluding anything you should…',['Check whether its boundaries changed between the censuses','Assume mass out-migration','Ignore the district','Multiply by the national growth rate'],0,'Splits and merges of districts are common; comparisons need a consistent geography.')
],
reflect:['Greater Accra grew by 36% in 11 years while its TFR (2.9) is the lowest in Ghana. What does that imply about the role of migration, and what data would test it?','Why might the Gini of regional size fall even while Greater Accra grows faster than the rest?'],
r:`reg <- read.csv("regions.csv")   # columns: region, p2010, p2021
t <- 2021.49 - 2010.73
reg$r <- log(reg$p2021 / reg$p2010) / t
reg$gain <- reg$p2021 - reg$p2010 * sum(reg$p2021) / sum(reg$p2010)
# Gini: install.packages("DescTools"); DescTools::Gini(reg$p2021)`});

M.push({id:6,unit:2,title:'Urbanisation and the urban–rural growth differential',ch:'Siegel & Swanson, Chapter 6',
brief:`<div class="eyebrow">Learning objectives</div><ul><li>Define urban population using Ghana’s classification and explain how definitions affect comparisons.</li><li>Compute the urban–rural growth differential (URGD) and use it to project the urban share.</li></ul>
<h3>Urbanisation in Ghana</h3>
<p>Ghana classifies localities with 5,000 or more people as urban, a rule used since 1960. The urban share rose from 23.1% (1960) to 28% (1970), 32% (1984), 50.9% (2010) and 56.7% (2021: 17,472,530 urban and 13,359,489 rural residents). Almost half (47.8%) of the 2010–2021 growth in the urban population occurred in Greater Accra and Ashanti.</p>
<div class="formula">URGD = r_urban − r_rural                          (exponential rates)
logit(share) = ln( U / (1 − U) )     increases at rate URGD if the differential is constant
Time to reach target share U*:  t = [ logit(U*) − logit(U₂₀₂₁) ] / URGD</div>
<div class="callout info"><b class="t">Reclassification</b>A locality that crosses 5,000 people becomes urban, moving its whole population from the rural to the urban count. Part of the measured URGD is reclassification, not migration or natural increase.</div>`,
lab:'urban',
practice:[
 N('Compute the <b>URGD</b> for 2010–2021 in percentage points a year (use 50.9% urban in 2010).',()=>100*urb().urgd,0.03,()=>`r_urban = ${sd(100*urb().ru,2)}%, r_rural = ${sd(100*urb().rr,2)}%; difference ${sd(100*urb().urgd,2)} pp.`,'pp'),
 N('If the URGD stays constant, in what year does the urban share reach 70%? (nearest year)',()=>{const lg=p=>Math.log(p/(1-p));return T1+(lg(.7)-lg(urb().s21))/urb().urgd;},1.5,()=>{const lg=p=>Math.log(p/(1-p));return `t = [logit(0.70) − logit(${sd(urb().s21,3)})] ÷ ${sd(urb().urgd,4)} = ${sd((lg(.7)-lg(urb().s21))/urb().urgd,1)} years after 2021.`;},'year'),
 Q('Why is the 2010 urban population only approximate here?',['It was computed from a rounded published share','The census did not count urban areas','2010 had no census','Urban means 50,000 people'],0,'The published 50.9% was applied to the total count.'),
 Q('If Ghana lowered its urban threshold from 5,000 to 2,500, the measured urban share would…',['Fall','Rise','Stay the same','Become negative'],1,'More localities qualify as urban.')
],
reflect:['How much of Ghana’s rising urban share might be reclassification? How would you separate it from migration using locality-level census data?','Compare Ghana’s 5,000 threshold with other countries. What are the consequences for cross-country urbanisation rankings?'],
r:`u10 <- 0.509 * 24658823; r10 <- 24658823 - u10
ru <- log(17472530 / u10) / (2021.49 - 2010.73)
rr <- log(13359489 / r10) / (2021.49 - 2010.73)
urgd <- ru - rr
logit <- function(p) log(p / (1 - p))
(logit(.70) - logit(17472530 / 30832019)) / urgd`});

M.push({id:7,unit:2,title:'Ethnic composition, diversity indices and classification',ch:'Siegel & Swanson, Chapter 8',
brief:`<div class="eyebrow">Learning objectives</div><ul><li>Explain self-identification and why ethnic categories depend on the classification used.</li><li>Compute a Herfindahl index, a diversity index and the effective number of groups.</li><li>Evaluate how merging or splitting categories changes diversity measures.</li></ul>
<h3>Ethnicity in a census</h3>
<p>The 2021 census recorded ethnic group as reported by respondents, with the groups tabulated by the Ghana Statistical Service shown in the lab. Ghana has more than seventy ethnic groups; census tables use broader groupings such as Akan, Mole-Dagbani, Ewe, Ga-Dangme, Gurma, Guan, Grusi and Mande. Categories are an instrument of measurement: they can be merged or split, and persons may identify differently over time and by context.</p>
<div class="formula">Shares pᵢ = nᵢ / N          Herfindahl index H = Σ pᵢ²
Diversity (ethnolinguistic fractionalisation) = 1 − H       Effective number of groups = 1 / H</div>
<div class="callout warn"><b class="t">Ethical note</b>Ethnic statistics can inform equitable planning and can also be misused. Report categories exactly as collected, avoid inferring individuals from tables, and state limits when diversity indices are used in analysis.</div>`,
lab:'ethnic',
practice:[
 N('Compute the Herfindahl index H for the tabulated groups (3 d.p.).',()=>hhi(),0.003,()=>`H = Σ pᵢ² = ${sd(hhi(),4)}, with shares based on the tabulated total of 30,484,536.`),
 N('Compute the effective number of groups 1/H.',()=>1/hhi(),0.05,()=>`1 ÷ ${sd(hhi(),4)} = ${sd(1/hhi(),2)}: the population is as diverse as about ${sd(1/hhi(),1)} equal-sized groups.`),
 N('How many people in the national total of 30,832,019 are <b>not</b> in the tabulated ethnic groups?',()=>30832019-sum(D.ethnic.map(e=>e[1])),1,()=>`30,832,019 − 30,484,536 = ${fmt(30832019-sum(D.ethnic.map(e=>e[1])))}.`),
 Q('If you merge Gurma, Guan, Grusi and Mande into one category, the diversity index will…',['Fall','Rise','Stay unchanged','Become undefined'],0,'Merging groups concentrates shares and raises H, so diversity (1 − H) falls.')
],
reflect:['Who should decide the categories on a census form? How should communities be consulted?','Would you use an ethnic fractionalisation index as a regressor in a model of development outcomes? What would you worry about?'],
r:`eth <- c(Akan = 13925576, MoleDagbani = 5638881, Ewe = 3902009, GaDangme = 2153562,
         Gurma = 1959618, Guan = 981747, Grusi = 826901, Mande = 600213, Other = 496029)
p <- eth / sum(eth)
c(H = sum(p^2), diversity = 1 - sum(p^2), effective = 1 / sum(p^2))`});

M.push({id:8,unit:2,title:'Households, literacy and human-capital indicators',ch:'Siegel & Swanson, Chapters 9–10',
brief:`<div class="eyebrow">Learning objectives</div><ul><li>Distinguish proportions, ratios and rates, and build indicators from census counts.</li><li>Interpret changes in household size and literacy.</li></ul>
<h3>Households and literacy</h3>
<p>Average household size in Ghana fell from 4.4 in 2010 to 3.6 in 2021 (urban 4.1 to 3.3; rural 5.0 to 4.0). Smaller households mean more households for the same population, with implications for housing demand. For literacy, 16,453,426 persons aged 11 and over were literate and 6,134,584 were not.</p>
<div class="formula">Proportion = a / (a + b)         Ratio = a / b         Rate = events / person-years of exposure
Literacy rate = literate / (literate + not literate)     Households ≈ population / average household size</div>
<div class="callout info"><b class="t">Check the denominator</b>A literacy rate with “all persons” in the denominator would be wrong: the question applies to persons aged 11 and over. Many errors in published indicators are denominator errors.</div>`,
lab:'indicators',
practice:[
 N('Compute the literacy rate (% of persons aged 11+).',()=>100*D.lit.yes/(D.lit.yes+D.lit.no),0.05,()=>`16,453,426 ÷ (16,453,426 + 6,134,584) × 100 = ${sd(100*D.lit.yes/(D.lit.yes+D.lit.no),2)}%.`,'%'),
 N('Using an average size of 3.6, approximately how many households (millions) does 30,832,019 imply?',()=>30832019/3.6/1e6,0.05,()=>`30,832,019 ÷ 3.6 = ${sd(30832019/3.6/1e6,2)} million. This ignores people in group quarters, so it is approximate.`,'million'),
 N('By what percentage did average household size change between 2010 (4.4) and 2021 (3.6)?',()=>100*(3.6-4.4)/4.4,0.1,()=>`(3.6 − 4.4) ÷ 4.4 × 100 = ${sd(100*(3.6-4.4)/4.4,1)}%.`,'%'),
 Q('The number of males divided by the number of females is a…',['Rate','Proportion','Ratio','Percentage of the population'],2,'Males and females are disjoint groups; the quotient is a ratio.')
],
reflect:['If household size falls while population grows by 25%, what happens to the number of households? What does this imply for housing policy?','What are the limits of a literacy question in a census compared with a tested measure?'],
r:`lit <- c(yes = 16453426, no = 6134584)
round(100 * lit["yes"] / sum(lit), 2)
households <- 30832019 / 3.6`});

M.push({id:9,unit:3,title:'Growth and the demographic transition',ch:'Siegel & Swanson, Chapter 11',
brief:`<div class="eyebrow">Learning objectives</div><ul><li>Describe Ghana’s demographic transition using birth, death, fertility and mortality series.</li><li>Compute the rate of natural increase and implied doubling time.</li><li>Reconcile growth between sources and identify inconsistencies.</li></ul>
<h3>A century-long transition</h3>
<p>In the UN World Population Prospects (2022) estimates, Ghana’s crude death rate fell from about 22.6 per 1,000 in 1950 to 7.5 in 2021 and life expectancy rose from 43 to about 64 years, while the crude birth rate fell more slowly, from about 47 to 27. The result is a long period of rapid natural increase that is now narrowing. DHS surveys show the total fertility rate falling from 6.4 (1988) to 3.9 (2022).</p>
<div class="formula">Balancing equation:   P₂ = P₁ + B − D + I − E
Rate of natural increase RNI = CBR − CDR   (per 1,000)
Net migration residual   M = (P₂ − P₁) − (B − D)</div>
<div class="callout warn"><b class="t">Sources disagree</b>WPP estimates for 2021 (32.5 million) exceed the census count (30.8 million). When two sources use different population bases, a residual is meaningless: the reconciliation panel shows how large the mismatch is.</div>`,
lab:'transition',
practice:[
 N('Using the 2021 UN CBR (27.0) and CDR (7.5), compute the rate of natural increase per 1,000.',()=>27.0-7.5,0.05,()=>`27.0 − 7.5 = 19.5 per 1,000.`),
 N('At that rate, what is the doubling time (years)?',()=>C.dbl(0.0195),0.3,()=>`ln 2 ÷ 0.0195 = ${sd(C.dbl(0.0195),1)} years.`,'years'),
 N('By what percentage did the UN TFR estimate fall between 1970 (6.95) and 2021 (3.49)?',()=>100*(6.95-3.49)/6.95,0.1,()=>`(6.95 − 3.49) ÷ 6.95 × 100 = ${sd(100*(6.95-3.49)/6.95,1)}%.`,'%'),
 Q('Which description fits Ghana in 2021?',['Pre-transition: high birth and death rates','Mid-to-late transition: low death rate, falling but still high birth rate','Post-transition: low birth and death rates','Reverse transition'],1,'CDR is low (7.5) while CBR is 27 and falling.')
],
reflect:['Why does the UN series differ from the census-based growth rate? List data and method reasons.','Ghana’s fertility decline stalled in some DHS rounds (4.0 in 2008, 4.2 in 2014). Is that a real stall or sampling variation? How would you test?'],
r:`un <- data.frame(year = c(2010, 2015, 2020, 2021), cbr = c(33.0, 31.7, 27.4, 27.0), cdr = c(8.6, 7.8, 7.4, 7.5))
transform(un, rni = cbr - cdr, doubling = log(2) / ((cbr - cdr) / 1000))`});

M.push({id:10,unit:3,title:'Fertility: measures, trends and decomposition',ch:'Siegel & Swanson, Chapters 15–16',
brief:`<div class="eyebrow">Learning objectives</div><ul><li>Compute TFR, mean age at childbearing and GRR from age-specific rates.</li><li>Decompose a TFR difference exactly by age group.</li><li>Interpret urban–rural and regional fertility and unwanted fertility.</li></ul>
<h3>Ghana’s fertility</h3>
<p>The 2022 Ghana Demographic and Health Survey (GDHS) estimates a TFR of 3.9 (urban 3.2, rural 4.8), down from 6.4 in 1988. Fertility peaks at 190 births per 1,000 women aged 25–29. The median age at first birth among women 25–49 is 22.1. Regionally, TFR ranges from 2.9 in Greater Accra to 6.6 in the North East Region.</p>
<div class="formula">TFR = 5 · Σ ASFRₐ / 1000          Mean age at childbearing = Σ (m_a · ASFRₐ) / Σ ASFRₐ     (m_a = age-group midpoint)
GRR = TFR · (female births / all births)     ΔTFR by age = 5 · (ASFRₐ − ASFR′ₐ) / 1000
Unwanted fertility = TFR − wanted fertility rate</div>
<div class="callout info"><b class="t">Period versus cohort</b>The TFR is a period measure built from one time window. It can differ from completed cohort fertility when the timing of births is changing.</div>`,
lab:'fertility',
practice:[
 N('Compute the 2022 national TFR from the age-specific rates.',()=>C.tfr(D.asfr['2022']),0.01,()=>`5 × (63 + 156 + 190 + 176 + 128 + 53 + 14) ÷ 1000 = ${sd(C.tfr(D.asfr['2022']),2)}.`),
 N('How much did the 20–24 age group contribute to the change in TFR between 1988 and 2022? (negative = decline)',()=>5*(D.asfr['2022'][1]-D.asfr['1988'][1])/1000,0.01,()=>`5 × (156 − 258) ÷ 1000 = ${sd(5*(156-258)/1000,2)}.`),
 N('Compute the rural − urban TFR gap from the 2022 age-specific rates.',()=>C.tfr(D.asfr['2022r'])-C.tfr(D.asfr['2022u']),0.02,()=>`${sd(C.tfr(D.asfr['2022r']),2)} − ${sd(C.tfr(D.asfr['2022u']),2)} = ${sd(C.tfr(D.asfr['2022r'])-C.tfr(D.asfr['2022u']),2)}.`),
 N('Compute the national mean age at childbearing for 2022 (years, 1 d.p.).',()=>C.macb(D.asfr['2022']),0.1,()=>`Σ(midpoint × ASFR) ÷ Σ ASFR = ${sd(C.macb(D.asfr['2022']),2)} years.`,'years'),
 Q('Which region has the largest gap between actual and wanted TFR in 2022?',['Greater Accra','Central','North East','Upper East'],1,'Central: 3.6 actual against 2.8 wanted (0.8). North East and Upper East have gaps of only 0.1.')
],
reflect:['Wanted fertility is higher than replacement in every northern region. What does that imply for policies that focus on family planning supply alone?','The 2022 ASFR for age 45–49 is based on very few births. How should it be treated?'],
r:`asfr <- c(63, 156, 190, 176, 128, 53, 14)
tfr <- 5 * sum(asfr) / 1000
mid <- seq(17.5, 47.5, by = 5)
macb <- sum(mid * asfr) / sum(asfr)`});

M.push({id:11,unit:3,title:'Mortality, life tables and the life-expectancy puzzle',ch:'Siegel & Swanson, Chapters 12–13',
brief:`<div class="eyebrow">Learning objectives</div><ul><li>Construct an abridged life table from age-specific death rates.</li><li>Interpret qₓ, lₓ, dₓ, Lₓ, Tₓ and eₓ.</li><li>Explain why published life expectancy estimates for the same country differ.</li></ul>
<h3>From rates to a table</h3>
<div class="formula">qₓ = n·mₓ / (1 + (n − aₓ)·mₓ)         lₓ₊ₙ = lₓ (1 − qₓ)         dₓ = lₓ · qₓ
Lₓ = n·lₓ₊ₙ + aₓ·dₓ          Tₓ = Σ L_y (y ≥ x)          eₓ = Tₓ / lₓ     open interval: L = l / m
Separation factors (Coale–Demeny West): a₀ = 0.053 + 2.800·m₀ (female), 0.045 + 2.684·m₀ (male)</div>
<p>Ghana’s child survival has improved: under-five mortality fell from 155 per 1,000 (1988) to 40 (2022 GDHS). Adult mortality is harder to measure because registration of deaths is incomplete, so life tables rely on models, surveys and census-based indirect methods.</p>
<div class="callout key"><b class="t">The e₀ puzzle</b>UN WPP 2022 puts Ghana’s 2021 life expectancy at 64.3 years, while the CIA World Factbook reported about 69. Differences arise from the data used (death registration, census age, survey-based child mortality), model life tables chosen, and treatment of AIDS and conflict mortality. Always cite the source, vintage and method.</div>`,
lab:'lifetable',
practice:[
 N('For the default model schedule (e₀ = 64.3), what is life expectancy at birth in your table?',()=>C.lifetable(C.modelMx(C.solveK(64.3)),'b').e[0],0.1,()=>`T₀ ÷ l₀ = ${sd(C.lifetable(C.modelMx(C.solveK(64.3)),'b').e[0],2)} years.`,'years'),
 N('What is the under-five mortality rate (₅q₀) per 1,000 in that table?',()=>1000*(1-C.lifetable(C.modelMx(C.solveK(64.3)),'b').l[2]/1e5),0.5,()=>`1,000 × (1 − l₅/l₀) = ${sd(1000*(1-C.lifetable(C.modelMx(C.solveK(64.3)),'b').l[2]/1e5),1)}. The 2022 GDHS estimate was 40.`),
 N('What is the probability (per 1,000) that a 15-year-old dies before age 60 (₄₅q₁₅)?',()=>{const t=C.lifetable(C.modelMx(C.solveK(64.3)),'b');return 1000*(1-t.l[13]/t.l[4]);},3,()=>{const t=C.lifetable(C.modelMx(C.solveK(64.3)),'b');return `1,000 × (1 − l₆₀/l₁₅) = ${sd(1000*(1-t.l[13]/t.l[4]),0)}.`;}),
 N('What is life expectancy at age 60 (e₆₀)?',()=>C.lifetable(C.modelMx(C.solveK(64.3)),'b').e[13],0.2,()=>`T₆₀ ÷ l₆₀ = ${sd(C.lifetable(C.modelMx(C.solveK(64.3)),'b').e[13],2)} years.`,'years'),
 Q('Two agencies publish different e₀ for Ghana in the same year. The most useful first step is to…',['Average them','Check the data sources, model life tables and vintage each used','Pick the higher value','Ignore both'],1,'Differences are explained by inputs and methods, so you must compare those before choosing or combining.')
],
reflect:['Why does e₀ move so much with infant mortality while e₆₀ is less sensitive?','What data would you need to construct a Ghana life table without borrowing a model schedule?'],
r:`lifetable <- function(m, n, a) {
  q <- n*m/(1 + (n - a)*m); q[length(q)] <- 1
  l <- c(1e5, 1e5*cumprod(1 - q))[seq_along(q)]
  d <- l*q; L <- n*c(l[-1], 0) + a*d; L[length(L)] <- l[length(l)]/m[length(m)]
  T <- rev(cumsum(rev(L))); data.frame(q, l, d, L, T, e = T/l)
}`});

M.push({id:12,unit:3,title:'Reproductivity, stable populations and the intrinsic growth rate',ch:'Siegel & Swanson, Chapter 17',
brief:`<div class="eyebrow">Learning objectives</div><ul><li>Compute GRR and NRR from fertility and survivorship.</li><li>Solve Lotka’s equation for the intrinsic growth rate.</li><li>Compare a stable age distribution with an observed one.</li></ul>
<h3>Replacement and stability</h3>
<div class="formula">NRR = Σ 5 · mₐ · ℓₐ        where mₐ = female births per woman of age a, ℓₐ = survival to age a
Lotka:    Σ 5 · mₐ · ℓₐ · e^(−r·a) = 1       r = intrinsic growth rate
Mean generation length T ≈ ln(NRR) / r
Stable age structure   c(a) ∝ e^(−r·a) · L(a)</div>
<p>With the GDHS 2022 schedule and a life expectancy near 64, the net reproduction rate is about 1.7 and the intrinsic growth rate is about 1.9% a year. The observed census growth of 2.08% is <i>higher</i> than the intrinsic rate. That gap is population momentum: Ghana’s age structure is still young because of past high fertility, so many women are entering childbearing ages and growth continues above what today’s rates alone would give.</p>
<div class="callout info"><b class="t">Why stable models still matter</b>Stable and quasi-stable populations give indirect estimation tools when data are poor (Chapter 22) and a baseline for “what if rates stopped changing”.</div>`,
lab:'stable',
practice:[
 N('With the 2022 national schedule and e₀ = 64.3, compute the NRR.',()=>nrr(D.asfr['2022'],64.3).R0,0.02,()=>`NRR = Σ 5·m·ℓ = ${sd(nrr(D.asfr['2022'],64.3).R0,3)}.`),
 N('Solve for the intrinsic growth rate r (% a year).',()=>100*nrr(D.asfr['2022'],64.3).r,0.05,()=>`Solving Σ 5·m·ℓ·e^(−r·a) = 1 gives r = ${sd(100*nrr(D.asfr['2022'],64.3).r,2)}% a year.`,'%'),
 N('Using the 1988 schedule instead (same mortality), what is the NRR?',()=>nrr(D.asfr['1988'],64.3).R0,0.03,()=>`NRR(1988 schedule) = ${sd(nrr(D.asfr['1988'],64.3).R0,3)}.`),
 Q('An NRR above 1 with constant rates implies…',['Eventual population decline','Long-run population growth','Zero growth','No change in age structure'],1,'Each generation of mothers is replaced by a larger generation of daughters.')
],
reflect:['The intrinsic rate (about 1.9%) is below the observed growth rate (2.08%). Explain this with population momentum, and say what else (migration, data errors) could contribute and how you would test it.','What does a young observed age structure imply about a stable population’s age pattern?'],
r:`mid <- seq(17.5, 47.5, 5); m <- c(63,156,190,176,128,53,14)/1000/2.03
l <- function(a, k = 1) exp(-k*(0.3086/10*(1 - exp(-10*a)) + 0.002062*a + 0.0001107/0.08494*(exp(0.08494*a) - 1)))
nrr <- sum(5 * m * l(mid))
r <- uniroot(function(r) sum(5*m*l(mid)*exp(-r*mid)) - 1, c(-0.1, 0.15))$root`});

M.push({id:13,unit:3,title:'Migration and the residual method',ch:'Siegel & Swanson, Chapters 18–19',
brief:`<div class="eyebrow">Learning objectives</div><ul><li>Estimate net migration as a residual and quantify its sensitivity to input errors.</li><li>Separate genuine migration signals from data inconsistencies.</li></ul>
<h3>Residual estimates</h3>
<div class="formula">M = (P₂ − P₁) − (B − D)         (net migration as a residual)
Rate of net migration = M / (mid-period population · t)</div>
<p>International migration data for Ghana are limited: UN estimates give a small negative net migration rate (about −0.16 per 1,000) and an immigrant stock around 1.5% of the population (2024). The 2021 census data include records for emigrants and for people absent from households, and ask about place of birth. Internal migration is large: Greater Accra’s population grew by 36% between 2010 and 2021.</p>
<div class="callout warn"><b class="t">The residual is an error sink</b>Because M equals the difference of totals, any error in P₁, P₂, B or D lands in M. When births are scaled by a few percentage points the implied migration changes by hundreds of thousands: the lab lets you see this.</div>`,
lab:'residual',
practice:[
 N('Using the UN births and deaths pro-rated to 26 Sep 2010 – 27 Jun 2021 and the census change, compute the residual net migration (people).',()=>resid(1,1),30000,()=>`M = 6,173,196 − (B − D) = ${fmt(resid(1,1))}. A negative value implies more natural increase than the census change can explain.`),
 N('If births were only 90% of the UN figure (deaths unchanged), what is the residual?',()=>resid(.9,1),30000,()=>`With births × 0.90 the residual becomes ${fmt(resid(.9,1))}.`),
 Q('A large negative residual most plausibly indicates…',['Mass emigration','Inconsistent inputs (e.g. UN births too high or census undercount) mixed with some migration','Zero migration','A perfect census'],1,'The residual absorbs all errors; here it is far larger than migration estimates from other sources.')
],
reflect:['Build a table of other evidence (immigrant stock, emigrant records, remittance flows) to triangulate Ghana’s net migration.','Why is the residual method more defensible for sub-national areas with good vital registration than for Ghana nationally?'],
r:`B <- sum(c(0.27*844, 864, 883, 896, 898, 916, 902, 876, 897, 872, 875, 0.49*879)) * 1000
D <- sum(c(0.27*221, 221, 221, 223, 220, 225, 220, 223, 228, 229, 237, 0.49*243)) * 1000
M <- (30832019 - 24658823) - (B - D)`});

M.push({id:14,unit:4,title:'Intercensal and postcensal estimates, and evaluating projections',ch:'Siegel & Swanson, Chapter 20',
brief:`<div class="eyebrow">Learning objectives</div><ul><li>Distinguish intercensal, postcensal and projected figures.</li><li>Interpolate and extrapolate using three mathematical models.</li><li>Evaluate estimates against benchmarks with percent error.</li></ul>
<h3>Estimates between and after censuses</h3>
<p>Between the 2010 and 2021 censuses, official users still need annual figures. An <b>intercensal</b> estimate lies between two censuses (interpolation); a <b>postcensal</b> estimate follows the latest census (extrapolation or component methods). Component and housing-unit methods use births, deaths, migration or dwelling counts. The official 2010-based estimate for 1 July 2015 (UN Demographic Yearbook) was 27,670,174, while UN WPP 2022 gives about 28.9 million for the same year.</p>
<div class="formula">Percent error = 100 · (estimate − benchmark) / benchmark
MAPE = mean |percent error|        MALPE = mean percent error (shows bias)</div>
<div class="callout key"><b class="t">Lesson from 2021</b>UN WPP 2022 estimated 32.5 million for 2021, about 5.5% above the census count of 30.8 million. A projection from one census can drift substantially in a decade: the next census is the best test of any estimate.</div>`,
lab:'estimates',
practice:[
 N('Using exponential interpolation between 2010.73 and 2021.49, estimate the population on 1 July 2015 (date 2015.5).',()=>estExp(2015.5),5000,()=>`P = 24,658,823 · exp(r · 4.77), r = ${sd(C.expR(24658823,30832019,T1-T0),5)}: ${fmt(estExp(2015.5))}.`),
 N('By what percent does the UN WPP 2022 estimate for 2015 (28,871,000) exceed your estimate?',()=>100*(28871000-estExp(2015.5))/estExp(2015.5),0.2,()=>`(28,871,000 − ${fmt(estExp(2015.5))}) ÷ ${fmt(estExp(2015.5))} × 100 = ${sd(100*(28871000-estExp(2015.5))/estExp(2015.5),2)}%.`,'%'),
 N('By what percent does the UN WPP 2022 figure for 2021 (32,519,000) exceed the census count?',()=>100*(32519000-30832019)/30832019,0.1,()=>`(32,519,000 − 30,832,019) ÷ 30,832,019 × 100 = ${sd(100*(32519000-30832019)/30832019,2)}%.`,'%'),
 Q('Percent errors of +5%, −3% and +4% have a MALPE of about…',['+2%','0%','+4%','−4%'],0,'(5 − 3 + 4)/3 = 2%. MALPE keeps signs and shows bias.')
],
reflect:['Why might projections made from the 2010 census overshoot the 2021 count? Consider fertility, mortality, migration and base-population errors.','What evidence would persuade you to revise the 2015 estimate after the 2021 census?'],
r:`P1 <- 24658823; P2 <- 30832019; t1 <- 2010.73; t2 <- 2021.49
r  <- log(P2 / P1) / (t2 - t1)
interp <- function(t) P1 * exp(r * (t - t1))
interp(2015.5)`});

M.push({id:15,unit:4,title:'Cohort-component projection lab',ch:'Siegel & Swanson, Chapter 21',
brief:`<div class="eyebrow">Learning objectives</div><ul><li>Implement the cohort-component method with real 2021 census data.</li><li>Test how fertility, mortality and migration assumptions change future population and dependency.</li><li>Communicate projections as scenarios, not predictions.</li></ul>
<h3>The method</h3>
<p>The cohort-component method ages each sex-age group forward, applies survival ratios, adds births from women of childbearing age, and adds net migrants. This lab uses 5-year steps from 2021 to 2051, the census population by age and sex as the base, the GDHS fertility age pattern scaled to a TFR path, and a model mortality schedule scaled to a life-expectancy path.</p>
<div class="formula">P(a+5, t+5) = P(a, t) · S(a)           S = L(a+5) / L(a)  (open interval: T(90)/T(85))
Births over 5 years = 5 · Σ ASFRₐ · scale · [F(a,t) + F(a,t+5)] / 2     scale = target TFR / pattern TFR
Newborns aged 0–4 = births · (5L₀ / 5)     split by sex ratio at birth 1.03</div>
<div class="callout warn"><b class="t">Calibration check</b>With a TFR of 3.9 and e₀ of 64.3 the model grows faster than the census-observed 2.08% a year. Possible reasons: the TFR from a survey differs from the census-implied fertility, children under five are under-counted, or net emigration. Use the readout to explore, and read the discussion prompts.</div>`,
lab:'projection',
practice:[
 N('Under the <b>Constant</b> preset (TFR 3.9, e₀ 64.3), what is the projected 2051 population (millions)?',()=>tot('const',2051)/1e6,0.3,()=>`The model gives ${sd(tot('const',2051)/1e6,1)} million in 2051.`,'million'),
 N('Under the <b>Fast decline</b> preset (TFR 2.1, e₀ 75), what is the projected 2051 population (millions)?',()=>tot('fast',2051)/1e6,0.3,()=>`The model gives ${sd(tot('fast',2051)/1e6,1)} million in 2051.`,'million'),
 N('How many millions fewer people are there in 2051 under fast decline than under the constant scenario?',()=>(tot('const',2051)-tot('fast',2051))/1e6,0.4,()=>`${sd(tot('const',2051)/1e6,1)} − ${sd(tot('fast',2051)/1e6,1)} = ${sd((tot('const',2051)-tot('fast',2051))/1e6,1)} million.`,'million'),
 N('Under the <b>Medium</b> preset, what is the total dependency ratio in 2051?',()=>C.metrics(A.runScenario(A.PRESETS.med).find(s=>s.yr===2051)).td,0.5,()=>`${sd(C.metrics(A.runScenario(A.PRESETS.med).find(s=>s.yr===2051)).td,1)} dependants per 100 persons aged 15–64.`),
 Q('Which assumption has the largest effect on the 2051 population in these scenarios?',['Fertility path','The sex ratio at birth','Ordering of age groups','Census night date'],0,'Most people alive in 2051 were not alive in 2021, so the fertility path governs the number of births.')
],
reflect:['Compare your scenario with the UN or GSS projections. Which assumptions differ and by how much?','Which parts of the model would you improve first: single-year age detail, regional detail, migration pattern, or mortality by cause?'],
r:`# Leslie matrix sketch (female-dominant)
# S[i] survival 5-yr group i -> i+1; asfr scaled to target TFR; births = 5 * sum(asfr * mean(F_t, F_t+5))
step <- function(F, S, asfr, srb = 1.03, l0 = 0.96) {
  Fn <- c(0, F[-length(F)] * S)
  births <- 5 * sum(asfr[1:7] * (F[4:10] + Fn[4:10]) / 2) / 1000
  Fn[1] <- births / (1 + srb) * l0
  Fn
}`});

M.push({id:16,unit:4,title:'Indirect estimation: census survival ratios and reverse survival',ch:'Siegel & Swanson, Chapter 22',
brief:`<div class="eyebrow">Learning objectives</div><ul><li>Compute census survival ratios from two censuses and compare with model survival.</li><li>Use reverse survival to infer births from child counts.</li><li>Diagnose coverage and age-reporting problems from the pattern of deviations.</li></ul>
<h3>When direct data are weak</h3>
<p>Indirect techniques recover rates from age distributions and other aggregate data. A <b>census survival ratio</b> divides a cohort’s size at the second census by its size at the first. If mortality were the only factor the ratio would equal the cohort’s survival probability. Departures from the model reflect migration, coverage differences or age misreporting. <b>Reverse survival</b> works backward: children aged a at the census were born a to a+1 years earlier, so births ≈ count ÷ survival to age a+½.</p>
<div class="formula">CSR(x) = P₂(x + t) / P₁(x)         compare with model ratio L(x+t) / L(x)
Births(t−a) ≈ P(a) / ℓ(a + ½)</div>
<div class="callout key"><b class="t">What the 2021 data suggest</b>Counts of children rise from age 0 (730,592) to age 4 (784,810), even though annual births were roughly flat. That points to under-coverage or age shifting among the youngest children, and it explains why implied births are well below UN estimates.</div>`,
lab:'csr',
practice:[
 N('Compute the observed census survival ratio for the cohort aged 0–4 in 2010 (both sexes) and aged 10–14 in 2021.',()=>g21[2]/g10[0],0.005,()=>`${fmt(g21[2])} ÷ ${fmt(g10[0])} = ${sd(g21[2]/g10[0],3)}.`),

M.push({id:17,unit:5,title:'Survey sampling: precision and design effects',ch:'Siegel & Swanson, Appendix C',
brief:`<div class="eyebrow">Learning objectives</div><ul><li>Compute standard errors, design effects and effective sample size for cluster surveys.</li><li>Plan sample size for a target margin of error.</li></ul>
<h3>Precision in complex surveys</h3>
<p>The 2022 GDHS interviewed 15,014 women aged 15–49 in 618 clusters (18,450 households selected). Because people in a cluster resemble each other, precision is lower than a simple random sample of the same size.</p>
<div class="formula">SE (SRS) = √( p(1 − p) / n )          deff = 1 + (b − 1)·ρ          b = average cluster take
SE (cluster) = SE(SRS) · √deff         Effective n = n / deff          95% margin of error = 1.96 · SE
Required n = 1.96² · p(1 − p) · deff / (margin)²</div>
<div class="callout info"><b class="t">Domains</b>Estimates for regions use a fraction of the sample. Precision falls with the square root of the domain sample size, which is why subnational estimates of rare events are unstable.</div>`,
lab:'survey',
practice:[
 N('Using n = 15,014, 618 clusters and ρ = 0.05, compute the design effect.',()=>1+(15014/618-1)*0.05,0.02,()=>`b = 15,014 ÷ 618 = ${sd(15014/618,1)}; deff = 1 + (b − 1) × 0.05 = ${sd(1+(15014/618-1)*0.05,3)}.`),
 N('For p = 50%, compute the clustered standard error (percentage points).',()=>{const d=1+(15014/618-1)*0.05;return 100*Math.sqrt(0.25/15014*d);},0.01,()=>{const d=1+(15014/618-1)*0.05;return `√(0.25/15,014 × ${sd(d,3)}) × 100 = ${sd(100*Math.sqrt(0.25/15014*d),3)} pp.`;},'pp'),
 N('What is the effective sample size?',()=>15014/(1+(15014/618-1)*0.05),20,()=>`15,014 ÷ ${sd(1+(15014/618-1)*0.05,3)} = ${fmt(15014/(1+(15014/618-1)*0.05))}.`),
 Q('Doubling the number of clusters while keeping n fixed will…',['Raise deff','Lower deff','Not change deff','Make SE zero'],1,'Fewer women per cluster reduces b and therefore the design effect.')
],
reflect:['How would you decide the number of clusters and the cluster size for a new Ghanaian survey with regional estimates?','Why is it risky to compare two regions whose confidence intervals overlap, and what test would you use?'],
r:`n <- 15014; m <- 618; rho <- 0.05; p <- 0.5
b <- n/m; deff <- 1 + (b - 1)*rho
se <- sqrt(p*(1-p)/n * deff); moe <- 1.96*se`});

M.push({id:18,unit:5,title:'Mapping demographic data: classification and the choropleth trap',ch:'Siegel & Swanson, Appendix D',
brief:`<div class="eyebrow">Learning objectives</div><ul><li>Choose variables and class breaks for a regional map and justify them.</li><li>Recognise how classification and normalisation change the message.</li></ul>
<h3>Maps are analyses</h3>
<p>A geographic information system stores layers of points, lines and polygons. Ghana’s 16 regions and 261 districts are polygons; census results can be shown as thematic (choropleth) maps. The lab uses a schematic tile map so every region has equal visual weight, avoiding the bias of large areas.</p>
<div class="formula">Equal interval: width = (max − min) / k
Quantile: each class holds about n / k regions
Normalise counts: map rates, shares or densities rather than raw totals when areas or populations differ greatly</div>
<div class="callout warn"><b class="t">Choropleth trap</b>The same data with different breaks tell different stories. Report the method and number of classes, and test the map with a second classification before drawing conclusions.</div>`,
lab:'tilemap',
practice:[
 N('With 5 classes, what is the equal-interval class width for regional growth rates (% a year, 2 d.p.)?',()=>{const v=R.map(r=>r.rate);return (Math.max(...v)-Math.min(...v))/5;},0.02,()=>{const v=R.map(r=>r.rate);return `(${sd(Math.max(...v),2)} − ${sd(Math.min(...v),2)}) ÷ 5 = ${sd((Math.max(...v)-Math.min(...v))/5,3)}.`;},'pp'),
 Q('A quantile map with 4 classes of 16 regions will show…',['4 regions in each class','Classes of equal width','Only 2 classes','One region per class'],0,'Quantile classes hold equal counts, whatever the spacing of values.'),
 Q('Mapping total population by region mostly shows…',['Where people live (size), not intensity of change','Fertility','Migration','Poverty'],0,'Raw counts largely reproduce the size ranking. Use rates to show change.')
],
reflect:['Create two maps of the same variable that support opposite policy conclusions. What would a responsible caption say?','Why is a tile map better than a conventional map for comparing small and large regions, and what does it hide?'],
r:`library(classInt)

classIntervals(x, n = 5, style = "equal")
classIntervals(x, n = 5, style = "quantile")`});

M.push({id:19,unit:5,title:'Capstone: an evidence brief for Ghana',ch:'All chapters',
brief:`<div class="eyebrow">Learning objectives</div><ul><li>Combine census, survey and projection evidence into a short policy brief.</li><li>State the quality of the evidence and the limits of the model.</li></ul>
<h3>Writing for decision makers</h3>
<p>A good brief states the question, gives a few quantified facts from reliable sources, explains what depends on assumptions, and says what data would reduce uncertainty. The generator below drafts a one-page brief from the course’s data and projection engine for three policy questions: education, health and the labour market. Edit it, replace placeholders with your own analysis, and copy it into your own document.</p>
<div class="callout key"><b class="t">Evidence-quality checklist</b>1) Name the source and date of every number. 2) State whether it is a count, an estimate or a projection. 3) Report known problems (digit preference, undercount of young children, boundary changes). 4) Give a range, not a single path. 5) Say what would change your conclusion.</div>`,
lab:'brief',
practice:[
 Q('Which sentence best belongs in the evidence-quality section of the brief?',['“The numbers are exact.”','“Counts of children under five rise with age, suggesting under-coverage of the youngest.”','“The projection is a forecast.”','“All sources agree.”'],1,'Name specific limitations that affect interpretation.'),
 Q('A projection scenario that reaches 58 million in 2051 should be presented as…',['A prediction','A conditional scenario given stated assumptions, alongside alternatives','A census result','A measurement'],1,'Projections are “what if” statements; show alternatives.'),
 Q('If census and UN figures disagree by 5% for 2021, a careful brief should…',['Use only the larger','State both with their sources and explain the difference','Average them silently','Omit population totals'],1,'Transparency about differing sources is essential.')
],

# ---

# ---

# so every number in the text is traceable to code.`});

    el('p',null,'Modules completed: ',el('b',null,p.d+' of '+p.n)),
    A.table(['Module','Status','Score'],A.mods.map(m=>[m.id+'. '+m.title,S.done[m.id]?'Complete':'Not complete',S.done[m.id]?S.done[m.id].score:'–'])),
    el('div',{class:'row noprint'},el('button',{class:'btn',onclick:()=>{try{window.print();}catch(e){}}},'Print'),el('button',{class:'btn',onclick:()=>{if(confirm('Erase all progress?')){S.done={};S.answers={};save();go('cert');}}},'Reset progress'))));
  return w;
}
A.start=()=>go('home');
})();
window.A.start();
</script>
