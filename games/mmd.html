  --hf:'Outfit',system-ui,sans-serif;--bf:'Inter',system-ui,sans-serif;--rad:14px;

}
:root[data-theme="dark"]{--bg:#0C1020;--card:#151B33;--card2:#1B2342;--ink:#EEF1FF;--muted:#A5AED0;--line:#2A3459;--good:#4ADE80;--bad:#FF6B8A;--dots:rgba(165,174,208,.10);--shadow:rgba(0,0,0,.5);}

[data-lv="s"]{--hf:'Newsreader',Georgia,serif;--bf:'IBM Plex Sans',system-ui,sans-serif;--rad:8px;--acc:#0E7C86;--acc2:#B8901E;--acc3:#B23A48;--gold:#D4A62A}
html{height:100%;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--bf);font-size:16.5px;line-height:1.6}
[data-lv="e"] body,body[data-lv="e"]{background-image:radial-gradient(circle,var(--dots) 1.6px,transparent 1.8px);background-size:24px 24px;font-weight:600}
h1,h2,h3,h4{font-family:var(--hf);line-height:1.15;margin:0 0 .45em;font-weight:800}
[data-lv="s"] h1,[data-lv="s"] h2,[data-lv="s"] h3{font-weight:700;letter-spacing:-.01em}
h1{font-size:clamp(1.9rem,5vw,3rem)} h2{font-size:clamp(1.4rem,3.5vw,2rem)} h3{font-size:1.25rem}
p{margin:.45em 0 .85em}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px;border-radius:8px}
code,.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
.app{max-width:1020px;margin:0 auto;padding:0 16px 70px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;margin:0 -16px 18px;padding:9px 16px;background:var(--bg);border-bottom:2px solid var(--line);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;background:none;border:0;padding:0;cursor:pointer;font-family:var(--hf);font-weight:800;font-size:1.15rem}
.who{display:flex;align-items:center;gap:8px;margin-left:auto;font-size:.88rem}
.xpbar{width:110px;height:12px;border-radius:99px;background:var(--line);overflow:hidden;border:1px solid var(--line)}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));width:0;transition:width .5s}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 10px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-weight:700;font-size:.85rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--rad);padding:20px;box-shadow:0 6px 22px var(--shadow)}
[data-lv="e"] .card{border:3px solid var(--ink);box-shadow:5px 5px 0 var(--ink)}
.card+.card{margin-top:16px}
.btn{display:inline-flex;align-items:center;gap:8px;cursor:pointer;background:var(--acc);color:var(--on);border:1px solid transparent;border-radius:calc(var(--rad) - 4px);padding:.55em 1.2em;font-family:var(--hf);font-weight:800;font-size:1.02rem;transition:transform .08s,filter .15s}
.btn:hover{filter:brightness(1.08);transform:translateY(-1px)} .btn:active{transform:translateY(1px)}
[data-lv="e"] .btn{border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink)}
[data-lv="e"] .btn:active{box-shadow:0 1px 0 var(--ink);transform:translateY(3px)}
.btn.alt{background:var(--card);color:var(--ink);border-color:var(--line)}
[data-lv="e"] .btn.alt{border-color:var(--ink)}
.btn.g2{background:var(--acc2)} .btn.g3{background:var(--acc3)}
.btn.sm{padding:.25em .8em;font-size:.88rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.on{outline:3px solid var(--gold)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:10px 0}
.levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px;margin-top:18px}
.lvcard{cursor:pointer;text-align:left;padding:20px;border-radius:var(--rad);background:var(--card);border:2px solid var(--line);color:var(--ink);transition:transform .12s}
.lvcard:hover{transform:translateY(-4px)}
.lvcard .big{font-size:2.6rem;line-height:1}
.lvcard h3{margin:.3em 0 .1em}
.lvcard.e{border-color:#FF5A87;font-family:'Nunito',sans-serif} .lvcard.a{border-color:#7C6CFF;font-family:'Inter',sans-serif} .lvcard.s{border-color:#0E7C86;font-family:'IBM Plex Sans',sans-serif}
.lvcard.e h3{font-family:'Baloo 2'} .lvcard.a h3{font-family:'Outfit'} .lvcard.s h3{font-family:'Newsreader',serif}
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.world{position:relative;text-align:left;cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:var(--rad);padding:14px 14px 12px;min-height:150px;display:flex;flex-direction:column;gap:3px;color:var(--ink);transition:transform .12s}
[data-lv="e"] .world{border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink)}
.world:hover{transform:translateY(-3px)}
.world .em{font-size:2rem;line-height:1}
.world .nm{font-family:var(--hf);font-weight:800;font-size:1.08rem;line-height:1.15;margin-top:4px}
.world .ch{font-size:.78rem;color:var(--muted)}
.world .st{margin-top:auto;letter-spacing:2px}
.world.lock{opacity:.55;cursor:not-allowed}
.world.next::after{content:"Next up";position:absolute;top:-10px;right:10px;background:var(--acc);color:var(--on);border-radius:99px;padding:0 10px;font-size:.78rem;font-weight:800;font-family:var(--hf)}
.tabs{display:flex;gap:6px;margin:12px 0 16px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--card);padding:6px 16px;border-radius:99px;cursor:pointer;font-family:var(--hf);font-weight:800}
.tab.on{background:var(--acc);color:var(--on);border-color:transparent}
.learn{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:start}
.learn .ic{font-size:3rem;line-height:1;background:var(--card2);border:1px solid var(--line);border-radius:var(--rad);padding:12px 14px}
.learn h3{font-size:1.4rem}
.learn p,.learn li{font-size:1.04rem}
.tag{display:inline-block;font-size:.76rem;font-weight:700;color:var(--muted);border:1px dashed var(--muted);border-radius:99px;padding:0 10px;margin-bottom:6px}
.formula{font-family:'IBM Plex Mono',monospace;background:var(--card2);border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:8px;padding:9px 12px;margin:8px 0;font-size:.92rem;overflow-x:auto;white-space:pre-wrap;font-weight:500}

.hud{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.hearts{font-size:1.4rem;letter-spacing:2px}

.opts{display:grid;gap:9px;margin:10px 0}

[data-lv="e"] input.ans{border:3px solid var(--ink)}
.fb{min-height:1.5em;margin:8px 0;font-weight:700}

.why{background:var(--card2);border-radius:10px;padding:9px 12px;margin:8px 0;font-size:.95rem;border:1px dashed var(--line)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:9px;margin:10px 0}
.kpi{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:8px 12px}

.kpi span{font-size:.76rem;color:var(--muted)}
.ctrl{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;margin:5px 0}
.ctrl label{font-weight:700;font-size:.92rem}

.ctrl input[type=range]{grid-column:1/-1;width:100%;accent-color:var(--acc);height:26px}
.ctrls{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:2px 20px}

.chart text{fill:var(--ink);font-family:var(--bf);font-size:11px}
.chart .mut{fill:var(--muted)} .chart .gl{stroke:var(--line)} .chart .ax{stroke:var(--muted)}
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.callout{border-radius:12px;padding:10px 14px;margin:12px 0;background:var(--card2);border-left:4px solid var(--acc)}
.callout b.t{display:block;font-size:.74rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.win{text-align:center}
.badge{display:inline-grid;place-items:center;width:130px;height:130px;border-radius:50%;background:var(--gold);color:#14182B;font-size:3.3rem;border:3px solid var(--ink);box-shadow:0 6px 0 var(--ink);margin:6px auto 10px;animation:pop .6s cubic-bezier(.2,1.6,.4,1)}

cards:{
e:[['Demography',`<b>Demography</b> is the science of counting people and finding patterns: how many of us there are, where we live, how old we are, and why the number changes. One person\u2019s life is hard to guess, but thousands of births and deaths show clear patterns.`,'🔍'],
['The big count',`A <b>census</b> counts <b>every person</b> in a country, usually on one special night so nobody is counted twice. Ghana\u2019s 2021 census was the country\u2019s first fully digital one: counters used tablets, and it counted <b>30,832,019</b> people.`,'🏠'],
['Other ways',`A <b>survey</b> asks a smaller, carefully chosen group. <b>Registration</b> writes down births and deaths as they happen. <b>Records</b> like school lists were made for other reasons but can help too. Answers are kept secret.`,'📝']],
a:[['Four sources',`<b>Census</b>: counts everyone at one time. <b>Sample survey</b>: asks a chosen part, cheaper and faster, great for details. <b>Vital registration</b>: births, deaths and marriages recorded as they happen. <b>Administrative records</b>: schools, taxes, electricity, collected for other purposes.`,'📚'],
['What makes a census a census',`Four features: <b>individual enumeration</b> (a record per person), <b>universality</b> (everyone in the territory), <b>simultaneity</b> (one reference time) and <b>periodicity</b> (repeated regularly, often every ten years). Ghana has held twelve censuses since 1891.`,'📏'],
['Quality questions',`Ask: is the source <b>valid</b> (does it measure what it claims?) and <b>reliable</b> (consistent)? <b>Primary data</b> you collect yourself; <b>secondary data</b> someone else collected. Vital registration is only as good as its <b>completeness</b>. All results must protect <b>confidentiality</b>.`,'🔎']],
s:[['Census design',`A census has <b>individual enumeration</b>, <b>universality</b>, <b>simultaneity</b> and <b>periodicity</b>. Operations include mapping, questionnaire testing, field training, enumeration, <b>editing</b> (checking and correcting forms) and tabulation. Ghana\u2019s 2021 census used computer-assisted interviewing on tablets and was a <b>de facto</b> count.`,'🏛️'],
['Registration and surveys',`<b>Vital registration</b> yields continuous series of events but depends on legal reporting and completeness. <b>Sample surveys</b> (such as the Demographic and Health Survey) give rich detail from a probability sample, with sampling error. Censuses supply the frame for sampling.`,'🗂️'],
['Administrative and secondary data',`Registers and administrative files (school rolls, tax, electricity) are cheap and timely but defined for non-statistical purposes, so coverage and definitions may not match demographic needs. Statistical laws require <b>confidentiality</b>; disclosure control limits what small-area tables may show.`,'⚖️']]},
qs:{
e:[mc(`A census tries to count\u2026`,[`every person in the country`,`only grown-ups`,`only people in cities`,`only a few friends`],0,`Everyone is counted, usually on one reference night.`),
mc(`A survey asks\u2026`,[`a smaller group chosen carefully`,`everyone`,`nobody`,`only the mayor`],0,`That makes it faster and cheaper.`),
mc(`Why do census counters visit all homes about the same night?`,[`So nobody is counted twice or missed`,`Because it is more fun`,`To sell things`,`To pick teams`],0,`One reference time keeps the count fair.`),
mc(`A birth certificate helps with\u2026`,[`registration of births as they happen`,`counting every home`,`drawing a pie chart`,`finding the average`],0,`Registration records births and deaths continuously.`),
mc(`Why are people\u2019s census answers kept secret?`,[`To protect people and keep their trust`,`Because the counters forget them`,`So nobody can use them`,`They are boring`],0,`Confidentiality is a basic rule of statistics.`),
mc(`Why test the census questions on a few people first?`,[`To find confusing questions before the real count`,`To make the census shorter`,`To count them twice`,`To save paper`],0,`That kind of try-out is called a pilot.`)],
a:[mc(`A school\u2019s list of enrolled students used to estimate the number of children is\u2026`,[`an administrative record`,`a census`,`a survey`,`vital registration`],0,`It was made for school management, then reused.`),
mc(`Which census feature means \u201ceveryone in the territory is included\u201d?`,[`Universality`,`Simultaneity`,`Periodicity`,`Confidentiality`],0,`Universality: nobody is excluded.`),
mc(`If birth registration is voluntary, the main risk is\u2026`,[`incomplete records`,`too many births`,`no deaths`,`perfect data`],0,`Unreported events are missing from the series.`),
mc(`Secondary data are\u2026`,[`collected by someone else, often for another purpose`,`collected by you for your study`,`always wrong`,`always a census`],0,`They are cheap but may not fit your question.`),
mc(`A measure that gives similar results each time it is used is\u2026`,[`reliable`,`valid`,`secret`,`primary`],0,`Reliability is consistency; validity is measuring the right thing.`),
mc(`A sample survey is often preferred to a census when you need\u2026`,[`quick, detailed information at lower cost`,`counts for every village`,`a legal head count`,`every person\u2019s name`],0,`A census gives small-area totals; a survey gives detail cheaply.`)],
s:[mc(`Which feature distinguishes a census from a large survey?`,[`Universality: all persons in the territory are enumerated`,`Larger sample size`,`Use of questionnaires`,`Computer processing`],0,`A survey, however big, covers only a sample.`),
mc(`Editing of census forms means\u2026`,[`checking and correcting errors and inconsistencies`,`deleting unanswered forms`,`translating forms`,`printing tables`],0,`Editing makes the data internally consistent before tabulation.`),
mc(`A strength of vital registration over a census is\u2026`,[`it records events continuously`,`it counts everyone`,`it has no completeness problem`,`it needs no law`],0,`Events appear as they occur; a census is a snapshot.`),
mc(`A weakness of administrative data for demography is\u2026`,[`concepts and coverage are set for other purposes`,`they are always too small`,`they cannot be linked`,`they have no dates`],0,`Definitions may not match demographic needs.`),
mc(`Disclosure control in published tables is needed because\u2026`,[`small cells could identify individuals`,`tables are too large`,`totals would be wrong`,`it reduces bias`],0,`Confidentiality law requires that individuals cannot be identified.`),
mc(`Ghana\u2019s 2021 census was a de facto count, meaning\u2026`,[`people were counted where they spent census night`,`people were counted at their legal residence`,`only citizens were counted`,`only households were counted`],0,`De facto counts the present population.`)]}});

W({id:2,emoji:'🧮',ch:'Book chapter 4',lab:'coverage',
name:{e:'Headcount Heroes',a:'Population Size and Coverage',s:'Coverage Evaluation and Dual-System Estimation'},
tag:{e:'How do we know the count is right?',a:'De facto versus de jure counts, undercount and the tag-and-recapture trick.',s:'Post-enumeration surveys, the dual-system estimator and correlation bias.'},
cards:{
e:[['Who is \u201chere\u201d?',`If a visitor sleeps in your town on census night, are they counted <b>there</b> or <b>at home</b>? Counting people <b>where they are</b> is called <b>de facto</b>. Counting them at the place they <b>belong</b> is <b>de jure</b>. Ghana used de facto in 2021.`,'🏠'],
['Missing people',`Even a great count <b>misses some people</b> and counts a few twice. To check, the statisticians count a small area a second time, on their own, and match the two lists.`,'🔎'],
['The fish trick',`Tag 40 fish and let them swim. Later catch 40 fish and find 10 tagged. Then tagged fish are 1 out of 4 of the pond, so the pond holds about <b>160</b> fish: 40 \u00d7 40 \u00f7 10.`,'🐟']],
a:[['De facto and de jure',`<b>De facto</b>: everyone physically present at the census time. <b>De jure</b>: everyone by usual or legal residence. The choice matters little for a whole country but a lot for small areas with many visitors or commuters.`,'🏘️'],
['Undercount and the PES',`Censuses <b>undercount</b> (people missed) and <b>overcount</b> (counted twice). A <b>post-enumeration survey (PES)</b> re-interviews a sample of areas independently and matches people to the census records to estimate coverage.`,'🧾'],
['Dual-system estimation',`With n\u2081 found by the census, n\u2082 found by the PES and m found by both: <b>N\u0302 = n\u2081 \u00d7 n\u2082 / m</b>. The census <b>coverage rate</b> is n\u2081 / N\u0302. Example: 9,800 and 9,500 with 9,100 matched gives N\u0302 \u2248 10,231 and coverage \u2248 95.8%.`,'🧮']],
s:[['Coverage error',`Net coverage error = omissions \u2212 erroneous enumerations and duplicates. Evaluate it by <b>post-enumeration survey</b> or <b>demographic analysis</b> (comparing the census with births, deaths and migration). A PES must be independent of the census, with exact matching.`,'📉'],
['The dual-system estimator',`<b>Lincoln\u2013Petersen</b>: N\u0302 = n\u2081n\u2082/m. <b>Chapman</b>: (n\u2081+1)(n\u2082+1)/(m+1) \u2212 1, with approximate variance (n\u2081+1)(n\u2082+1)(n\u2081\u2212m)(n\u2082\u2212m)/((m+1)\u00b2(m+2)). Assumptions: closed population, independence of the two systems, perfect matching.`,'📐'],
['Correlation bias',`If the same hard-to-count people are missed by both systems, m is too large and N\u0302 is biased <b>downward</b>. Suppose a share w is captured with probability p<sub>h</sub> and the rest with p. Then N\u0302/N = (\u03a3wp)(\u03a3wp)/\u03a3wp\u00b2 &lt; 1 whenever capture probabilities differ.`,'⚠️']]},
qs:{
e:[mc(`A visitor sleeps in your town on census night. In a de facto count they are counted\u2026`,[`in your town, where they are`,`at their home`,`nowhere`,`twice`],0,`De facto counts people where they are.`),
mc(`Why do statisticians count a small area twice?`,[`To check how many people the first count missed`,`To make more work`,`To count animals`,`To change the answer`],0,`The second, independent count shows what the first missed.`),
mc(`Shy fish are hard to catch. If the shy fish are missed both times, the pond estimate will usually be\u2026`,[`too small`,`too big`,`exactly right`,`impossible`],0,`The same fish are missed twice, so tagged fish seem more common than they are.`),
mc(`In the fish trick, finding MORE tagged fish in the second net means the pond is probably\u2026`,[`smaller`,`bigger`,`the same`,`empty`],0,`Tagged fish are a bigger share, so there are fewer fish in total.`)],
a:[mc(`A de jure census counts people\u2026`,[`at their usual or legal residence`,`where they spend the night`,`only visitors`,`only workers`],0,`De jure = by residence.`),
mc(`A PES (post-enumeration survey) is used to\u2026`,[`estimate coverage errors of the census`,`replace the census`,`print the results`,`hire counters`],0,`It is an independent check on the census.`),
mc(`If the census coverage rate is 95.8%, the omission rate is\u2026`,[`4.2%`,`95.8%`,`1%`,`10%`],0,`100 \u2212 95.8.`),
mc(`In N\u0302 = n\u2081n\u2082/m, a larger m (more matches) makes N\u0302\u2026`,[`smaller`,`larger`,`unchanged`,`negative`],0,`m is in the denominator.`)],
s:[mc(`The dual-system estimator assumes\u2026`,[`independence of the two counts and exact matching`,`that all people are counted once`,`that n\u2081 = n\u2082`,`a sample of one`],0,`Violations, especially dependence, bias the estimate.`),
mc(`Positive correlation between census and PES omissions makes N\u0302\u2026`,[`biased downward`,`biased upward`,`unbiased`,`random`],0,`The same people are missed in both, inflating m.`),
mc(`Demographic analysis evaluates coverage by comparing the census with\u2026`,[`births, deaths and migration records`,`a second census one day later`,`a satellite photo`,`tax returns only`],0,`It checks internal consistency of population components.`),
mc(`Net coverage error equals\u2026`,[`omissions minus erroneous enumerations (including duplicates)`,`omissions plus duplicates`,`the PES count`,`the census count`],0,`Overcounts offset undercounts in the net.`)]},
gen:function(lv){
  if(lv==='e'){const N=S.pick([80,100,160,200,400]),m=1600/N;return {q:`You tag <b>40</b> fish. Later you catch <b>40</b> fish and <b>${m}</b> of them have tags. About how many fish are in the pond? (tagged \u00d7 caught \u00f7 tagged-in-net)`,type:'num',ans:N,tol:0.5,hint:`40 \u00d7 40 \u00f7 ${m}`,why:`40 \u00d7 40 \u00f7 ${m} = ${N} fish.`};}
  if(lv==='a'){const n1=S.int(80,99)*100,n2=S.int(80,99)*100,m=Math.round(Math.min(n1,n2)*S.pick([.93,.95,.97]));
    if(Math.random()<0.5){const N=n1*n2/m;return {q:`A PES area: the census found n\u2081 = ${n1}, the PES found n\u2082 = ${n2}, and m = ${m} were matched. Compute N\u0302 = n\u2081n\u2082/m.`,type:'num',ans:N,tol:1,hint:`Multiply n\u2081 and n\u2082, then divide by m.`,why:`${n1} \u00d7 ${n2} \u00f7 ${m} = ${f(N,1)}.`};}
    const N=n1*n2/m;return {q:`n\u2081 = ${n1} (census), n\u2082 = ${n2} (PES), m = ${m} matched. What is the census <b>coverage rate</b> n\u2081/N\u0302, as a percent?`,type:'num',ans:100*n1/N,tol:0.2,unit:'%',hint:`First find N\u0302 = n\u2081n\u2082/m.`,why:`N\u0302 = ${f(N,1)}; coverage = ${n1} \u00f7 ${f(N,1)} = ${f(100*n1/N,1)}%.`};}
  if(Math.random()<0.5){const n1=S.int(60,95)*10,n2=S.int(60,95)*10,m=Math.round(Math.min(n1,n2)*S.pick([.8,.85,.9]));const ch=(n1+1)*(n2+1)/(m+1)-1;return {q:`n\u2081 = ${n1}, n\u2082 = ${n2}, m = ${m}. Compute the Chapman estimate (n\u2081+1)(n\u2082+1)/(m+1) \u2212 1.`,type:'num',ans:ch,tol:1,hint:`Add 1 to n\u2081, n\u2082 and m before multiplying and dividing.`,why:`${n1+1} \u00d7 ${n2+1} \u00f7 ${m+1} \u2212 1 = ${f(ch,1)}.`};}
  const W=S.pick([.1,.15,.2]),ph=S.pick([.5,.6,.7]),pe=0.97;const e1=(1-W)*pe+W*ph,em=(1-W)*pe*pe+W*ph*ph;return {q:`A share <b>${Math.round(W*100)}%</b> of people is captured with probability <b>${ph}</b> by each system; the rest with 0.97. The two systems are independent within each group. What does the dual-system estimate come to, as a percent of the true population?`,type:'num',ans:100*e1*e1/em,tol:0.2,unit:'%',hint:`Overall capture e = (1\u2212w)\u00b70.97 + w\u00b7p; both-system match = (1\u2212w)\u00b70.97\u00b2 + w\u00b7p\u00b2; N\u0302/N = e\u00b2/match.`,why:`e = ${f(e1,4)}, match = ${f(em,4)}; N\u0302/N = ${f(e1*e1/em,4)} = ${f(100*e1*e1/em,1)}%.`};
}});

W({id:3,emoji:'🗺️',ch:'Book chapters 5\u20136',lab:'geo',
name:{e:'Map Masters',a:'Where People Live',s:'Distribution and Concentration'},
tag:{e:'Crowded places, empty places and the balance point of a country.',a:'Density, regions, urban and rural, and how definitions change the answer.',s:'Density, concentration measures, rank-size and classification effects.'},
cards:{
e:[['Crowded and empty',`People are not spread out evenly. Some places are packed and some are almost empty. <b>Density</b> tells us how many people live in each square kilometre. Ghana had about <b>129 people per km\u00b2</b> in 2021.`,'🏘️'],
['The balance point',`Imagine the map on a pin with every person a tiny equal weight. The <b>centre of population</b> is where it balances. Big cities pull it toward them.`,'⚖️'],
['City or countryside?',`Countries use different rules for \u201curban\u201d. Ghana says a place is urban if <b>5,000 or more</b> people live there. In 2021, <b>56.7%</b> of Ghanaians lived in urban places.`,'🏙️']],
a:[['Density and regions',`<b>Density = people \u00f7 area.</b> Ghana has 16 regions and 261 districts; Greater Accra is the smallest region by area but became the most populous in 2021 (5,455,692 people), just ahead of Ashanti (5,440,463). A <b>metropolitan area</b> groups a big city with places closely tied to it.`,'📍'],
['Urban and rural',`There is no single definition: countries use size, density or type of work. Ghana\u2019s rule is <b>5,000 people</b>. Lower the line and the urban share rises with no one moving. Compare countries only after checking their definitions.`,'🔀'],
['Centre of population',`The <b>centre of population</b> is the point where the map balances if each person has equal weight; it moves as people migrate. <b>Size classes</b> of cities and measures like the <b>rank-size rule</b> (the r-th city is about 1/r of the biggest) describe how places are arranged.`,'🎯']],
s:[['Density and administrative geography',`Density depends on the area chosen; a national average hides huge variation. Comparing the populations of civil divisions across countries is hazardous since average sizes of regions differ from about a thousand to tens of millions. Compare like with like: district boundaries may change between censuses.`,'🧩'],
['Urban definitions',`Urban\u2013rural classification may use size thresholds (Ghana: 5,000), density, economic activity or administrative status. Reclassification of growing localities inflates measured urban growth. The urban\u2013rural growth differential mixes migration, natural increase and reclassification.`,'🔬'],
['Concentration',`The <b>Gini coefficient</b> from a Lorenz curve (1 \u2212 2 \u00d7 area under the curve) measures inequality in the spread of people; the <b>index of dissimilarity</b> D = \u00bd\u03a3|p\u1d62 \u2212 q\u1d62| compares two distributions across areas. The <b>rank-size rule</b> predicts the r-th city at \u2248 P\u2081/r.`,'📐']]},
qs:{
e:[mc(`Density tells us\u2026`,[`how many people live in each square kilometre`,`how old people are`,`how tall a city is`,`how many schools there are`],0,`People divided by area.`),
mc(`The centre of population is\u2026`,[`the balance point of the map if each person is a weight`,`the biggest town`,`the capital`,`the middle of the map`],0,`It is pulled toward crowded places.`),
mc(`In Ghana a place is called urban if it has\u2026`,[`5,000 or more people`,`100 people`,`an airport`,`a king`],0,`That is Ghana\u2019s rule.`),
mc(`If a country lowers its urban line from 5,000 to 2,500, the percent urban will\u2026`,[`go up`,`go down`,`stay the same`,`vanish`],0,`More places count as urban.`)],
a:[mc(`A district has 90,000 people on 300 km\u00b2. Its density is\u2026`,[`300 per km\u00b2`,`90 per km\u00b2`,`27 million per km\u00b2`,`0.3 per km\u00b2`],0,`90,000 \u00f7 300 = 300.`),
mc(`Which region was Ghana\u2019s most populous in 2021?`,[`Greater Accra`,`Northern`,`Volta`,`Upper West`],0,`5,455,692, just ahead of Ashanti.`),
mc(`Why can \u201cpercent urban\u201d be hard to compare between countries?`,[`definitions of urban differ`,`urban is always 50%`,`rural people are not counted`,`cities have no people`],0,`Rules and thresholds vary.`),
mc(`The rank-size rule says the 2nd largest city is about\u2026`,[`half the size of the largest`,`the same size`,`double the size`,`a tenth of the size`],0,`Size of rank r \u2248 largest/r.`)],
s:[mc(`Reclassification of a growing locality from rural to urban will\u2026`,[`raise measured urban growth without any migration`,`lower urban growth`,`have no effect`,`reduce density`],0,`Its whole population moves between categories.`),
mc(`A Gini coefficient near 0 for the distribution of people across regions means\u2026`,[`people are spread almost equally`,`all people live in one region`,`regions are equal in area`,`no one lives there`],0,`0 is perfect equality.`),
mc(`The index of dissimilarity D = \u00bd\u03a3|p\u1d62 \u2212 q\u1d62| measures\u2026`,[`how different two distributions are across areas`,`the density`,`the growth rate`,`the age structure`],0,`It is the share that would have to move to match the other distribution.`),
mc(`Comparing district populations between two censuses is risky because\u2026`,[`boundaries may have been split or merged`,`districts never change`,`people move too fast`,`census counts are random`],0,`Use consistent geography.`)]},
gen:function(lv){
  if(lv==='e'){const area=S.pick([10,20,25,40,50]),d=S.int(20,300);return {q:`A town has <b>${area*d}</b> people and covers <b>${area} km\u00b2</b>. What is its density (people per km\u00b2)?`,type:'num',ans:d,tol:0.5,hint:`Divide people by area.`,why:`${area*d} \u00f7 ${area} = ${d}.`};}
  if(lv==='a'){if(Math.random()<0.5){const u=S.int(30,70)*1000,r=S.int(20,60)*1000;return {q:`A country has ${u.toLocaleString('en-US')} urban and ${r.toLocaleString('en-US')} rural residents. What percent is urban?`,type:'num',ans:100*u/(u+r),tol:0.2,unit:'%',hint:`urban \u00f7 (urban + rural)`,why:`${u} \u00f7 ${u+r} = ${f(100*u/(u+r),1)}%.`};}
    const pop=S.int(2,12)*100000,area=S.pick([500,800,1000,2000,2500]);return {q:`A region has ${pop.toLocaleString('en-US')} people on ${area.toLocaleString('en-US')} km\u00b2. Compute its density (1 decimal).`,type:'num',ans:pop/area,tol:0.1,hint:`people \u00f7 area`,why:`${pop} \u00f7 ${area} = ${f(pop/area,1)}.`};}
  if(Math.random()<0.5){const L=S.int(2,12)*100000,r=S.pick([2,3,4,5]);return {q:`The largest city has ${L.toLocaleString('en-US')} people. By the <b>rank-size rule</b>, how many people does the city of rank <b>${r}</b> have?`,type:'num',ans:L/r,tol:1,hint:`P\u1d63 = P\u2081 / r`,why:`${L} \u00f7 ${r} = ${f(L/r,0)}.`};}
  const part=()=>{let x;do{x=[S.int(10,40),S.int(10,40),S.int(10,40)];}while(S.sum(x)>90);x.push(100-S.sum(x));return x;};const p=part(),qv=part();
  const Dd=0.5*S.sum(p.map((x,i)=>Math.abs(x-qv[i])));return {q:`Group A is spread over four areas as ${p.join('%, ')}%; group B as ${qv.join('%, ')}%. Compute the index of dissimilarity D = \u00bd\u03a3|p\u1d62 \u2212 q\u1d62| (in percentage points).`,type:'num',ans:Dd,tol:0.1,unit:'pts',hint:`Add the absolute differences, then halve.`,why:`|differences| sum = ${f(2*Dd,1)}; half = ${f(Dd,1)}.`};
}});
})();
(function(){
'use strict';
const Q=window.Q,S=window.S;
const mc=(q,o,a,why)=>({q,o,a,why});
const W=w=>Q.worlds.push(w);
const f=(x,d)=>S.f(x,d);

W({id:4,emoji:'🔺',ch:'Book chapter 7',lab:'agesex',
name:{e:'Pyramid Builders',a:'Age and Sex Structure',s:'Age\u2013Sex Composition and Data Quality'},
tag:{e:'Read a country\u2019s age story in one picture.',a:'Pyramids, sex ratio, dependency, median age.',s:'Ageing and dependency indices, heaping, Whipple, Myers and the UN index.'},
cards:{
e:[['The pyramid',`A <b>population pyramid</b> shows how many people are at each age, boys on one side and girls on the other, youngest at the bottom. A <b>wide bottom</b> means lots of children. A <b>wide top</b> means lots of older people.`,'🔺'],
['Boys and girls',`The <b>sex ratio</b> says how many boys and men there are for every 100 girls and women. In Ghana in 2021 there were about <b>97 males for every 100 females</b>.`,'👫'],
['Who looks after whom?',`Children and older people usually need care from working-age adults. The <b>dependency ratio</b> counts kids plus elders for every 100 working-age people. In Ghana it is about <b>66</b>.`,'🤝']],
a:[['Reading a pyramid',`A broad base: many births, a young population. Straight sides: steady numbers. A broad top: an ageing population. Wars, baby booms and migration leave bumps and dents. Ghana\u2019s children (0\u201314) fell from 41.3% (2000) to 35.3% (2021) while 15\u201364 rose to 60.4%.`,'📊'],
['Key measures',`<b>Sex ratio</b> = males per 100 females. <b>Dependency ratio</b> = (0\u201314 + 65+) \u00f7 (15\u201364) \u00d7 100. <b>Ageing index</b> = 65+ per 100 under-15. <b>Median age</b> splits the population in half. Ghana 2021: dependency 65.6, median age about 22.`,'🧮'],
['Age misreporting',`People often round ages to ones ending in 0 or 5 (<b>digit preference</b> or <b>heaping</b>). Because age feeds almost every rate, demographers check it with <b>Whipple\u2019s</b> and <b>Myers\u2019</b> indices.`,'🕵️']],
s:[['Indices',`Total dependency = 100(P\u2080\u208b\u2081\u2084 + P\u2086\u2085\u208a)/P\u2081\u2085\u208b\u2086\u2084; youth and old-age parts separately. Ageing index = 100 P\u2086\u2085\u208a/P\u2080\u208b\u2081\u2084. Median by interpolation within the median group. Ghana 2021: total dependency 65.6 against 75.6 in 2010; ageing index about 12.`,'📐'],
['Heaping',`<b>Whipple</b> = 100 \u00d7 \u03a3P(25,30,\u2026,60) / (\u2155 \u03a3P(23\u202662)); 100 means no preference, 500 means all at 0 or 5. Ghana 2021: about 116 (\u201capproximate\u201d). <b>Myers\u2019 blended index</b> measures preference for each terminal digit (0\u201390).`,'🔬'],

W({id:5,emoji:'🧑\u200d🤝\u200d🧑',ch:'Book chapters 8\u201310',lab:'social',

tag:{e:'Who are we? Families, school and jobs.',a:'Ethnic groups, households, literacy and the labour force.',s:'Classification choices, ILO-style labour definitions and indicator construction.'},
cards:{
e:[['People describe themselves',`In a census, people usually say <b>which group they belong to</b>. The list of groups is made by a country and can change. How a question is asked can change the answers, so counters word questions very carefully.`,'🌈'],
['Homes and families',`A <b>household</b> is people who live together in one home. A <b>family</b> is people who are related. A person living alone is a household but not a family. In Ghana the average household had <b>3.6</b> people in 2021, down from 4.4 in 2010.`,'🏠'],
['School and jobs',`<b>Literacy</b> means being able to read and write. The <b>labour force</b> is people who have a job <b>or</b> are looking for one. Students and retired people are not in it.`,'🎓']],
a:[['Identity questions',`Censuses ask about <b>ethnicity</b>, <b>language</b>, <b>religion</b> and <b>country of birth</b>. Categories are chosen by statisticians and change over time, so comparisons across censuses need care. Ghana\u2019s tabulated groups include Akan, Mole-Dagbani, Ewe, Ga-Dangme and others.`,'🧬'],
['Households and families',`A <b>household</b> shares a home and meals or living arrangements; a <b>family</b> is related by blood, marriage or adoption; <b>group quarters</b> are dorms or care homes. Average household size = population \u00f7 households. Ghana: 4.4 (2010) to 3.6 (2021); urban 3.3, rural 4.0.`,'🏘️'],
['Education and labour force',`<b>Literacy rate</b> = literate \u00f7 population aged 11+ (Ghana 2021: about 72.8%). <b>Labour force</b> = employed + unemployed (jobless and looking). <b>Participation rate</b> = labour force \u00f7 working-age population. <b>Unemployment rate</b> = unemployed \u00f7 labour force.`,'💼']],
s:[['Classification and meaning',`Ethnic, linguistic and religious categories are social constructs set by the census authority; they can be merged or split, and respondents may identify differently across contexts. Diversity indices such as H = \u03a3p\u00b2 (diversity = 1 \u2212 H) depend entirely on the categories used.`,'🏷️'],
['Households and families',`Household definitions (shared housekeeping, same dwelling) differ across countries and censuses, limiting comparability. Headship, household composition and the life-cycle stage of the head determine household size. Group-quarters residents are enumerated separately.`,'🏘️'],
['Economic activity',`Labour force: persons aged 15+ who worked at least one hour for pay in the reference week, or were without work, available and seeking (search in the last four weeks). Discouraged workers and full-time homemakers lie outside it. Indicators: participation, employment-to-population, unemployment; measured against the correct denominator.`,'📏']]},
qs:{

mc(`The labour force is people who\u2026`,[`have a job or are looking for one`,`go to school`,`are over 70`,`live in cities`],0,`Employed plus unemployed.`),
mc(`Literacy means being able to\u2026`,[`read and write`,`run fast`,`draw`,`sing`],0,`That is what the census question asks.`)],

mc(`Why are ethnic counts tricky to compare across censuses?`,[`categories and wording change`,`people never answer`,`counts are always equal`,`they are secret`],0,`Classification is not fixed.`)],

mc(`Which person is employed under the standard reference-week definition?`,[`Someone who worked one hour for pay`,`Someone looking for work`,`A full-time homemaker`,`A discouraged jobseeker`],0,`Any paid work in the reference period counts.`),
mc(`Merging two ethnic groups into one category will\u2026`,[`lower H-based diversity (1 \u2212 \u03a3p\u00b2)`,`raise diversity`,`not change anything`,`remove respondents`],0,`Merging concentrates shares and raises \u03a3p\u00b2.`),
mc(`A literacy rate with \u201call persons\u201d as denominator instead of those aged 11+ will be\u2026`,[`too low if young children are included`,`too high`,`unchanged`,`undefined`],0,`Children who have not yet learned to read lower the rate.`)]},

    const hh=S.int(200,400)*100,p=Math.round(hh*S.pick([3.4,3.6,3.8,4.0,4.4]));return {q:`A district has ${p.toLocaleString('en-US')} people in ${hh.toLocaleString('en-US')} households. Compute the average household size (1 decimal).`,type:'num',ans:p/hh,tol:0.05,hint:`people \u00f7 households`,why:`${p} \u00f7 ${hh} = ${f(p/hh,2)}.`};}

W({id:6,emoji:'📈',ch:'Book chapter 11',lab:'growth',
name:{e:'Growth Garden',a:'Population Change and Growth',s:'Growth Models and Extrapolation'},
tag:{e:'Fill the bathtub: births, deaths and movers.',a:'The balancing equation, growth rates and doubling time.',s:'Linear, geometric and exponential models; errors in extrapolation.'},
cards:{
e:[['The bathtub',`A population is like a bathtub. <b>Births</b> and <b>people moving in</b> pour water in. <b>Deaths</b> and <b>people moving out</b> drain it. The water level is the number of people.`,'🛁'],
['How fast?',`Growth can be slow or fast. A <b>percent change</b> compares the change with where you started. Ghana grew from 24,658,823 (2010) to 30,832,019 (2021): about <b>25%</b> more people.`,'📈'],
['Doubling',`If a population grows by 2% a year it doubles in about <b>35 years</b>. A handy trick: divide <b>70</b> by the percent growth.`,'⏱️']],
a:[['The balancing equation',`<b>P\u2082 = P\u2081 + B \u2212 D + I \u2212 E.</b> Natural increase = B \u2212 D. Net migration = I \u2212 E. Percent change = (P\u2082 \u2212 P\u2081)/P\u2081 \u00d7 100.`,'⚖️'],
['Growth rates',`<b>Exponential rate</b> r = ln(P\u2082/P\u2081) \u00f7 t. Ghana\u2019s growth was about 2.4% (1960\u201370), 2.6, 2.7, 2.5 and <b>2.1%</b> (2010\u201321) a year. <b>Doubling time</b> = ln 2 \u00f7 r \u2248 70 \u00f7 (rate in %).`,'🧮'],
['Dates matter',`Use the real time between census dates: 26 September 2010 to 27 June 2021 is about 10.76 years, not 11. Using 11 understates r by about 2%.`,'📅']],
s:[['Three models',`Linear: P\u2082 = P\u2081(1 + rt). Geometric: P\u2082 = P\u2081(1 + r)\u1d57. Exponential: P\u2082 = P\u2081e\u02b3\u1d57. They agree for short intervals and small r but diverge in extrapolation. The logistic curve adds a ceiling (carrying capacity).`,'📐'],
['Comparability',`Changes in boundaries, definitions or coverage between censuses distort measured growth. Early Ghanaian counts (1891\u20131948) cover changing territory and methods, so their growth rates are not comparable with later ones.`,'🚧'],
['Extrapolation error',`Extending a past rate assumes constant growth. Ghana\u2019s growth slowed after 2010 (2.1% against 2.5%), so extrapolating from 2000\u20132010 overshoots the 2021 census by several percent.`,'⚠️']]},
qs:{

mc(`A population grows from 100 to 125. The percent change is\u2026`,[`25%`,`125%`,`2.5%`,`5%`],0,`Change 25 \u00f7 start 100.`),
mc(`If a place grows 2% a year, about how long to double?`,[`35 years`,`2 years`,`100 years`,`7 years`],0,`70 \u00f7 2 = 35.`),
mc(`Which pours water INTO the tub?`,[`Births`,`Deaths`,`Moving out`,`Nothing`],0,`Births and moving in.`)],
a:[mc(`Natural increase equals\u2026`,[`births minus deaths`,`births plus deaths`,`immigrants minus emigrants`,`end minus start`],0,`B \u2212 D.`),
mc(`A growth rate of 3.5% a year gives a doubling time of about\u2026`,[`20 years`,`35 years`,`7 years`,`70 years`],0,`70 \u00f7 3.5 = 20.`),
mc(`Using 11 years instead of 10.76 for 2010\u20132021 makes the growth rate\u2026`,[`slightly too low`,`slightly too high`,`exactly right`,`negative`],0,`A larger t in the denominator.`),
mc(`Net migration is\u2026`,[`immigrants minus emigrants`,`births minus deaths`,`all movers added`,`only emigrants`],0,`I \u2212 E.`)],
s:[mc(`Which model grows fastest over a long period for the same initial rate?`,[`Exponential or geometric`,`Linear`,`They are equal`,`None`],0,`Compounding outpaces constant increments.`),
mc(`Extrapolating 2000\u20132010 growth to 2021 overshoots because\u2026`,[`growth slowed after 2010`,`growth accelerated`,`census counts are random`,`time passes slowly`],0,`The later rate was lower.`),
mc(`The logistic curve differs from exponential growth because it\u2026`,[`levels off near a carrying capacity`,`never grows`,`goes backwards`,`is linear`],0,`It has an upper limit.`),
mc(`Boundary changes between censuses mainly threaten\u2026`,[`comparability of counts and growth rates`,`the date of the census`,`the median`,`the sex ratio`],0,`A changed area is not the same population.`)]},

    if(t==='r'){const p1=S.int(10,50)*100000,tt=S.pick([10,12,15,20]),rr=S.pick([0.015,0.02,0.025,0.03]),p2=Math.round(p1*Math.exp(rr*tt));const r=Math.log(p2/p1)/tt;return {q:`A population is ${p1.toLocaleString('en-US')} and ${tt} years later ${p2.toLocaleString('en-US')}. Compute the exponential growth rate r = ln(P\u2082/P\u2081)/t as a percent a year (2 decimals).`,type:'num',ans:100*r,tol:0.02,unit:'%',hint:`ln(${p2}/${p1}) \u00f7 ${tt}`,why:`ln(${f(p2/p1,4)}) \u00f7 ${tt} = ${f(r,5)} = ${f(100*r,2)}%.`};}
    const rr=S.pick([1.4,1.8,2.0,2.5,3.0,3.5]);return {q:`A population grows at ${rr}% a year (exponential). Compute its doubling time ln 2 \u00f7 r in years (1 decimal).`,type:'num',ans:Math.log(2)/(rr/100),tol:0.1,unit:'years',hint:`ln 2 = 0.693; r = ${rr/100}`,why:`0.6931 \u00f7 ${rr/100} = ${f(Math.log(2)/(rr/100),1)} years.`};}
  const t=S.pick(['geo','dbl','lin']);const p1=S.int(10,40)*100000,tt=S.pick([10,12,15,20]),p2=Math.round(p1*S.pick([1.25,1.4,1.6,1.8]));
  if(t==='geo')return {q:`P\u2081 = ${p1.toLocaleString('en-US')}, P\u2082 = ${p2.toLocaleString('en-US')}, t = ${tt} years. Compute the <b>geometric</b> annual growth rate (P\u2082/P\u2081)^(1/t) \u2212 1, as a percent (2 decimals).`,type:'num',ans:100*(Math.pow(p2/p1,1/tt)-1),tol:0.02,unit:'%',hint:`Take the ${tt}th root of the ratio.`,why:`(${f(p2/p1,4)})^(1/${tt}) \u2212 1 = ${f(Math.pow(p2/p1,1/tt)-1,5)}.`};
  if(t==='lin')return {q:`P\u2081 = ${p1.toLocaleString('en-US')}, P\u2082 = ${p2.toLocaleString('en-US')}, t = ${tt} years. Compute the <b>linear</b> annual rate (P\u2082/P\u2081 \u2212 1)/t as a percent (2 decimals).`,type:'num',ans:100*((p2/p1-1)/tt),tol:0.02,unit:'%',hint:`(ratio \u2212 1) \u00f7 t`,why:`(${f(p2/p1,4)} \u2212 1) \u00f7 ${tt} = ${f((p2/p1-1)/tt,5)}.`};
  const r=Math.log(p2/p1)/tt;return {q:`P\u2081 = ${p1.toLocaleString('en-US')}, P\u2082 = ${p2.toLocaleString('en-US')} after ${tt} years. At the exponential rate implied, how long does the population take to double (years, 1 decimal)?`,type:'num',ans:Math.log(2)/r,tol:0.2,unit:'years',hint:`First r = ln(P\u2082/P\u2081)/t, then ln 2 \u00f7 r.`,why:`r = ${f(r,5)}; doubling = ${f(Math.log(2)/r,1)} years.`};
}});

W({id:7,emoji:'⚕️',ch:'Book chapters 12\u201314',lab:'mortality',
name:{e:'Life Line',a:'Mortality and Fair Comparisons',s:'Mortality Measures and Life Tables'},
tag:{e:'How long do people live? Follow 100 babies.',a:'Death rates, infant mortality and age adjustment.',s:'Life table functions, life expectancy and model schedules.'},
cards:{
e:[['100 babies',`Imagine <b>100 babies</b> born on the same day. How many are still alive at 5, 20, 60? A <b>life table</b> follows them. In Ghana today about <b>96 of 100</b> babies reach their fifth birthday; in 1988 only about 85 did.`,'👶'],
['Average life',`<b>Life expectancy</b> is the average number of years a newborn can expect to live. For Ghana it rose from about <b>47 years in 1960</b> to about <b>64 years</b> now.`,'🧓'],
['Fair races',`A town with many old people has more deaths even if everyone is healthier! To compare towns fairly, statisticians give both towns the <b>same mix of ages</b> first. That is called <b>age adjustment</b>.`,'⚖️']],
a:[['Death rates',`<b>Crude death rate</b> = deaths \u00f7 population \u00d7 1,000. <b>Age-specific rate</b> uses one age group. <b>Infant mortality rate</b> = infant deaths \u00f7 live births \u00d7 1,000. Ghana: under-five deaths fell from 155 per 1,000 live births (1988) to 40 (2022).`,'📊'],
['Age adjustment',`Crude rates depend on the age mix. <b>Direct standardisation</b> applies each place\u2019s age-specific rates to one standard age distribution, then compares. A younger town can look healthier only because it is younger.`,'🔁'],
['The life table',`Start with 100,000 births (the radix). <b>q</b> is the chance of dying in an age interval, <b>l</b> the number alive at exact age x, <b>d</b> the deaths, <b>e</b> the life expectancy: e\u2093 = T\u2093 \u00f7 l\u2093. Halley made the first real life table in 1693.`,'🧾']],
s:[['Rates and standardisation',`Crude death rate hides age. Direct standardisation: \u03a3 w\u2090 m\u2090 with standard weights w\u2090. Indirect standardisation uses expected deaths from standard rates. Registration completeness above about 90% is needed for direct use of death data.`,'📐'],
['Life table mechanics',`q\u2093 = n\u00b7m\u2093/(1 + (n \u2212 a\u2093)m\u2093), l\u2093\u208a\u2099 = l\u2093(1 \u2212 q\u2093), d\u2093 = l\u2093q\u2093, L\u2093 = n\u00b7l\u2093\u208a\u2099 + a\u2093d\u2093, T\u2093 = \u03a3L, e\u2093 = T\u2093/l\u2093. The open interval uses L = l/m. Separation factors a\u2080 and a\u2081 depend on m\u2080.`,'🧮'],
['Sources of e\u2080 differences',`Published life expectancy for the same country differs by source: UN WPP 2022 gave Ghana about 64.3 years for 2021; other compilations reported about 69. Differences come from data (registration, census ages, child-mortality surveys), model life tables and treatment of adult mortality.`,'🔍']]},
qs:{
e:[mc(`Of 100 babies, 4 die before age 5. How many are alive at 5?`,[`96`,`4`,`100`,`50`],0,`100 \u2212 4.`),
mc(`Life expectancy is\u2026`,[`the average number of years a newborn can expect to live`,`the oldest age ever reached`,`the age of the oldest person`,`the number of babies`],0,`An average over a lifetime.`),
mc(`Why do statisticians \u201cage adjust\u201d death rates?`,[`To compare towns fairly with the same age mix`,`To make rates bigger`,`To hide deaths`,`To count only old people`],0,`Older towns have more deaths even if healthy.`),
mc(`Ghana\u2019s life expectancy since 1960 has\u2026`,[`risen a lot`,`fallen`,`stayed the same`,`vanished`],0,`About 47 to about 64.`)],
a:[mc(`Crude death rate is\u2026`,[`deaths \u00f7 population \u00d7 1,000`,`deaths \u00f7 births`,`population \u00f7 deaths`,`births \u00f7 deaths`],0,`Per 1,000 people.`),
mc(`Infant mortality rate uses which denominator?`,[`Live births`,`Total population`,`Women aged 15\u201349`,`Deaths`],0,`Infant deaths per 1,000 live births.`),
mc(`A town with many old people has a high crude death rate. Age adjustment will\u2026`,[`remove the effect of its age mix before comparing`,`double the rate`,`ignore deaths`,`count only babies`],0,`Both places get the same standard age structure.`),
mc(`In a life table, l\u2093 is\u2026`,[`the number alive at exact age x`,`the chance of dying`,`the years lived`,`the deaths`],0,`Survivors of the radix.`)],
s:[mc(`In the life table, e\u2093 = \u2026`,[`T\u2093 / l\u2093`,`l\u2093 / T\u2093`,`d\u2093 / l\u2093`,`L\u2093 \u00d7 n`],0,`Total years left divided by survivors.`),
mc(`Direct standardisation applies\u2026`,[`each place\u2019s age-specific rates to a common standard population`,`one rate to all ages`,`standard rates to each place\u2019s population`,`only infant rates`],0,`That is the definition.`),
mc(`Which explains different published e\u2080 values for one country?`,[`Different data, model life tables and methods`,`Different calendars`,`Typing mistakes only`,`Different time zones`],0,`Sources make different assumptions.`),
mc(`The open-ended last age interval in a life table uses L =\u2026`,[`l / m`,`l \u00d7 m`,`m / l`,`n \u00d7 l`],0,`Survivors divided by the death rate.`)]},
gen:function(lv){
  if(lv==='e'){if(Math.random()<0.5){const d=S.int(2,12);return {q:`Out of <b>100</b> babies, <b>${d}</b> die before they turn 5. How many are still alive at age 5?`,type:'num',ans:100-d,tol:0.01,hint:`100 minus the ones who died.`,why:`100 \u2212 ${d} = ${100-d}.`};}
    const p=S.int(2,10)*1000,d=S.int(1,9)*10;return {q:`In a town of <b>${p.toLocaleString('en-US')}</b> people, <b>${d}</b> died this year. How many deaths per 1,000 people?`,type:'num',ans:1000*d/p,tol:0.2,hint:`deaths \u00f7 people \u00d7 1,000`,why:`${d} \u00f7 ${p} \u00d7 1,000 = ${f(1000*d/p,1)}.`};}
  if(lv==='a'){const t=S.pick(['cdr','imr','std']);
    if(t==='cdr'){const p=S.int(20,90)*10000,d=Math.round(p*S.pick([.006,.0075,.009,.011]));return {q:`A country has ${p.toLocaleString('en-US')} people and ${d.toLocaleString('en-US')} deaths in a year. Compute the crude death rate per 1,000 (1 decimal).`,type:'num',ans:1000*d/p,tol:0.1,hint:`deaths \u00f7 population \u00d7 1,000`,why:`${d} \u00f7 ${p} \u00d7 1,000 = ${f(1000*d/p,1)}.`};}
    if(t==='imr'){const b=S.int(20,90)*1000,d=Math.round(b*S.pick([.03,.035,.045,.06]));return {q:`There were ${b.toLocaleString('en-US')} live births and ${d.toLocaleString('en-US')} deaths under age 1. Compute the infant mortality rate per 1,000 live births (1 decimal).`,type:'num',ans:1000*d/b,tol:0.1,hint:`infant deaths \u00f7 live births \u00d7 1,000`,why:`${d} \u00f7 ${b} \u00d7 1,000 = ${f(1000*d/b,1)}.`};}
    const r=[S.pick([1,2,3]),S.pick([5,7,9]),S.pick([40,50,60])],w=[S.pick([4000,5000,6000]),2000,0];w[2]=10000-w[0]-w[1];const adj=S.sum(w.map((x,i)=>x*r[i]))/10000;return {q:`A town\u2019s death rates per 1,000 are ${r[0]} (young), ${r[1]} (middle), ${r[2]} (old). The standard population has ${w[0]}, ${w[1]} and ${w[2]} people in those groups. Compute the age-adjusted rate per 1,000 (direct standardisation, 2 decimals).`,type:'num',ans:adj,tol:0.02,hint:`\u03a3 (standard people \u00d7 rate) \u00f7 10,000`,why:`(${w[0]}\u00d7${r[0]} + ${w[1]}\u00d7${r[1]} + ${w[2]}\u00d7${r[2]}) \u00f7 10,000 = ${f(adj,2)}.`};}
  const t=S.pick(['q','e','d']);
  if(t==='q'){const n=S.pick([1,5]),m=S.pick([0.002,0.004,0.01,0.03]);const q=n*m/(1+(n-n/2)*m);return {q:`For an age interval of width n = ${n} with death rate m = ${m}, and a\u2093 = n/2, compute q = n\u00b7m / (1 + (n \u2212 a)\u00b7m) (4 decimals).`,type:'num',ans:q,tol:0.0003,hint:`a = ${n/2}`,why:`${n}\u00d7${m} \u00f7 (1 + ${n/2}\u00d7${m}) = ${f(q,4)}.`};}
  if(t==='e'){const l=S.int(60,95)*1000,T=Math.round(l*S.pick([18,22,28,35]));return {q:`At age x, l\u2093 = ${l.toLocaleString('en-US')} survivors and T\u2093 = ${T.toLocaleString('en-US')} person-years remain. Compute life expectancy e\u2093 (1 decimal).`,type:'num',ans:T/l,tol:0.1,unit:'years',hint:`T\u2093 \u00f7 l\u2093`,why:`${T} \u00f7 ${l} = ${f(T/l,1)} years.`};}
  const l=S.int(80,99)*1000,q=S.pick([0.012,0.02,0.035,0.06]);return {q:`l\u2093 = ${l.toLocaleString('en-US')} and q\u2093 = ${q}. Compute the deaths d\u2093 in the interval.`,type:'num',ans:l*q,tol:1,hint:`d = l \u00d7 q`,why:`${l} \u00d7 ${q} = ${f(l*q,0)}.`};
}});

W({id:8,emoji:'👶',ch:'Book chapters 15\u201317',lab:'fertility',
name:{e:'Baby Boom Bay',a:'Fertility Measures',s:'Fertility, Replacement and Decomposition'},
tag:{e:'How many children does a woman have in her life?',a:'CBR, GFR, age-specific rates and the TFR.',s:'GRR, NRR, mean age at childbearing and exact decomposition.'},
cards:{
e:[['Babies per woman',`Add up the babies women of each age have, and you get the <b>total fertility rate (TFR)</b>: the number of children a woman would have in her life. In Ghana it was <b>6.4</b> in 1988 and <b>3.9</b> in 2022.`,'👩\u200d👧'],
['Cities and villages',`In 2022 women in Ghana\u2019s cities had about <b>3.2</b> children and women in rural areas about <b>4.8</b>. In Greater Accra it was <b>2.9</b> and in the North East Region <b>6.6</b>.`,'🏙️'],
['Replacing ourselves',`If each woman has about <b>2.1</b> children, a population just replaces itself (some do not survive). More than that and each generation is bigger.`,'🔁']],
a:[['Birth measures',`<b>Crude birth rate</b> = births \u00f7 population \u00d7 1,000. <b>General fertility rate</b> = births \u00f7 women 15\u201349 \u00d7 1,000. <b>Age-specific fertility rate (ASFR)</b> = births to women of an age group \u00f7 women of that age \u00d7 1,000.`,'🍼'],
['The TFR',`<b>TFR = 5 \u00d7 \u03a3 ASFR \u00f7 1,000</b> (for 5-year groups). Ghana 2022: ASFRs of 63, 156, 190, 176, 128, 53, 14 give <b>3.9</b>. Fertility peaks at ages 25\u201329. Mean age at childbearing \u2248 29.8 years.`,'🧮'],
['Replacement',`<b>GRR</b> = daughters per woman if no girl died before the end of childbearing = TFR \u00d7 share of girls. <b>NRR</b> counts deaths too: NRR = 1 means exact replacement. TFR \u2248 2.1 is replacement level in low-mortality countries.`,'🔁']],
s:[['Measures and cohorts',`TFR is a <b>period</b> measure from one time window; <b>cohort</b> fertility follows real women. Mean age at childbearing = \u03a3(midpoint \u00d7 ASFR) / \u03a3 ASFR. Fertility by birth order and marital status refine analysis.`,'📐'],
['GRR, NRR and Lotka',`GRR = TFR \u00d7 1/(1 + SRB). NRR = \u03a3 5 m\u2090 \u2113\u2090 (survival-weighted). The intrinsic growth rate r solves \u03a3 5 m\u2090 \u2113\u2090 e\u207b\u02b3\u1d43 = 1. With the 2022 Ghana schedule and e\u2080 \u2248 64: NRR \u2248 1.7, r \u2248 1.9% a year, below observed growth of 2.1% because of population momentum.`,'🔬'],
['Decomposition',`Because TFR = 5\u03a3ASFR/1000, a change in TFR splits exactly by age group: \u0394TFR = \u03a3 5(ASFR\u2081 \u2212 ASFR\u2080)/1000. Between 1988 and 2022 the 20\u201324 group alone contributed \u22120.51 of the 2.5-child fall.`,'🧩']]},
qs:{
e:[mc(`The total fertility rate tells us\u2026`,[`how many children a woman would have in her life`,`how many women there are`,`how old mothers are`,`how many schools`],0,`It adds up fertility at every age.`),
mc(`About what TFR just replaces a population?`,[`2.1`,`6`,`0.5`,`10`],0,`A little over two.`),
mc(`Where did women have MORE children in 2022?`,[`Rural areas`,`Cities`,`Both the same`,`Nowhere`],0,`Rural 4.8 against urban 3.2.`),
mc(`Ghana\u2019s TFR went from 6.4 in 1988 to 3.9 in 2022. That means families are now\u2026`,[`smaller`,`bigger`,`the same`,`unknown`],0,`Fewer children per woman.`)],
a:[mc(`The TFR from 5-year ASFRs is\u2026`,[`5 \u00d7 sum of ASFRs \u00f7 1,000`,`sum of ASFRs`,`sum \u00f7 5`,`ASFR \u00d7 1,000`],0,`Each age group spans 5 years.`),
mc(`The general fertility rate uses which denominator?`,[`Women aged 15\u201349`,`Total population`,`Men`,`Children`],0,`Births per 1,000 women of childbearing age.`),
mc(`An NRR of exactly 1 means\u2026`,[`each generation exactly replaces itself`,`growth of 1%`,`no births`,`no deaths`],0,`Daughters just replace mothers.`),
mc(`Ghana\u2019s fertility peaks at ages\u2026`,[`25\u201329`,`15\u201319`,`40\u201344`,`45\u201349`],0,`190 births per 1,000 women.`)],
s:[mc(`NRR is lower than GRR because\u2026`,[`some daughters die before reaching childbearing ages`,`fewer girls are born`,`TFR is lower`,`women migrate`],0,`NRR incorporates survival.`),
mc(`The intrinsic growth rate is below observed growth in Ghana mainly because of\u2026`,[`population momentum from a young age structure`,`wrong census`,`more deaths`,`no births`],0,`Many women are entering childbearing ages.`),
mc(`TFR is a period measure, which means\u2026`,[`it summarises one year\u2019s rates, not a real cohort`,`it follows real women`,`it ignores age`,`it is always 2.1`],0,`It is a synthetic cohort.`),
mc(`A change in TFR can be split exactly by age group because\u2026`,[`TFR is a linear sum of ASFRs`,`ASFRs are equal`,`all ages contribute the same`,`NRR is constant`],0,`Differences add up age by age.`)]},
gen:function(lv){
  if(lv==='e'){const a=S.pick([0.5,1,1.5]),b=S.pick([1,1.5,2]),c=S.pick([0.5,1]);return {q:`In a made-up country, women have <b>${a}</b> babies on average in their teens and early 20s, <b>${b}</b> in their late 20s and 30s, and <b>${c}</b> in their 40s. How many children does a woman have in her whole life?`,type:'num',ans:a+b+c,tol:0.01,hint:`Add them up.`,why:`${a} + ${b} + ${c} = ${a+b+c}.`};}
  if(lv==='a'){const t=S.pick(['cbr','gfr','tfr']);
    if(t==='cbr'){const p=S.int(10,90)*10000,b=Math.round(p*S.pick([.022,.027,.03,.036]));return {q:`${b.toLocaleString('en-US')} births in a population of ${p.toLocaleString('en-US')}. Compute the crude birth rate per 1,000 (1 decimal).`,type:'num',ans:1000*b/p,tol:0.1,hint:`births \u00f7 population \u00d7 1,000`,why:`${b} \u00f7 ${p} \u00d7 1,000 = ${f(1000*b/p,1)}.`};}
    if(t==='gfr'){const w=S.int(10,40)*10000,b=Math.round(w*S.pick([.09,.11,.13,.15]));return {q:`${b.toLocaleString('en-US')} births to ${w.toLocaleString('en-US')} women aged 15\u201349. Compute the general fertility rate per 1,000 women (1 decimal).`,type:'num',ans:1000*b/w,tol:0.1,hint:`births \u00f7 women 15\u201349 \u00d7 1,000`,why:`${b} \u00f7 ${w} \u00d7 1,000 = ${f(1000*b/w,1)}.`};}
    const as=Array.from({length:7},(_,i)=>Math.round([60,150,190,170,120,50,12][i]*S.pick([.8,1,1.2])));return {q:`Age-specific fertility rates per 1,000 for 7 five-year groups (15\u201319 to 45\u201349): ${as.join(', ')}. Compute the TFR (2 decimals).`,type:'num',ans:5*S.sum(as)/1000,tol:0.01,hint:`5 \u00d7 sum \u00f7 1,000`,why:`Sum = ${S.sum(as)}; 5 \u00d7 ${S.sum(as)} \u00f7 1,000 = ${f(5*S.sum(as)/1000,2)}.`};}
  const t=S.pick(['nrr','mac','dec']);
  if(t==='nrr'){const tf=S.pick([2.4,3.0,3.9,4.5]),sv=S.pick([.85,.9,.95]);const g=tf/2.03;return {q:`TFR = ${tf}, the sex ratio at birth is 1.03 (so girls are 1/2.03 of births) and ${Math.round(sv*100)}% of girls survive to be mothers. Compute NRR = GRR \u00d7 survival (2 decimals).`,type:'num',ans:g*sv,tol:0.02,hint:`GRR = TFR \u00f7 2.03`,why:`GRR = ${f(g,3)}; NRR = ${f(g,3)} \u00d7 ${sv} = ${f(g*sv,2)}.`};}
  if(t==='mac'){const as=[S.int(50,90),S.int(140,170),S.int(170,200),S.int(150,180),S.int(100,130),S.int(40,60),S.int(8,20)];const mid=[17.5,22.5,27.5,32.5,37.5,42.5,47.5];const m=S.sum(as.map((x,i)=>x*mid[i]))/S.sum(as);return {q:`ASFRs: ${as.join(', ')} (midpoints 17.5, 22.5, \u2026, 47.5). Compute the mean age at childbearing \u03a3(midpoint \u00d7 ASFR) \u00f7 \u03a3 ASFR (1 decimal).`,type:'num',ans:m,tol:0.1,unit:'years',hint:`Weighted average of the midpoints.`,why:`\u03a3 = ${f(S.sum(as.map((x,i)=>x*mid[i])),0)}, \u03a3ASFR = ${S.sum(as)}; ratio ${f(m,2)}.`};}
  const a=S.int(80,260),b=S.int(80,260);return {q:`The ASFR for one age group was ${a} per 1,000 in an earlier year and ${b} now. How much did this group contribute to the change in TFR (now \u2212 earlier, 2 decimals)?`,type:'num',ans:5*(b-a)/1000,tol:0.01,hint:`5 \u00d7 (difference) \u00f7 1,000`,why:`5 \u00d7 (${b} \u2212 ${a}) \u00f7 1,000 = ${f(5*(b-a)/1000,2)}.`};
}});

W({id:9,emoji:'✈️',ch:'Book chapters 18\u201319',lab:'migration',
name:{e:'Moving Day',a:'Migration',s:'Migration Measures and the Residual Method'},
tag:{e:'People arrive, people leave, and the island changes.',a:'Immigrants, emigrants, net migration and the residual trick.',s:'Flows and stocks, census survival ratios and the error-sink problem.'},
cards:{
e:[['Arrivals and departures',`<b>Immigrants</b> come in and <b>emigrants</b> go out. The difference is <b>net migration</b>. If 1,500 arrive and 700 leave, the island gains 800 people.`,'🛬'],
['Moving house',`Moving across the street is not migration. Moving to a <b>different town or country</b> is. Young adults move most, so places that receive many movers get younger. Greater Accra grew by <b>36%</b> between 2010 and 2021.`,'🚚'],
['Finding the missing movers',`Nobody counted the movers? You can still work it out: the <b>total change</b> minus the change from <b>births and deaths</b> is what migration must have been.`,'🧩']],
a:[['Words to know',`<b>Immigration</b> and <b>emigration</b> are flows; the number of foreign-born people living in a country is a <b>stock</b> (about 1.5% of people in Ghana, UN 2024). <b>Net migration</b> = immigrants \u2212 emigrants. <b>Gross migration</b> counts all moves. Internal migration crosses a region boundary inside a country.`,'📖'],
['The residual method',`<b>Net migration M = (P\u2082 \u2212 P\u2081) \u2212 (B \u2212 D).</b> Example: start 50,000, end 52,500, births 2,000, deaths 900: natural increase 1,100, so M = 2,500 \u2212 1,100 = <b>+1,400</b>. Net migration rate = M \u00f7 population \u00d7 1,000.`,'🧮'],
['Data sources',`Border and visa records, population registers, census questions on <b>country of birth</b> and <b>previous residence</b>, and surveys. Ghana\u2019s 2021 census data include records for emigrants and absentees. No single source is perfect.`,'🗃️']],
s:[['Residual and its weakness',`M = ΔP − (B − D) <b>absorbs every error</b> in the two census counts and in births and deaths. With UN figures for Ghana 2010\u201321 the residual is about \u2212940,000, far beyond UN net-migration estimates near \u22125,000 a year: it signals inconsistent inputs (UN base 25.6M versus census 24.7M), not mass emigration.`,'⚠️'],
['Census survival ratios',`A cohort\u2019s size at the later census divided by its size at the earlier census should equal its survival probability if there were no migration or error. A ratio above the model value indicates net in-migration, under-count in the first census, over-count in the second or age misreporting.`,'🔬'],
['Internal migration',`Measured by place of birth, previous residence at a fixed date, or registers. Selectivity (migrants are young adults) changes the age structure of origin and destination. Regional growth differences mix migration and natural increase; compare with regional fertility before inferring flows.`,'🧭']]},
qs:{
e:[mc(`If 1,500 people arrive and 700 leave, net migration is\u2026`,[`+800`,`+2,200`,`\u2212800`,`0`],0,`1,500 \u2212 700.`),
mc(`Which counts as migration?`,[`Moving to another town`,`Moving across the street`,`Moving a chair`,`Going to school`],0,`Migration crosses a boundary.`),
mc(`Who usually moves most?`,[`Young adults`,`Babies`,`Very old people`,`Nobody`],0,`That is why migration changes a place\u2019s age mix.`),
mc(`An immigrant is someone who\u2026`,[`comes into a country`,`leaves a country`,`is born there`,`is a visitor`],0,`Immigrants come in; emigrants go out.`)],
a:[mc(`Net migration equals\u2026`,[`immigrants minus emigrants`,`births minus deaths`,`all movers added`,`end minus start`],0,`I \u2212 E.`),
mc(`The residual method finds net migration from\u2026`,[`total change minus natural increase`,`births plus deaths`,`a border count`,`the census forms`],0,`M = (P\u2082 \u2212 P\u2081) \u2212 (B \u2212 D).`),
mc(`A stock of migrants is\u2026`,[`how many foreign-born people live in a place at one time`,`moves in one year`,`a type of boat`,`a tax`],0,`A count at a moment, not a flow.`),
mc(`Gross migration is\u2026`,[`all moves in and out added together`,`in minus out`,`only births`,`deaths`],0,`Net is the balance; gross is the total.`)],
s:[mc(`A large negative residual with UN births and census totals most likely signals\u2026`,[`inconsistent inputs mixed with some migration`,`mass emigration`,`no migration`,`a perfect census`],0,`The residual collects all errors.`),
mc(`A census survival ratio above 1 for a cohort cannot be explained by\u2026`,[`deaths alone`,`in-migration`,`under-count in the first census`,`age misreporting`],0,`Survivors cannot outnumber the original cohort.`),
mc(`Selectivity of migration means\u2026`,[`migrants differ from non-migrants (e.g. younger)`,`everyone migrates equally`,`migrants are random`,`no one migrates`],0,`It changes the composition at both ends.`),
mc(`To interpret regional growth differences, you should also look at\u2026`,[`regional natural increase (e.g. fertility)`,`only the capital`,`rainfall`,`the national median age`],0,`Growth mixes migration and natural increase.`)]},

function play(wd,body,rec,id){
  const p=P();let touches=0;
  const api={touch:()=>{touches++;if(touches===4&&!(p.labs[id])){p.labs[id]=true;addXP(15);Q.toast('Lab bonus: +15 XP');if(Object.keys(p.labs).length>=3)award('lab');save();}}};
  const c=el('div',{class:'card'});body.append(c);
  try{Q.labs[wd.lab](c,state.lv,api);}catch(e){c.append(el('p',null,'Lab error: '+e.message));console.error(e);}
  body.append(el('div',{class:'row'},el('button',{class:'btn',onclick:()=>go('world',id,'quest')},'Start the quest \u2192')));
}
function build(wd,lv,n){
  const out=[];const stat=(wd.qs[lv]||[]).map(q=>({q:q.q,type:'mcq',o:q.o,a:q.a,why:q.why}));
  const pool=S.shuffle(stat);const useGen=wd.gen?Math.ceil(n/2):0;
  for(let i=0;i<useGen;i++){try{const g=wd.gen(lv);if(g)out.push(g);}catch(e){console.error(e);}}
  while(out.length<n&&pool.length)out.push(pool.pop());
  while(out.length<n&&wd.gen){try{out.push(wd.gen(lv));}catch(e){break;}}
  return S.shuffle(out).slice(0,n);
}
function runner(qs,opts,done){
  const L=lvl();let hearts=opts.hearts,idx=0,score=0,streak=0,bestStreak=0,lost=0,xp=0;
  const box=el('div',{class:'card'});
  function hud(){return el('div',{class:'hud'},el('span',{class:'chip'},'Question '+(idx+1)+' / '+qs.length),el('span',{class:'hearts','aria-label':hearts+' hearts'},'❤️'.repeat(hearts)+'🖤'.repeat(Math.max(0,opts.hearts-hearts))),streak>1?el('span',{class:'chip'},'🔥 '+streak+' in a row'):null,el('span',{class:'chip'},'+'+xp+' XP'));}
  function finish(win){const pct=Math.round(100*score/qs.length);done({score,pct,win,bestStreak,lost,xp,total:qs.length});}
  function ask(){
    if(idx>=qs.length||hearts<=0){finish(hearts>0);return;}
    const q=qs[idx];box.innerHTML='';box.append(hud(),el('div',{class:'qtext',html:q.q}));
    if(q.data)box.append(el('div',{class:'data'},q.data));
    const fb=el('div',{class:'fb',role:'status','aria-live':'polite'});let answered=false,hintUsed=false;
    const nextBtn=el('button',{class:'btn',style:'display:none',onclick:()=>{idx++;ask();}},idx===qs.length-1?'Finish \u2192':'Next \u2192');
    const why=el('div',{class:'why',style:'display:none'});
    function result(ok,detail){if(answered)return;answered=true;
      if(ok){score++;streak++;bestStreak=Math.max(bestStreak,streak);const g=10+Math.min(streak-1,5)*2-(hintUsed?2:0);xp+=g;fb.className='fb good';fb.textContent='Correct! +'+g+' XP';if(streak===6)award('fire');}
      else{streak=0;hearts--;lost++;fb.className='fb bad';fb.textContent='Not quite. You lost a heart.';box.classList.remove('shake');void box.offsetWidth;box.classList.add('shake');}
      why.style.display='';why.innerHTML=(detail||'')+(q.why?'<br>'+q.why:'');nextBtn.style.display='';nextBtn.focus();const h=box.querySelector('.hearts');if(h){h.textContent='❤️'.repeat(hearts)+'🖤'.repeat(Math.max(0,opts.hearts-hearts));}
      if(hearts<=0){nextBtn.textContent='See result \u2192';}}
    if(q.type==='mcq'){const order=S.shuffle(q.o.map((t,i)=>({t,i})));box.append(el('div',{class:'opts'},order.map(o=>el('button',{class:'opt',onclick:ev=>{if(answered)return;const ok=o.i===q.a;ev.currentTarget.classList.add(ok?'right':'wrong');if(!ok)box.querySelectorAll('.opt').forEach((b,k)=>{if(order[k].i===q.a)b.classList.add('right');});result(ok);}},o.t))));}
    else{const inp=el('input',{class:'ans',type:'number',step:'any',placeholder:q.unit?('answer in '+q.unit):'your answer','aria-label':'Your answer'});
      const go2=()=>{if(inp.value===''||answered)return;const v=+inp.value;const ok=Math.abs(v-q.ans)<=q.tol;result(ok,ok?'':'The answer was <b>'+S.f(q.ans,Math.abs(q.ans)<10?3:2)+(q.unit?' '+q.unit:'')+'</b>.');};
      inp.addEventListener('keydown',e=>{if(e.key==='Enter')go2();});
      const hb=q.hint?el('button',{class:'btn sm alt',onclick:()=>{if(hintUsed||answered)return;hintUsed=true;hintBox.style.display='';hintBox.textContent='Hint: '+q.hint;hb.disabled=true;}},'Hint (\u22122 XP)'):null;
      const hintBox=el('div',{class:'why',style:'display:none'});
      box.append(el('div',{class:'row'},inp,el('button',{class:'btn',onclick:go2},'Check'),hb),hintBox);}
    box.append(fb,why,nextBtn);
  }
  ask();return box;
}
function quest(wd,body,rec,id){
  const p=P(),L=lvl();
  const intro=el('div',{class:'card'},el('h3',null,'Quest: '+wd.name[state.lv]),el('p',null,'6 questions. You start with '+L.hearts+' hearts. Each correct answer earns XP and streaks earn a bonus. Score 70% or more to master this world.'),el('button',{class:'btn',onclick:start},'Begin quest'));
  body.append(intro);
  function start(){
    body.innerHTML='';const qs=build(wd,state.lv,6);
    body.append(runner(qs,{hearts:L.hearts},r=>{
      body.innerHTML='';
      if(!p.firstQuest){p.firstQuest=true;award('first');}
      const stars=r.pct>=90?3:r.pct>=70?2:r.pct>=50?1:0;
      addXP(r.xp+(r.pct>=70?30:0));
      const was=!!rec.done;
      if(r.pct>=70){rec.done=true;rec.stars=Math.max(rec.stars||0,stars);Q.confetti();}
      if(r.pct===100)award('perfect');if(r.lost===0&&r.pct===100)award('nohurt');
      if(mastered(p)>=5)award('half');if(mastered(p)>=Q.worlds.length)award('all');
      save();
      const win=r.pct>=70;
      body.append(el('div',{class:'card win'},win?el('div',{class:'badge'},wd.emoji):el('div',{style:'font-size:3rem'},'💪'),el('h2',null,win?'World mastered!':'Good try. Let\u2019s go again.'),
        win?el('div',{class:'stars'},'⭐'.repeat(stars)+'☆'.repeat(3-stars)):null,
        el('p',null,r.score+' of '+r.total+' correct ('+r.pct+'%). You earned '+(r.xp+(win?30:0))+' XP'+(win?' (includes a 30 XP mastery bonus)':'')+'.'),
        el('div',{class:'row',style:'justify-content:center'},el('button',{class:'btn alt',onclick:()=>go('world',id,'learn')},'Review lessons'),el('button',{class:'btn g2',onclick:()=>go('world',id,'quest')},'Play again'),el('button',{class:'btn',onclick:()=>go('map')},'Back to map'))));
    }));
  }
}
function boss(){
  const p=P(),L=lvl(),w=el('div');
  const ids=Q.worlds.filter(x=>p.w[x.id]&&p.w[x.id].done);
  w.append(el('div',{class:'row'},el('button',{class:'btn sm alt',onclick:()=>go('map')},'\u2190 Map')),el('h1',null,'🐉 Boss Arena'));
  const card=el('div',{class:'card'},el('p',null,'The Data Dragon asks 8 mixed questions from the worlds you have mastered. You have '+(L.hearts-1)+' hearts. Defeat it with 75% or more.'),el('button',{class:'btn g3',onclick:start},'Fight!'));
  w.append(card);
  function start(){
    const qs=[];for(let i=0;i<8;i++){const wd=S.pick(ids);const q=build(wd,state.lv,1)[0];if(q)qs.push(q);}
    const holder=el('div');w.append(holder);card.remove();
    holder.append(runner(qs,{hearts:Math.max(2,L.hearts-1)},r=>{holder.innerHTML='';const win=r.pct>=75&&r.win;addXP(r.xp+(win?60:0));
      if(r.pct>p.boss){p.boss=r.pct;}if(win){award('boss');Q.confetti();}save();
      holder.append(el('div',{class:'card win'},el('div',{style:'font-size:4rem'},win?'🏆':'🐉'),el('h2',null,win?'You defeated the Data Dragon!':'The dragon survives\u2026 this time.'),el('p',null,r.score+' of 8 correct ('+r.pct+'%). +'+(r.xp+(win?60:0))+' XP.'),el('div',{class:'row',style:'justify-content:center'},el('button',{class:'btn',onclick:()=>go('boss')},'Fight again'),el('button',{class:'btn alt',onclick:()=>go('map')},'Back to map'))));}));
  }
  return w;
}
Q._build=build;
Q.start=()=>go("home");
})();
window.Q.start();
